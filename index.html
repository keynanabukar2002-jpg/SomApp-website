
<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Ayah Marker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8f8f8;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
}

.ayah-marker {
    width: 180px;
    height: 180px;
    position: relative;
    margin: auto;
}

.ayah-marker img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.ayah-number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #b47b12;
    font-family: "Times New Roman", serif;
    font-size: 43px;
    font-weight: bold;
    direction: rtl;
}

.controls {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    background: linear-gradient(135deg,#ffe18a,#bd851c);
    border: 1px solid #a97817;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 20px;
    cursor: pointer;
}

input {
    width: 75px;
    text-align: center;
    font-size: 20px;
    border: 1px solid #c99a38;
    border-radius: 8px;
}
</style>
</head>

<body>

<div class="container">

    <div class="ayah-marker">

        <img
        src="https://i.ibb.co/Z1xLpXCb/file-00000000464c8208a75ea713338fbdb7.png"
        alt="Quran Ayah Ornament">

        <div class="ayah-number" id="ayahNumber">
            ١
        </div>

    </div>

    <div class="controls">
        <button onclick="changeNumber(-1)">−</button>

        <input
        type="number"
        id="ayahInput"
        min="1"
        max="286"
        value="1"
        onchange="updateNumber()">

        <button onclick="changeNumber(1)">+</button>
    </div>

</div>

<script>
function updateNumber() {
    let input = document.getElementById("ayahInput");

    let number = Math.max(
        1,
        Math.min(286, Number(input.value) || 1)
    );

    input.value = number;

    document.getElementById("ayahNumber").textContent =
        number.toLocaleString("ar", {
            useGrouping: false
        });
}

function changeNumber(value) {
    let input = document.getElementById("ayahInput");

    input.value = Number(input.value) + value;

    updateNumber();
}

updateNumber();
</script>

</body>
</html>
