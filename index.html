<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayan App - Adeega Macaash</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .page-fade {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .hide-page {
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            display: none !important;
        }
        .show-page {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
            display: flex !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-center p-2 md:p-4">

    <!-- App Frame (Dhirirka la koobay si uu App ugu muuqdo) -->
    <div class="w-full max-w-sm bg-[#FEFBEA] h-[680px] rounded-[36px] shadow-2xl overflow-hidden flex flex-col relative border-4 border-gray-800">

        <!-- ================= 1. LANDING PAGE ================= -->
        <div id="landingScreen" class="page-fade show-page flex-col justify-between h-full p-5 text-center">
            
            <header class="flex justify-between items-center w-full pt-1">
                <div class="text-xl font-bold tracking-wider text-slate-900">
                    BAY<span class="text-amber-600">AN</span>
                </div>
                <button onclick="toggleTheme()" class="bg-amber-100 p-2 rounded-lg text-xs font-semibold text-amber-900 border border-amber-300">
                    <i class="fa-solid fa-sun text-amber-600"></i>
                </button>
            </header>

            <main class="my-auto py-2 flex flex-col items-center">
                <span class="bg-amber-100 text-amber-800 text-[10px] font-semibold px-2.5 py-1 rounded-full mb-3 border border-amber-200">
                    Welcome to Bayan App
                </span>
                <h1 class="text-2xl font-extrabold text-slate-900 mb-2 leading-tight">
                    Kusoo Dhawoow Bayan-app
                </h1>
                <p class="text-xs text-slate-600 px-2 leading-relaxed mb-4">
                    App-ku wuxuu hal meel ku mideynayaa Qur'aanka, mobile data, camera, calculator, iyo shopping.
                </p>
                <button onclick="switchScreen('mainDashboard')" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow-md transition text-xs">
                    Get Started
                </button>
            </main>

            <footer class="text-[10px] text-slate-400 border-t border-amber-200/60 pt-2">
                © 2026 Bayan App. Xuquuqda waa la dhowray.
            </footer>
        </div>

        <!-- ================= 2. DASHBOARD ================= -->
        <div id="mainDashboard" class="page-fade hide-page flex-col justify-between h-full bg-[#FEFBEA]">
            
            <!-- Content ka dhex-scrolloonaya -->
            <div class="flex-1 overflow-y-auto p-4">
                
                <!-- Header -->
                <div class="flex justify-between items-center pb-3">
                    <p class="text-xs font-semibold text-gray-500">Good Morning</p>
                    <button onclick="switchScreen('landingScreen')" class="text-gray-400 hover:text-red-500 text-xs">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>

                <!-- Green Banner -->
                <div class="bg-emerald-700 text-white p-4 rounded-2xl shadow-md mb-4 relative overflow-hidden">
                    <h2 class="text-xl font-bold tracking-tight">Adeega Macaash</h2>
                    <p class="text-[10px] text-emerald-100 mt-0.5">Macmiil iibso oo dhibco aruurso</p>
                </div>

                <!-- Services Grid (Compact) -->
                <div class="mb-4">
                    <h3 class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Uadeeg shabakadaha</h3>
                    <div class="grid grid-cols-3 gap-2">
                        
                        <!-- Hormuud -->
                        <button onclick="selectService('Hormuud')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center h-20 active:scale-95 transition">
                            <div class="w-8 h-8 rounded-full border border-emerald-600 flex items-center justify-center text-emerald-600 font-bold text-sm mb-1 bg-emerald-50">H</div>
                            <span class="text-[10px] font-bold text-gray-800">Hormuud</span>
                        </button>

                        <!-- Somnet -->
                        <button onclick="selectService('Somnet')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center h-20 active:scale-95 transition">
                            <i class="fa-solid fa-wifi text-sky-600 text-lg mb-1"></i>
                            <span class="text-[10px] font-bold text-gray-800">Somnet</span>
                        </button>

                        <!-- Somtel -->
                        <button onclick="selectService('Somtel')" class="bg-[#FFDC00] p-2 rounded-xl shadow-sm flex flex-col items-center justify-center h-20 active:scale-95 transition">
                            <span class="text-black font-extrabold text-xs mb-1">somtel</span>
                            <span class="text-[10px] font-bold text-gray-800">Somtel</span>
                        </button>

                        <!-- SomLink -->
                        <button onclick="selectService('SomLink')" class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center h-20 active:scale-95 transition">
                            <span class="text-purple-700 font-bold text-xs mb-1">SomLink</span>
                            <span class="text-[10px] font-bold text-gray-800">SomLink</span>
                        </button>

                        <!-- Amtel -->
                        <button onclick="selectService('Amtel')" class="bg-red-700 text-white p-2 rounded-xl shadow-sm flex flex-col items-center justify-center h-20 active:scale-95 transition">
                            <span class="font-bold text-xs mb-1">Amtel</span>
                            <span class="text-[9px] font-bold">Amtel</span>
                        </button>

                        <!-- Rukumo -->
                        <button onclick="selectService('Rukumo')" class="bg-red-50 p-2 rounded-xl shadow-sm border border-red-100 flex flex-col items-center justify-center h-20 active:scale-95 transition">
                            <i class="fa-solid fa-ban text-red-500 text-base mb-1"></i>
                            <span class="text-[10px] font-bold text-gray-800">Rukumo</span>
                        </button>

                    </div>
                </div>

            </div>

            <!-- Bottom Navigation Bar (Fixed bottom) -->
            <div class="bg-white border-t border-gray-200 py-2.5 px-4 flex justify-around items-center text-[10px] text-gray-400">
                <button class="flex flex-col items-center text-indigo-950 font-bold">
                    <i class="fa-solid fa-house text-base mb-0.5"></i>
                    <span>Home</span>
                </button>
                <button class="flex flex-col items-center hover:text-indigo-950">
                    <i class="fa-solid fa-gift text-base mb-0.5"></i>
                    <span>Macaash</span>
                </button>
                <button class="flex flex-col items-center hover:text-indigo-950">
                    <i class="fa-solid fa-clock-rotate-left text-base mb-0.5"></i>
                    <span>Orders</span>
                </button>
                <button class="flex flex-col items-center hover:text-indigo-950">
                    <i class="fa-solid fa-user text-base mb-0.5"></i>
                    <span>Profile</span>
                </button>
            </div>

        </div>

    </div>

    <!-- JS Logic -->
    <script>
        function switchScreen(screenId) {
            const landing = document.getElementById('landingScreen');
            const dashboard = document.getElementById('mainDashboard');

            if (screenId === 'mainDashboard') {
                landing.classList.remove('show-page');
                landing.classList.add('hide-page');
                dashboard.classList.remove('hide-page');
                dashboard.classList.add('show-page');
            } else {
                dashboard.classList.remove('show-page');
                dashboard.classList.add('hide-page');
                landing.classList.remove('hide-page');
                landing.classList.add('show-page');
            }
        }

        function selectService(name) {
            alert('Adeegga la doortay: ' + name);
        }
    </script>
</body>
</html>
