<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Web3 DApp</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0F1117] text-white flex justify-center items-center min-h-screen font-sans antialiased select-none">

    <!-- Mobile Viewport Container -->
    <div class="w-full max-w-[420px] h-screen sm:h-[840px] bg-[#0F1117] flex flex-col relative overflow-hidden sm:rounded-[16px] border border-[#1E2230]">

        <!-- HEADER -->
        <header class="h-[56px] bg-[#0F1117] px-4 border-b border-[#1E2230] flex justify-between items-center shrink-0 z-10">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-[#2F66F6] flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
                <span class="font-extrabold text-lg text-white tracking-tight">Polymarket</span>
            </div>
            
            <div class="flex items-center gap-3">
                <span id="walletStatus" class="text-[11px] font-mono text-amber-400 bg-[#1B1E2B] px-2.5 py-1 rounded-full border border-[#1E2230]">
                    Connecting...
                </span>
            </div>
        </header>

        <!-- MAIN SCROLLABLE CONTENT -->
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 pb-[80px]">

            <!-- PORTFOLIO CARD -->
            <div class="bg-[#1B1E2B] p-4 rounded-[16px] border border-[#1E2230] flex justify-between items-baseline">
                <div>
                    <div class="text-xs text-[#9CA3AF] font-medium mb-0.5">Wallet Balance (POL)</div>
                    <div id="walletBalance" class="text-3xl font-bold text-[#FFFFFF]">0.00 POL</div>
                </div>
                <div class="text-right">
                    <div class="text-xs text-[#9CA3AF] font-medium mb-0.5">Network</div>
                    <div class="text-xs font-bold text-emerald-400">Polygon Chain</div>
                </div>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="openDepositModal()" class="h-[50px] rounded-[8px] bg-[#2F66F6] text-white font-bold text-sm flex items-center justify-center gap-2 hover:bg-blue-600 transition">
                    <i data-lucide="arrow-down-left" class="w-4 h-4 stroke-[2.5]"></i>
                    <span>Deposit</span>
                </button>
                <button onclick="openWithdrawModal()" class="h-[50px] rounded-[8px] bg-[#1E2230] text-white font-bold text-sm flex items-center justify-center gap-2 border border-[#1E2230] hover:bg-slate-800 transition">
                    <i data-lucide="arrow-up-right" class="w-4 h-4 text-[#9CA3AF] stroke-[2.5]"></i>
                    <span>Withdraw</span>
                </button>
            </div>

            <!-- WALLET ADDRESS DISPLAY -->
            <div class="bg-[#1B1E2B]/50 p-3 rounded-xl border border-[#1E2230] text-xs">
                <div class="text-gray-400 mb-1">Connected Wallet Address:</div>
                <div id="walletAddressDisplay" class="font-mono text-blue-400 truncate">Connecting to Trust Wallet...</div>
            </div>

        </main>

        <!-- DEPOSIT MODAL -->
        <div id="depositModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
            <div class="bg-[#1B1E2B] w-full max-w-[340px] rounded-2xl p-5 border border-[#1E2230] space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-sm text-white">Deposit (Polygon)</h3>
                    <button onclick="closeDepositModal()" class="text-[#9CA3AF] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                
                <p class="text-xs text-[#9CA3AF]">Ku shubashada ama ku shubka tooska ah ee boorsadaada:</p>
                
                <div class="bg-[#0F1117] p-3 rounded-xl border border-[#1E2230] flex items-center justify-between">
                    <span id="myAddress" class="text-xs font-mono text-emerald-400 truncate mr-2">Loading...</span>
                    <button onclick="copyMyAddress()" class="text-[#2F66F6] hover:text-white text-xs font-bold shrink-0">Copy</button>
                </div>

                <button onclick="closeDepositModal()" class="w-full h-11 bg-[#2F66F6] text-white font-bold rounded-lg text-sm hover:bg-blue-600">
                    Xir
                </button>
            </div>
        </div>

        <!-- WITHDRAW MODAL -->
        <div id="withdrawModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
            <div class="bg-[#1B1E2B] w-full max-w-[340px] rounded-2xl p-5 border border-[#1E2230] space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-sm text-white">Withdraw (Polygon)</h3>
                    <button onclick="closeWithdrawModal()" class="text-[#9CA3AF] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-[#9CA3AF]">Xaddiga POL ee la dirayo</label>
                        <input type="number" id="withdrawAmount" min="0.01" step="0.01" value="0.1" class="w-full mt-1 bg-[#0F1117] border border-[#1E2230] rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-[#2F66F6]">
                    </div>
                    <div>
                        <label class="text-xs text-[#9CA3AF]">Cinwaanka Qaataha (Recipient Address)</label>
                        <input type="text" id="recipientAddress" placeholder="0x..." class="w-full mt-1 bg-[#0F1117] border border-[#1E2230] rounded-lg p-2.5 text-xs font-mono text-white focus:outline-none focus:border-[#2F66F6]">
                    </div>
                </div>

                <button onclick="sendTransaction()" class="w-full h-11 bg-[#2F66F6] text-white font-bold rounded-lg text-sm hover:bg-blue-600">
                    Dir Lacagta (Send)
                </button>
            </div>
        </div>

    </div>

    <!-- WEB3 CONNECTION SCRIPT -->
    <script>
        let provider, signer, userAddress;

        window.addEventListener('DOMContentLoaded', async () => {
            if (window.ethereum) {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    
                    // Dalbo ogolaansho inuu app-ku xiriro boorsada
                    const accounts = await provider.send("eth_requestAccounts", []);
                    userAddress = accounts[0];
                    signer = await provider.getSigner();

                    // Kusoo bandhig UI-ga
                    document.getElementById('walletStatus').innerText = "Connected";
                    document.getElementById('walletStatus').className = "text-[11px] font-mono text-emerald-400 bg-[#1B1E2B] px-2.5 py-1 rounded-full border border-[#1E2230]";
                    document.getElementById('walletAddressDisplay').innerText = userAddress;
                    document.getElementById('myAddress').innerText = userAddress;

                    // Soo aqri balance-ka dhabta ah ee ku jira wallet-ka
                    updateBalance();

                } catch (err) {
                    console.error(err);
                    document.getElementById('walletStatus').innerText = "Connection Failed";
                }
            } else {
                document.getElementById('walletStatus').innerText = "No Web3 Wallet";
                alert("Fadlan ka fur app-kan Trust Wallet DApp browser-ka dhexdiisa!");
            }
        });

        async function updateBalance() {
            try {
                const balanceWei = await provider.getBalance(userAddress);
                const balanceEth = ethers.formatEther(balanceWei);
                document.getElementById('walletBalance').innerText = parseFloat(balanceEth).toFixed(4) + " POL";
            } catch (err) {
                console.error("Balance error:", err);
            }
        }

        // Send / Withdraw Transaction to Blockchain
        window.sendTransaction = async function() {
            const amount = document.getElementById('withdrawAmount').value;
            const recipient = document.getElementById('recipientAddress').value;

            if (!amount || amount <= 0) return alert("Fadlan geli xaddiga saxda ah!");
            if (!recipient || !recipient.startsWith("0x")) return alert("Fadlan geli cinwaan sax ah (0x...)!");

            try {
                const tx = await signer.sendTransaction({
                    to: recipient,
                    value: ethers.parseEther(amount)
                });

                alert("Transaction-kii waa la diray! Sug inta uu blockchain-ka xaqiijinayo...");
                closeWithdrawModal();

                // Sug inuu block-ku dhamaado si balance-ku u cusboonaado
                await tx.wait();
                alert("Transaction-ku wuu guulaystay!");
                updateBalance();

            } catch (err) {
                console.error(err);
                alert("Cilad ayaa dhacday: " + (err.reason || err.message));
            }
        };

        // UI Modals & Copy
        window.openDepositModal = function() { document.getElementById('depositModal').classList.remove('hidden'); }
        window.closeDepositModal = function() { document.getElementById('depositModal').classList.add('hidden'); }
        window.openWithdrawModal = function() { document.getElementById('withdrawModal').classList.remove('hidden'); }
        window.closeWithdrawModal = function() { document.getElementById('withdrawModal').classList.add('hidden'); }

        window.copyMyAddress = function() {
            navigator.clipboard.writeText(userAddress);
            alert("Cinwaankaaga waa la koobiyeey!");
        };

        lucide.createIcons();
    </script>
</body>
</html>
