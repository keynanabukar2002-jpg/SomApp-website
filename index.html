<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomApp - Pro Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 15px; text-align: center; }
        #profile-setup-section, #search-section, #chat-section { display: none; }
        #chat-box { height: 300px; border: 1px solid #334155; overflow-y: scroll; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #0f172a; display: flex; flex-direction: column; gap: 10px; text-align: left; }
        .msg { background: #334155; padding: 8px 12px; border-radius: 6px; width: fit-content; max-width: 80%; word-break: break-word; display: flex; align-items: center; gap: 8px; }
        .msg img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .input-container { display: flex; gap: 10px; margin-top: 10px; }
        input[type="text"], input[type="file"] { flex: 1; padding: 12px; font-size: 16px; border-radius: 6px; border: none; background: #0f172a; color: #fff; border: 1px solid #334155; outline: none; }
        button { padding: 12px 20px; font-size: 16px; border-radius: 6px; border: none; background: #3b82f6; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .google-btn { background: #ea4335; width: 100%; padding: 14px; font-size: 16px; border-radius: 6px; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        .google-btn:hover { background: #d33828; }
        .user-item { background: #334155; padding: 10px; margin-top: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .user-item img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .back-btn { background: #64748b; margin-bottom: 10px; float: left; }
        #preview-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-top: 10px; display: none; border: 2px solid #3b82f6; }
    </style>
</head>
<body>

    <!-- 1. QAYBTA GOOGLE SIGN-IN -->
    <div id="login-section" class="card">
        <h2>Ku soo dhowow SomApp</h2>
        <p>Fadlan ku gal Google Account-kaaga si aad u bilowdo:</p>
        <button class="google-btn" onclick="loginWithGoogle()">Google ku gal</button>
    </div>

    <!-- 2. QAYBTA SAMEENTA USERNAME-KA & SAWIRKA GALLERY-GA -->
    <div id="profile-setup-section" class="card">
        <h2>Dhammeystir Profile-kaaga</h2>
        <p>Geli Username oo dooro sawir gallery-gaaga ah:</p>
        <div style="margin-bottom: 10px;">
            <input type="text" id="usernameInput" placeholder="Tusaale: Ahmed123">
        </div>
        <div style="margin-bottom: 15px;">
            <input type="file" id="profilePicInput" accept="image/*" onchange="previewImage(event)">
            <br>
            <center><img id="preview-img" alt="Sawirkaaga"></center>
        </div>
        <button onclick="saveProfile()" style="width: 100%;">Kaydi oo Soco</button>
    </div>

    <!-- 3. QAYBTA RAADINTA SAAXIIBKA -->
    <div id="search-section" class="card">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
            <img id="my-avatar" src="" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;">
            <h3 id="welcome-user" style="color: #38bdf8; margin: 0; text-align: left;"></h3>
        </div>
        <p style="text-align: left;">Raadi saaxiibkaaga adigoo gelinaya *username*-kiisa saxda ah:</p>
        
        <div class="input-container">
            <input type="text" id="searchFriendInput" placeholder="Geli username-ka saaxiibka...">
            <button onclick="searchFriend()">Raadi</button>
        </div>
        
        <div id="search-result" style="margin-top: 15px;"></div>
    </div>

    <!-- 4. QAYBTA CHAT-KA GAARKA AH -->
    <div id="chat-section" class="card">
        <button class="back-btn" onclick="goBackToSearch()">⬅️ Ku noqo Raadinta</button>
        <h3 id="chat-title" style="color: #38bdf8; margin-top: 0; text-align: right;"></h3>
        
        <div id="chat-box"></div>

        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Qor fariin..." onkeypress="if(event.key === 'Enter') sendMsg()">
            <button onclick="sendMsg()">Dir</button>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBCe8ZiIPsTxT1fGA0IT3nIUaQjFK67al0",
        authDomain: "somchat-1910a.firebaseapp.com",
        projectId: "somchat-1910a",
        storageBucket: "somchat-1910a.firebasestorage.app",
        messagingSenderId: "981092599681",
        appId: "1:981092599681:web:cc01745c6831ab8ea44a80",
        measurementId: "G-8B6P8RSDQG"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let currentUser = null;
      let userData = null;
      let activeChatRoomId = "";
      let unsubscribeChat = null;
      let base64Image = "";

      // Beddelista sawirka gallery-ga looga soo xulay Base64
      window.previewImage = function(event) {
          const file = event.target.files[0];
          if (file) {
              const reader = new FileReader();
              reader.onload = function(e) {
                  base64Image = e.target.result;
                  const imgElement = document.getElementById("preview-img");
                  imgElement.src = base64Image;
                  imgElement.style.display = "block";
              };
              reader.readAsDataURL(file);
          }
      };

      // Hubi haddii uu isticmaaluhu horay u soo galay
      onAuthStateChanged(auth, async (user) => {
          if (user) {
              currentUser = user;
              const userRef = doc(db, "users", user.uid);
              const userSnap = await getDoc(userRef);

              if (userSnap.exists()) {
                  userData = userSnap.data();
                  showSearchSection();
              } else {
                  document.getElementById("login-section").style.display = "none";
                  document.getElementById("profile-setup-section").style.display = "block";
              }
          }
      });

      // 1. Google Sign-In
      window.loginWithGoogle = async function() {
          const provider = new GoogleAuthProvider();
          try {
              await signInWithPopup(auth, provider);
          } catch (e) {
              console.error("Khalad Google Login ah: ", e);
          }
      };

      // 2. Kaydinta Username-ka iyo Sawirka Profile-ka (Firestore Database iyadoo la adeegsanayo Base64)
      window.saveProfile = async function() {
          const username = document.getElementById("usernameInput").value.trim();

          if (!username) {
              alert("Fadlan geli username!");
              return;
          }
          if (!base64Image) {
              alert("Fadlan dooro sawir profile gallery-gaaga ah!");
              return;
          }

          try {
              userData = {
                  uid: currentUser.uid,
                  username: username,
                  email: currentUser.email,
                  photoURL: base64Image
              };

              // Ku keydi Firestore
              await setDoc(doc(db, "users", currentUser.uid), userData);
              await setDoc(doc(db, "usernames", username), { uid: currentUser.uid });

              showSearchSection();
          } catch (e) {
              console.error("Khalad kaydinta ah: ", e);
              alert("Khalad ayaa dhacay intii profile-ka la keydiyay.");
          }
      };

      function showSearchSection() {
          document.getElementById("login-section").style.display = "none";
          document.getElementById("profile-setup-section").style.display = "none";
          document.getElementById("search-section").style.display = "block";
          document.getElementById("welcome-user").innerText = userData.username;
          document.getElementById("my-avatar").src = userData.photoURL;
      }

      // 3. Raadinta Saaxiibka
      window.searchFriend = async function() {
          const friendUsername = document.getElementById("searchFriendInput").value.trim();
          const resultDiv = document.getElementById("search-result");
          resultDiv.innerHTML = "";

          if (!friendUsername) return;

          if (friendUsername === userData.username) {
              resultDiv.innerHTML = "<p style='color: #f87171;'>Naftaada lama sheekaysan kartid!</p>";
              return;
          }

          try {
              const usernameSnap = await getDoc(doc(db, "usernames", friendUsername));
              if (usernameSnap.exists()) {
                  const friendUid = usernameSnap.data().uid;
                  const friendSnap = await getDoc(doc(db, "users", friendUid));
                  const friendData = friendSnap.data();

                  resultDiv.innerHTML = `
                      <div class="user-item">
                          <div style="display: flex; align-items: center; gap: 10px;">
                              <img src="${friendData.photoURL}">
                              <span><b>${friendData.username}</b></span>
                          </div>
                          <button onclick='openChat(${JSON.stringify(friendData)})'>Sheekeyso</button>
                      </div>
                  `;
              } else {
                  resultDiv.innerHTML = "<p style='color: #f87171;'>Saaxiibkan lama helin!</p>";
              }
          } catch (e) {
              console.error("Khalad raadinta ah: ", e);
          }
      };

      // 4. Furitaanka Chat-ka Gaarka ah
      window.openChat = function(friend) {
          activeChatRoomId = [userData.uid, friend.uid].sort().join("_");

          document.getElementById("search-section").style.display = "none";
          document.getElementById("chat-section").style.display = "block";
          document.getElementById("chat-title").innerText = `Chat: ${friend.username}`;

          loadMessages();
      };

      window.goBackToSearch = function() {
          if (unsubscribeChat) unsubscribeChat();
          document.getElementById("chat-section").style.display = "none";
          document.getElementById("search-section").style.display = "block";
      };

      // 5. Dirista Fariimaha
      window.sendMsg = async function() {
          const input = document.getElementById("messageInput");
          if (!input.value.trim()) return;

          try {
              await addDoc(collection(db, "chats", activeChatRoomId, "messages"), {
                  senderUid: userData.uid,
                  senderName: userData.username,
                  senderPhoto: userData.photoURL,
                  message: input.value,
                  timestamp: serverTimestamp()
              });
              input.value = "";
          } catch (e) {
              console.error("Khalad dirista ah: ", e);
          }
      };

      // 6. Soo bandhigida fariimaha si Real-time ah
      function loadMessages() {
          const msgRef = collection(db, "chats", activeChatRoomId, "messages");
          const q = query(msgRef, orderBy("timestamp", "asc"));

          unsubscribeChat = onSnapshot(q, (snapshot) => {
              const chatBox = document.getElementById("chat-box");
              chatBox.innerHTML = "";
              
              snapshot.forEach((doc) => {
                  const data = doc.data();
                  chatBox.innerHTML += `
                      <div class="msg">
                          <img src="${data.senderPhoto}">
                          <div><b>${data.senderName}:</b> ${data.message}</div>
                      </div>
                  `;
              });
              
              chatBox.scrollTop = chatBox.scrollHeight;
          });
      }
    </script>
</body>
</html>
