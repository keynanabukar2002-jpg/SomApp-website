<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Qur'aan Kariim - 114 Suuradood</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #e9e2d3;
  font-family: Arial, sans-serif;
  color: #172d50;
}

header {
  background: #142b4d;
  color: #f4d58a;
  text-align: center;
  padding: 18px 10px;
}

header h2 { margin: 0 0 12px; }

select, button {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #c6a45c;
  font-size: 16px;
}

select {
  width: min(90%, 420px);
  background: #fffaf0;
  color: #142b4d;
}

button {
  background: #c6a45c;
  color: #142b4d;
  cursor: pointer;
  font-weight: bold;
  margin: 5px;
}

#pages {
  padding: 18px 10px;
}

.page {
  max-width: 850px;
  min-height: 900px;
  margin: 15px auto;
  padding: 35px 25px;
  background: #fffaf0;
  border: 9px double #b18b42;
  outline: 3px solid #142b4d;
  outline-offset: -16px;
  box-shadow: 0 4px 15px #0002;
  text-align: center;
}

.ornament {
  color: #b18b42;
  font-size: 25px;
  margin: 8px;
}

.surah-title {
  color: #142b4d;
  font-size: 30px;
  margin: 25px 0;
  padding: 15px;
  border-top: 2px solid #b18b42;
  border-bottom: 2px solid #b18b42;
  font-family: 'Amiri', serif;
}

.bismillah {
  font-size: 26px;
  line-height: 2;
  margin: 20px 0;
  color: #9a3412;
  font-family: 'Amiri', serif;
  border-bottom: 1px dashed #c6a45c;
  padding-bottom: 10px;
}

.verses {
  direction: rtl;
  text-align: justify;
  text-align-last: center;
  font-family: "Traditional Arabic", "Noto Naskh Arabic", "Amiri", serif;
  font-size: 26px;
  line-height: 2.3;
  color: #172d50;
}

.ayah {
  display: inline;
}

.marker {
  display: inline-flex;
  width: 32px;
  height: 32px;
  border: 2px solid #b18b42;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  margin: 0 4px;
  color: #142b4d;
  vertical-align: middle;
  background: #fef08a;
  font-family: Arial, sans-serif;
  font-weight: bold;
}

.status {
  text-align: center;
  padding: 15px;
  color: #142b4d;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h2>القرآن الكريم</h2>
  <div>114 Suuradood</div>
  <br>

  <div class="controls">
    <select id="surahSelect">
      <option value="">Dooro Suurada</option>
    </select>
    <br>
    <button onclick="loadSurah()">Fur Suurada</button>
    <button onclick="window.print()">Daabac / PDF</button>
  </div>
</header>

<div class="status" id="status">
  Fadlan sug, Qur'aanka ayaa la soo rarayaa...
</div>

<main id="pages"></main>

<script>
const select = document.getElementById("surahSelect");
const pages = document.getElementById("pages");
const statusBox = document.getElementById("status");

let quranData = [];

async function initialize() {
  try {
    const response = await fetch("https://api.alquran.cloud/v1/quran/quran-simple");
    if (!response.ok) throw new Error("Xogta lama helin");

    const result = await response.json();
    quranData = result.data.surahs;

    quranData.forEach(surah => {
      const option = document.createElement("option");
      option.value = surah.number;
      option.textContent = surah.number + ". " + surah.name;
      select.appendChild(option);
    });

    statusBox.textContent = "114-ka suuradood waa diyaar. Dooro suurada aad rabto.";

  } catch (error) {
    statusBox.textContent = "Xogta lama soo dejin. Hubi internet-kaaga kadib dib u fur bogga.";
  }
}

function loadSurah() {
  const number = Number(select.value);

  if (!number) {
    statusBox.textContent = "Fadlan dooro suurad.";
    return;
  }

  const surah = quranData.find(s => s.number === number);
  if (!surah) return;

  pages.innerHTML = "";

  const page = document.createElement("section");
  page.className = "page";

  const ornament = document.createElement("div");
  ornament.className = "ornament";
  ornament.textContent = "❖ ✿ ❖";

  const title = document.createElement("h2");
  title.className = "surah-title";
  title.textContent = surah.name;

  page.appendChild(ornament);
  page.appendChild(title);

  // Bismillah kore (Marka laga reebo Suuradda At-Tawbah / 9)
  if (number !== 9) {
    const bismillah = document.createElement("div");
    bismillah.className = "bismillah";
    bismillah.textContent = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
    page.appendChild(bismillah);
  }

  const verses = document.createElement("div");
  verses.className = "verses";

  surah.ayahs.forEach(ayah => {
    let text = ayah.text;

    // Ka sifee Bismilaahda haddii ay API-ga uga soo dhex muuqato aayadda 1aad
    if (number !== 9 && ayah.numberInSurah === 1) {
      text = text.replace(/بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ/g, "").trim();
    }

    const textSpan = document.createElement("span");
    textSpan.className = "ayah";
    textSpan.textContent = text + " ";

    const marker = document.createElement("span");
    marker.className = "marker";
    marker.textContent = ayah.numberInSurah;

    verses.appendChild(textSpan);
    verses.appendChild(marker);
    verses.appendChild(document.createTextNode(" "));
  });

  page.appendChild(verses);

  const bottom = document.createElement("div");
  bottom.className = "ornament";
  bottom.textContent = "❖ ✿ ❖";
  page.appendChild(bottom);

  pages.appendChild(page);
  statusBox.textContent = surah.name + " — " + surah.ayahs.length + " aayadood";
}

initialize();
</script>

</body>
</html>
