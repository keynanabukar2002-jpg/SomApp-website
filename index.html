<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            background: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .chat-header {
            background: #334155;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.received {
            background: #334155;
            align-self: flex-start;
        }
        .message.sent {
            background: #2563eb;
            align-self: flex-end;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #0f172a;
            color: #f8fafc;
            outline: none;
        }
        .chat-input-area button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            margin-left: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input-area button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="status-dot"></div>
        WhatsApp Style Chat
    </div>
    <div class="chat-messages" id="messageBox">
        <div class="message received">Kem cho? Aa ek sample chat app chhe[span_5](start_span)[span_5](end_span).</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Message lakho..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Moklo</button>
    </div>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById('userInput');
        const messageText = input.value.trim();
        
        if (messageText === '') return;

        const messageBox = document.getElementById('messageBox');

        // User message
        const sentDiv = document.createElement('div');
        sentDiv.classList.add('message', 'sent');
        sentDiv.textContent = messageText;
        messageBox.appendChild(sentDiv);

        input.value = '';
        messageBox.scrollTop = messageBox.scrollHeight;

        // Auto reply mock (WhatsApp feel)
        setTimeout(() => {
            const receivedDiv = document.createElement('div');
            receivedDiv.classList.add('message', 'received');
            receivedDiv.textContent = "Tamaro sandesho malyo che: " + sentDiv.textContent;
            messageBox.appendChild(receivedDiv);
            messageBox.scrollTop = messageBox.scrollHeight;
        }, 1000);
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
