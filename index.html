<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SOMEDIA - YouTube Shorts Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .brand-logo-img {
      height: 28px;
      width: 28px;
      object-fit: cover;
      border-radius: 6px;
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
    }

    .upload-nav-img {
      height: 26px;
      width: 26px;
      object-fit: cover;
      border-radius: 6px;
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
      transition: transform 0.2s ease;
    }
    .upload-nav-img:active { transform: scale(0.9); }
  </style>
</head>
<body class="pt-14 pb-16 min-h-screen flex flex-col justify-between">

  <!-- FIXED TOP HEADER -->
  <header class="fixed top-0 left-0 right-0 h-14 bg-[#0f0f0f] border-b border-zinc-800 z-30 flex items-center justify-between px-4">
    <div class="flex items-center gap-2.5">
      <button onclick="showToast('Home View')" class="text-white text-base">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <span class="text-xl font-black uppercase tracking-tight text-white">SOMEDIA</span>
      <img src="https://i.ibb.co/dwDSVhQm/20261022-043354998.png" alt="SOMEDIA Logo" class="brand-logo-img">
    </div>
    <div class="flex items-center gap-4">
      <button onclick="showToast('Search active')" class="text-white text-lg">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <button onclick="showToast('Notifiyada waa kuwo firfircoon')" class="relative text-white text-lg">
        <i class="fa-regular fa-bell"></i>
        <span class="absolute -top-1 -right-2 bg-red-600 text-white text-[9px] font-bold px-1 rounded-full">9+</span>
      </button>
    </div>
  </header>

  <!-- CATEGORIES BAR -->
  <nav class="flex items-center gap-2 px-3 py-2.5 overflow-x-auto no-scrollbar border-b border-zinc-800/60 bg-[#0f0f0f]">
    <button class="bg-zinc-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0">
      <i class="fa-regular fa-compass"></i>
    </button>
    <button class="bg-white text-black px-3.5 py-1.5 rounded-lg text-xs font-semibold shrink-0">Dhammaan</button>
    <button class="bg-zinc-800 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shrink-0">Somali Tech</button>
    <button class="bg-zinc-800 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shrink-0">Musig</button>
    <button class="bg-zinc-800 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shrink-0">Ciyaaro</button>
  </nav>

  <!-- MAIN FEED CONTAINER -->
  <main class="p-3 max-w-md mx-auto w-full flex-1">
    <div class="flex items-center justify-between mb-3 px-1">
      <div class="flex items-center gap-2 text-base font-bold">
        <i class="fa-solid fa-bolt text-red-600"></i>
        <span>Shorts Feed</span>
      </div>
      <div class="flex items-center gap-2">
        <span id="videoCountBadge" class="text-xs bg-zinc-800 px-2.5 py-0.5 rounded-full text-zinc-400">2 videos</span>
        <button onclick="openCameraModal()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-2.5 py-1 rounded-lg font-semibold flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> Soo geli
        </button>
      </div>
    </div>

    <!-- SHORTS GRID -->
    <div id="shortsGrid" class="grid grid-cols-2 gap-2.5 min-h-[300px]"></div>
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 h-13 bg-[#0f0f0f] border-t border-zinc-800 flex justify-around items-center z-30 max-w-md mx-auto">
    <button class="flex flex-col items-center gap-0.5 text-white w-1/5 py-1">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[10px]">Home</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 text-zinc-400 w-1/5 py-1">
      <i class="fa-solid fa-bolt text-base"></i>
      <span class="text-[10px]">Shorts</span>
    </button>

    <!-- CENTER UPLOAD BUTTON -->
    <button onclick="openCameraModal()" class="flex flex-col items-center justify-center w-1/5 py-1">
      <img src="https://i.ibb.co/dwDSVhQm/20261022-043354998.png" alt="Soo geli" class="upload-nav-img">
      <span class="text-[10px] text-white font-medium mt-0.5">Soo geli</span>
    </button>

    <button class="flex flex-col items-center gap-0.5 text-zinc-400 w-1/5 py-1">
      <i class="fa-solid fa-layer-group text-base"></i>
      <span class="text-[10px]">Subscriptions</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 text-zinc-400 w-1/5 py-1">
      <div class="w-5 h-5 rounded-full bg-orange-600 text-white flex items-center justify-center font-bold text-[10px]">S</div>
      <span class="text-[10px]">Adiga</span>
    </button>
  </nav>

  <!-- 1. SHORTS CAMERA CREATION MODAL -->
  <div id="cameraModal" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between p-4">
    <div class="flex items-center justify-between z-20">
      <button onclick="closeCameraModal()" class="w-10 h-10 rounded-full bg-black/40 text-white flex items-center justify-center text-xl backdrop-blur-md">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <button onclick="showToast('Music selector active')" class="bg-zinc-900/80 border border-zinc-700/80 text-white px-4 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 backdrop-blur-md">
        <i class="fa-solid fa-music text-xs"></i>
        <span>Add sound</span>
      </button>

      <button class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-600 to-pink-500 text-white flex items-center justify-center text-lg shadow-lg">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </button>
    </div>

    <div class="absolute inset-0 z-0 flex items-center justify-center bg-zinc-950 overflow-hidden">
      <video id="liveCameraStream" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>

      <div id="cameraPlaceholder" class="flex flex-col items-center justify-center text-zinc-500 gap-3 p-6 text-center">
        <div class="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-2xl text-zinc-400">
          <i class="fa-solid fa-video"></i>
        </div>
        <p class="text-xs max-w-xs text-zinc-400">Kamarada waa nool tahay. Taabo <strong class="text-white">Add</strong> hoose si aad u furto Gallery-ga.</p>
      </div>
    </div>

    <div class="absolute right-4 top-20 z-20 flex flex-col items-center gap-5 text-white bg-black/30 p-2 rounded-2xl backdrop-blur-md border border-white/10">
      <button onclick="switchCamera()" class="flex flex-col items-center"><i class="fa-solid fa-rotate text-lg"></i></button>
      <button class="flex flex-col items-center"><i class="fa-regular fa-clock text-lg"></i></button>
      <span class="text-[11px] font-bold">3m</span>
      <button class="flex flex-col items-center"><i class="fa-solid fa-wand-magic text-lg"></i></button>
      <span class="text-[11px] font-bold">1x</span>
      <button class="flex flex-col items-center"><i class="fa-solid fa-crop text-lg"></i></button>
      <i class="fa-solid fa-chevron-down text-xs"></i>
    </div>

    <div class="z-20 flex flex-col gap-5 mb-2">
      <div class="flex items-center justify-around">
        <!-- ADD FROM GALLERY BUTTON -->
        <button onclick="openGalleryFromCamera()" class="flex flex-col items-center gap-1">
          <div class="w-11 h-11 rounded-xl bg-zinc-800 border-2 border-white/80 overflow-hidden relative flex items-center justify-center shadow-md">
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=100&q=80" class="w-full h-full object-cover">
          </div>
          <span class="text-[11px] font-bold text-white">Add</span>
        </button>

        <!-- RECORD BUTTON -->
        <button id="recordBtn" onclick="toggleRecording()" class="w-16 h-16 rounded-full border-4 border-white flex items-center justify-center bg-transparent active:scale-95 transition-transform">
          <div id="recordInnerCircle" class="w-12 h-12 rounded-full bg-red-600 transition-all duration-200"></div>
        </button>

        <!-- DRAFTS BUTTON -->
        <button onclick="showToast('Drafts waa eber')" class="flex flex-col items-center gap-1">
          <div class="w-11 h-11 rounded-xl bg-zinc-900 border border-zinc-700 flex items-center justify-center text-white text-lg">
            <i class="fa-regular fa-file-lines"></i>
          </div>
          <span class="text-[11px] font-bold text-white">Drafts</span>
        </button>
      </div>

      <div class="flex items-center justify-center gap-6 text-xs font-bold text-zinc-400">
        <button class="hover:text-white">Video</button>
        <button class="bg-zinc-800 text-white px-4 py-1 rounded-full border border-white/20">Short</button>
        <button class="hover:text-white">Live</button>
      </div>
    </div>
  </div>

  <!-- 2. AUTOMATIC GALLERY UPLOAD MODAL (SIDA SAWIRKAAGA) -->
  <div id="galleryModal" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between">
    <!-- TOP HEADER -->
    <div class="flex items-center justify-between p-3.5 border-b border-zinc-900 bg-black relative z-10">
      <div class="flex items-center gap-4">
        <button onclick="closeGalleryModal()" class="text-white text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <span class="text-base font-bold text-white">Upload from gallery</span>
      </div>

      <div class="relative">
        <button onclick="toggleAlbumDropdown()" class="text-sm font-bold text-white flex items-center gap-1">
          <span id="currentAlbumText">Videos</span>
          <i class="fa-solid fa-chevron-down text-xs"></i>
        </button>

        <div id="albumDropdown" class="absolute right-0 top-8 bg-zinc-900 border border-zinc-800 rounded-xl p-1.5 w-44 hidden shadow-2xl z-30">
          <button onclick="selectAlbum('Videos')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-white hover:bg-zinc-800 flex items-center justify-between">
            <span class="flex items-center gap-2"><i class="fa-regular fa-square-caret-right"></i> Videos</span>
            <i class="fa-solid fa-check text-xs"></i>
          </button>
          <button onclick="selectAlbum('All albums')" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold text-white hover:bg-zinc-800 flex items-center gap-2">
            <i class="fa-solid fa-border-all"></i> All albums
          </button>
        </div>
      </div>
    </div>

    <!-- GALLERY GRID (SI OTOMAATIG AH U SOO BANDHIGAYA MUUQAALLADA) -->
    <div class="flex-1 overflow-y-auto no-scrollbar relative p-0.5 bg-black">
      <div id="galleryGridContainer" class="grid grid-cols-3 gap-0.5">
        <!-- Muuqaallada otomaatiga ah ayaa halkan ka muuqda -->
      </div>
    </div>

    <!-- BOTTOM SWITCHER -->
    <div class="bg-black py-3 border-t border-zinc-900 flex justify-center items-center gap-6">
      <button class="bg-zinc-800 text-white text-xs font-bold px-5 py-1.5 rounded-full border border-zinc-700">Video</button>
      <button class="text-zinc-400 text-xs font-bold hover:text-white">Short</button>
      <button class="text-zinc-400 text-xs font-bold hover:text-white">Live</button>
    </div>
  </div>

  <!-- 3. TRIM / ADJUST VIDEO MODAL -->
  <div id="trimModal" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between p-3">
    <div class="flex items-center justify-between z-10">
      <button onclick="backToGallery()" class="w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center text-lg">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
    </div>

    <div class="flex-1 flex items-center justify-center py-2 relative">
      <div class="aspect-[9/16] h-full max-h-[70vh] bg-zinc-950 rounded-2xl overflow-hidden border border-zinc-800 relative shadow-2xl">
        <video id="trimVideoPlayer" class="w-full h-full object-cover" loop playsinline autoplay></video>
      </div>
    </div>

    <div class="space-y-3 mb-2 px-2">
      <div class="bg-zinc-900 border border-zinc-700 rounded-xl p-2 relative flex items-center justify-center">
        <div class="w-full h-10 bg-zinc-800 rounded flex items-center justify-between px-1 relative overflow-hidden">
          <div class="absolute left-1/4 right-1/4 top-0 bottom-0 border-2 border-white bg-white/10 rounded flex items-center justify-between px-1">
            <div class="w-1 h-6 bg-white rounded-full"></div>
            <span class="bg-white text-black text-[10px] font-bold px-2 py-0.5 rounded-full shadow">10.0s</span>
            <div class="w-1 h-6 bg-white rounded-full"></div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs">
        <span class="text-zinc-400 text-[11px]">Drag to adjust video</span>
        <button onclick="goToEditorStep()" class="bg-white text-black font-bold px-6 py-2 rounded-full text-xs hover:bg-zinc-200 shadow-lg">
          Next
        </button>
      </div>
    </div>
  </div>

  <!-- 4. VIDEO EDITOR MODAL -->
  <div id="editorModal" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between p-3">
    <div class="flex items-center justify-between z-20">
      <button onclick="backToTrim()" class="w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center text-lg">
        <i class="fa-solid fa-arrow-left"></i>
      </button>

      <button onclick="showToast('Music picker active')" class="bg-zinc-800/90 text-white px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 border border-zinc-700 backdrop-blur-md">
        <i class="fa-solid fa-music"></i>
        <span>Add sound</span>
      </button>

      <button class="w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center text-sm">
        <i class="fa-solid fa-volume-high"></i>
      </button>
    </div>

    <div class="absolute inset-0 z-0 flex items-center justify-center bg-black">
      <video id="editorVideoPlayer" class="w-full h-full object-cover" loop playsinline autoplay></video>
      <span class="absolute bottom-16 text-xs text-white/70 font-semibold tracking-wide drop-shadow">Swipe up to edit</span>
    </div>

    <div class="absolute right-3 top-20 z-20 flex flex-col items-center gap-4 text-white bg-black/40 p-2 rounded-2xl border border-white/10 backdrop-blur-md">
      <button class="w-8 h-8 flex items-center justify-center text-sm font-bold">Aa</button>
      <button class="w-8 h-8 flex items-center justify-center text-sm"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
      <button class="w-8 h-8 flex items-center justify-center text-sm"><i class="fa-solid fa-circle-half-stroke"></i></button>
      <button class="w-8 h-8 flex items-center justify-center text-sm"><i class="fa-regular fa-face-smile"></i></button>
      <button class="w-8 h-8 flex items-center justify-center text-sm"><i class="fa-solid fa-closed-captioning"></i></button>
      <button class="w-8 h-8 flex items-center justify-center text-xs"><i class="fa-solid fa-chevron-down"></i></button>
    </div>

    <div class="z-20 flex items-center justify-between px-2 mb-2">
      <button onclick="showToast('Editing timeline')" class="bg-zinc-800 text-white font-bold px-6 py-2 rounded-full text-xs border border-zinc-700 flex items-center gap-2">
        <i class="fa-solid fa-sliders"></i>
        <span>Edit</span>
      </button>

      <button onclick="goToFinalUploadDetails()" class="bg-white text-black font-bold px-7 py-2 rounded-full text-xs shadow-lg hover:bg-zinc-200">
        Next
      </button>
    </div>
  </div>

  <!-- 5. FINAL DETAILS MODAL -->
  <div id="finalUploadModal" class="fixed inset-0 bg-[#0f0f0f] z-50 hidden flex-col justify-between p-4">
    <div class="flex items-center gap-4 border-b border-zinc-800 pb-3">
      <button onclick="backToEditor()" class="text-white text-lg">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h2 class="text-base font-bold text-white">Add details</h2>
    </div>

    <div class="flex-1 py-4 space-y-4 overflow-y-auto no-scrollbar">
      <div class="flex gap-3">
        <div class="w-24 aspect-[9/16] bg-black rounded-xl overflow-hidden border border-zinc-800 shrink-0">
          <video id="finalPreviewThumbnail" class="w-full h-full object-cover"></video>
        </div>
        <div class="flex-1">
          <textarea id="finalTitleInput" rows="3" placeholder="Caption your Short... #Somalia" class="w-full bg-transparent text-sm text-white focus:outline-none resize-none"></textarea>
        </div>
      </div>

      <div class="space-y-3 pt-3 border-t border-zinc-800/80 text-xs text-zinc-300">
        <div class="flex items-center justify-between py-1">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-globe text-base text-zinc-400"></i>
            <span>Visibility</span>
          </div>
          <span class="font-bold text-white flex items-center gap-1">Public <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
        </div>
        <div class="flex items-center justify-between py-1">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-layer-group text-base text-zinc-400"></i>
            <span>Category</span>
          </div>
          <select id="finalCategorySelect" class="bg-zinc-900 border border-zinc-700 rounded-lg p-1 text-xs text-white">
            <option value="Soo gelintaada">Soo gelintaada</option>
            <option value="Somali Tech">Somali Tech</option>
            <option value="Musig">Musig</option>
            <option value="Ciyaaro">Ciyaaro</option>
          </select>
        </div>
      </div>
    </div>

    <button onclick="publishShortToFeed()" class="w-full bg-red-600 text-white font-bold py-3 rounded-full text-xs uppercase tracking-wider shadow-lg">
      Upload Short
    </button>
  </div>

  <!-- FULLSCREEN PLAYER MODAL -->
  <div id="playerModal" class="fixed inset-0 z-50 bg-black hidden flex-col justify-between">
    <button onclick="closePlayer()" class="absolute top-4 left-4 z-20 w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <video id="mainVideoPlayer" class="w-full h-full object-contain" loop autoplay controls></video>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastNotification" class="fixed top-16 left-1/2 -translate-x-1/2 bg-zinc-800 text-white px-4 py-1.5 rounded-full text-xs z-50 opacity-0 pointer-events-none transition-opacity duration-300 shadow-xl">
    <span id="toastMessage">Done</span>
  </div>

  <script>
    let videoList = [
      { id: 'v1', title: 'Sirta Miraha Cad iyo Waxtarkooda...', views: '1.2M views', category: 'Somali Tech', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', thumbnail: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80' },
      { id: 'v2', title: 'Gatos inteligentes y Graciosos', views: '850K views', category: 'Ciyaaro', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', thumbnail: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80' }
    ];

    // MUUQAALLADA OTOMAATIGA AH EE KU JIRA GALLERY-GA (SIDA SAWIRKAAGA OO KALE)[span_1](start_span)[span_1](end_span)
    const AUTOMATIC_GALLERY_ITEMS = [
      { duration: '0:10', thumbnail: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
      { duration: '0:10', thumbnail: 'https://images.unsplash.com/photo-1575361204480-aadea25e6e68?auto=format&fit=crop&w=300&q=80', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' },
      { duration: '0:10', thumbnail: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=300&q=80', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4' },
      { duration: '0:10', thumbnail: 'https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=300&q=80', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoylikes.mp4' },
      { duration: '2:27', thumbnail: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=300&q=80', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' },
      { duration: '0:10', thumbnail: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' },
      { duration: '0:10', thumbnail: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=300&q=80', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackSeeTheWorld.mp4' },
      { duration: '0:10', thumbnail: 'https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=300&q=80', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4' },
      { duration: '0:10', thumbnail: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=300&q=80', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WhatCarCanYouGetForAGrand.mp4' }
    ];

    let mediaStream = null;
    let isRecording = false;
    let selectedVideoUrl = '';
    let selectedThumbnail = '';

    window.addEventListener('DOMContentLoaded', () => {
      renderGrid();
      renderGalleryGrid();
    });

    function renderGrid() {
      const grid = document.getElementById('shortsGrid');
      grid.innerHTML = '';
      videoList.forEach((vid, idx) => {
        const card = document.createElement('div');
        card.className = "relative aspect-[9/16] rounded-xl overflow-hidden bg-zinc-900 border border-zinc-800 cursor-pointer shadow-md";
        card.onclick = () => openPlayer(idx);
        card.innerHTML = `
          <span class="absolute top-2 left-2 z-10 bg-black/60 text-white text-[10px] font-semibold px-2 py-0.5 rounded-md">${vid.category}</span>
          <img src="${vid.thumbnail}" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent p-2.5 flex flex-col justify-end">
            <h3 class="text-xs font-semibold text-white line-clamp-2 leading-snug mb-1">${vid.title}</h3>
            <span class="text-[10px] text-zinc-300">${vid.views}</span>
          </div>
        `;
        grid.appendChild(card);
      });
      document.getElementById('videoCountBadge').innerText = `${videoList.length} videos`;
    }

    // RENDER GALLERY AUTOMATICALLY
    function renderGalleryGrid() {
      const container = document.getElementById('galleryGridContainer');
      container.innerHTML = '';

      AUTOMATIC_GALLERY_ITEMS.forEach(item => {
        const card = document.createElement('div');
        card.className = "aspect-square relative bg-zinc-900 cursor-pointer overflow-hidden group";
        card.onclick = () => selectGalleryMedia(item.url, item.thumbnail);
        card.innerHTML = `
          <img src="${item.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition">
          <span class="absolute bottom-1 right-1 bg-black/80 text-white font-bold text-[10px] px-1 rounded">${item.duration}</span>
        `;
        container.appendChild(card);
      });
    }

    async function openCameraModal() {
      const modal = document.getElementById('cameraModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
        const videoElem = document.getElementById('liveCameraStream');
        videoElem.srcObject = mediaStream;
        videoElem.classList.remove('hidden');
        document.getElementById('cameraPlaceholder').classList.add('hidden');
      } catch (err) {
        console.log("Camera handled fallback:", err);
      }
    }

    function closeCameraModal() {
      const modal = document.getElementById('cameraModal');
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleRecording() {
      const circle = document.getElementById('recordInnerCircle');
      if (!isRecording) {
        isRecording = true;
        circle.className = "w-6 h-6 rounded-sm bg-red-600 animate-pulse";
        showToast('Duubistu waa bilaabatay...');
      } else {
        isRecording = false;
        circle.className = "w-12 h-12 rounded-full bg-red-600";
        showToast('Duubistu waa dhammaatay!');
      }
    }

    function openGalleryFromCamera() {
      closeCameraModal();
      document.getElementById('galleryModal').classList.remove('hidden');
      document.getElementById('galleryModal').classList.add('flex');
    }

    function closeGalleryModal() {
      document.getElementById('galleryModal').classList.add('hidden');
    }

    function toggleAlbumDropdown() {
      document.getElementById('albumDropdown').classList.toggle('hidden');
    }

    function selectAlbum(albumName) {
      document.getElementById('currentAlbumText').innerText = albumName;
      toggleAlbumDropdown();
    }

    function selectGalleryMedia(url, thumbnail) {
      selectedVideoUrl = url;
      selectedThumbnail = thumbnail;
      closeGalleryModal();

      const trimPlayer = document.getElementById('trimVideoPlayer');
      trimPlayer.src = url;
      document.getElementById('trimModal').classList.remove('hidden');
      document.getElementById('trimModal').classList.add('flex');
    }

    function backToGallery() {
      document.getElementById('trimModal').classList.add('hidden');
      document.getElementById('galleryModal').classList.remove('hidden');
      document.getElementById('galleryModal').classList.add('flex');
    }

    function goToEditorStep() {
      document.getElementById('trimModal').classList.add('hidden');
      const editorPlayer = document.getElementById('editorVideoPlayer');
      editorPlayer.src = selectedVideoUrl;
      document.getElementById('editorModal').classList.remove('hidden');
      document.getElementById('editorModal').classList.add('flex');
    }

    function backToTrim() {
      document.getElementById('editorModal').classList.add('hidden');
      document.getElementById('trimModal').classList.remove('hidden');
    }

    function goToFinalUploadDetails() {
      document.getElementById('editorModal').classList.add('hidden');
      const finalPlayer = document.getElementById('finalPreviewThumbnail');
      finalPlayer.src = selectedVideoUrl;
      document.getElementById('finalUploadModal').classList.remove('hidden');
      document.getElementById('finalUploadModal').classList.add('flex');
    }

    function backToEditor() {
      document.getElementById('finalUploadModal').classList.add('hidden');
      document.getElementById('editorModal').classList.remove('hidden');
    }

    function publishShortToFeed() {
      const title = document.getElementById('finalTitleInput').value.trim() || 'Muuqaal Cusub';
      const category = document.getElementById('finalCategorySelect').value;

      const newShort = {
        id: 'user_' + Date.now(),
        title: title,
        views: '1 view • Right now',
        category: category,
        url: selectedVideoUrl,
        thumbnail: selectedThumbnail
      };

      videoList.unshift(newShort);
      renderGrid();

      document.getElementById('finalUploadModal').classList.add('hidden');
      showToast('Shorts-kaaga si guul leh ayaa loo soo geliyay! 🚀');
      openPlayer(0);
    }

    function openPlayer(idx) {
      const modal = document.getElementById('playerModal');
      const player = document.getElementById('mainVideoPlayer');
      player.src = videoList[idx].url;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      player.play();
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const player = document.getElementById('mainVideoPlayer');
      player.pause();
      modal.classList.add('hidden');
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastMessage').innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none'); }, 2200);
    }
  </script>
</body>
</html>
