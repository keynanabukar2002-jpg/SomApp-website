<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNN MicroPay - Web3 & SOS Swap</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-weight: bold; font-size: 1.2rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .card { background: #0f172a; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #1e293b; }
        .card-title { color: #94a3b8; font-size: 0.85rem; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .balance { font-size: 1.6rem; font-weight: bold; color: #f8fafc; }
        .sub-balance { font-size: 0.9rem; color: #38bdf8; margin-top: 4px; }
        .address-box { word-break: break-all; background: #1e293b; padding: 10px; border-radius: 8px; font-family: monospace; color: #38bdf8; font-size: 0.8rem; margin: 8px 0; border: 1px dashed #475569; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .btn:hover { background: #0369a1; }
        .btn-google { background: #db4437; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-withdraw { background: #10b981; }
        .btn-swap { background: #8b5cf6; }
        .btn-logout { background: #ef4444; margin-top: 10px; }
        .btn-warning { background: #d97706; font-size: 0.8rem; padding: 6px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin-top: 6px; box-sizing: border-box; }
        .input-group { margin-bottom: 12px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <span style="background:#0284c7; color:white; padding:4px 8px; border-radius:6px;">K</span>
            KNN MicroPay
        </div>
        <div id="userStatus" style="font-size:0.8rem; color:#94a3b8;">Loading...</div>
    </div>

    <!-- Login View -->
    <div id="loginView" class="card hidden" style="text-align: center; padding: 30px 16px;">
        <h3 style="color: #f8fafc; margin-top:0;">Ku soo dhawoow KNN MicroPay</h3>
        <button class="btn btn-google" onclick="loginWithGoogle()">Google Login-ka ku gal</button>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="hidden">
        <div class="card">
            <div class="card-title">
              <span>User ID: <strong id="userIdDisplay" style="color:#38bdf8;">--</strong></span>
              <span id="userEmailDisplay" style="color:#94a3b8; font-size:0.75rem;">--</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>Hantidaada Guud (Balance)</span>
                <span style="color:#10b981;">Polygon / SOS</span>
            </div>
            <div class="balance" id="balanceDisplay">0.0000 POL</div>
            <div class="sub-balance" id="sosBalanceDisplay">≈ 0 SOS</div>
        </div>

        <!-- Internal Swap Section -->
        <div class="card" style="border: 1px solid #8b5cf6;">
            <div class="card-title" style="color:#c084fc; font-weight:bold;">Is-dhaafsiga Gudaha (Internal Swap)</div>
            <div class="input-group">
                <label style="font-size:0.8rem; color:#94a3b8;">Nooca Sarifka:</label>
                <select id="swapType" onchange="updateSwapLabels()">
                    <option value="SOS_TO_POL">Shilin Soomaali (SOS) ➔ Polygon (POL)</option>
                    <option value="POL_TO_SOS">Polygon (POL) ➔ Shilin Soomaali (SOS)</option>
                </select>
            </div>
            <div class="input-group">
                <label style="font-size:0.8rem; color:#94a3b8;" id="swapInputLabel">Cadadka SOS:</label>
                <input type="number" id="swapAmountInput" placeholder="Tusaale: 3000" oninput="calculateSwap()">
            </div>
            <div style="font-size: 0.8rem; color: #38bdf8; margin-bottom: 8px;" id="swapResultDisplay">
                Waxaad heli doontaa: 0 POL
            </div>
            <button class="btn btn-swap" onclick="executeSwap()">Ku Samee Swap Hadda</button>
        </div>

        <!-- Deposit Address -->
        <div class="card">
            <div class="card-title">Cinwaankaaga Deposit-ka (Address):</div>
            <div class="address-box" id="depositAddress">Loading...</div>
            <button class="btn" onclick="copyAddress()">Copy Address</button>
        </div>

        <!-- Private Key Section -->
        <div class="card" style="border: 1px solid #d97706;">
            <div class="card-title" style="color:#f59e0b; font-weight:bold;">Private Key-gaaga</div>
            <div class="address-box hidden" id="privateKeyBox" style="color: #fca5a5;">Loading...</div>
            <button class="btn btn-warning" id="toggleKeyBtn" onclick="togglePrivateKey()">Muuji Private Key-ga</button>
        </div>

        <!-- Withdraw Section -->
        <div class="card">
            <div class="card-title" style="color:#10b981; font-weight:bold;">Withdraw POL</div>
            <div class="input-group">
                <label style="font-size:0.8rem; color:#94a3b8;">Cinwaanka Qaataha:</label>
                <input type="text" id="recipientInput" placeholder="0x...">
            </div>
            <div class="input-group">
                <label style="font-size:0.8rem; color:#94a3b8;">Xadiga POL:</label>
                <input type="number" step="0.0001" id="amountInput" placeholder="0.1">
            </div>
            <button class="btn btn-withdraw" onclick="sendWithdraw()">Withdraw Now</button>
        </div>

        <button class="btn btn-logout" onclick="logoutUser()">Logout</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCg_xRwZ8LVoQ6l-fUiQCN2bN2INkvHI6I",
      authDomain: "somapp-61ebd.firebaseapp.com",
      projectId: "somapp-61ebd",
      storageBucket: "somapp-61ebd.firebasestorage.app",
      messagingSenderId: "890890688001",
      appId: "1:890890688001:web:b7063dda31b860785f5200",
      measurementId: "G-XG4K89NNMM"
    };
    
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const SERVER_URL = 'https://somapp-website-production.up.railway.app';
    let currentUserUid = null;
    let userPolygonAddress = "";
    let currentPolBalance = 0;
    const EXCHANGE_RATE_SOS_PER_POL = 3000;

    async function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
            const result = await firebase.auth().signInWithPopup(provider);
            if (result.user) await authenticateWithBackend(result.user);
        } catch (err) {
            alert("Cilad Login: " + err.message);
        }
    }

    async function authenticateWithBackend(user) {
        if (!user || !user.uid) return;
        try {
            const response = await fetch(`${SERVER_URL}/api/auth-user`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user.email, uid: user.uid, userId: user.uid, displayName: user.displayName })
            });
            const data = await response.json();
            if (data.success) {
                currentUserUid = user.uid;
                userPolygonAddress = data.polygonAddress;
                currentPolBalance = parseFloat(data.balance || 0);

                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                document.getElementById('userStatus').innerText = "Connected";
                document.getElementById('userStatus').style.color = "#10b981";

                document.getElementById('userIdDisplay').innerText = data.userId;
                document.getElementById('userEmailDisplay').innerText = user.email;
                document.getElementById('depositAddress').innerText = data.polygonAddress;
                document.getElementById('privateKeyBox').innerText = data.privateKey;
                
                updateBalanceUI(currentPolBalance);
            }
        } catch (err) {
            alert("Cilad Server-ka ah.");
        }
    }

    function updateBalanceUI(pol) {
        currentPolBalance = pol;
        document.getElementById('balanceDisplay').innerText = pol.toFixed(4) + " POL";
        const sosVal = pol * EXCHANGE_RATE_SOS_PER_POL;
        document.getElementById('sosBalanceDisplay').innerText = `≈ ${sosVal.toLocaleString()} SOS`;
    }

    firebase.auth().onAuthStateChanged(async (user) => {
        if (user) await authenticateWithBackend(user);
        else document.getElementById('loginView').classList.remove('hidden');
    });

    function updateSwapLabels() {
        const type = document.getElementById('swapType').value;
        document.getElementById('swapInputLabel').innerText = type === 'SOS_TO_POL' ? "Cadadka SOS:" : "Cadadka POL:";
        calculateSwap();
    }

    function calculateSwap() {
        const type = document.getElementById('swapType').value;
        const val = parseFloat(document.getElementById('swapAmountInput').value) || 0;
        const resultDisplay = document.getElementById('swapResultDisplay');

        if (type === 'SOS_TO_POL') {
            resultDisplay.innerText = `Waxaad heli doontaa: ${(val / EXCHANGE_RATE_SOS_PER_POL).toFixed(4)} POL`;
        } else {
            resultDisplay.innerText = `Waxaad heli doontaa: ${(val * EXCHANGE_RATE_SOS_PER_POL).toLocaleString()} SOS`;
        }
    }

    async function executeSwap() {
        const type = document.getElementById('swapType').value;
        const amount = parseFloat(document.getElementById('swapAmountInput').value);

        if (!amount || amount <= 0) {
            alert("Fadlan gali xaddiga saxda ah!");
            return;
        }

        try {
            const response = await fetch(`${SERVER_URL}/api/swap`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid: currentUserUid, swapType: type, amount: amount })
            });

            const data = await response.json();
            if (data.success) {
                alert(data.message);
                updateBalanceUI(parseFloat(data.newBalance));
                document.getElementById('swapAmountInput').value = "";
                calculateSwap();
            } else {
                alert("Cilad: " + data.error);
            }
        } catch (err) {
            alert("Cilad ayaa dhacday xiriirka server-ka.");
        }
    }

    function copyAddress() {
        navigator.clipboard.writeText(userPolygonAddress);
        alert("Cinwaanka waa la koobiyeeyay!");
    }

    function togglePrivateKey() {
        const keyBox = document.getElementById('privateKeyBox');
        const btn = document.getElementById('toggleKeyBtn');
        if (keyBox.classList.contains('hidden')) {
            if (confirm("Digniin: Qofna ha tusin Private Key-gaaga!")) {
                keyBox.classList.remove('hidden');
                btn.innerText = "Qari Private Key-ga";
            }
        } else {
            keyBox.classList.add('hidden');
            btn.innerText = "Muuji Private Key-ga";
        }
    }

    async function sendWithdraw() {
        const recipient = document.getElementById('recipientInput').value.trim();
        const amount = document.getElementById('amountInput').value.trim();
        if (!recipient || !amount) return alert("Fadlan buuxi meelaha bannaan!");

        if (!confirm(`Ma hubtaa inaad dirayso ${amount} POL?`)) return;

        try {
            const response = await fetch(`${SERVER_URL}/api/withdraw`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid: currentUserUid, recipientAddress: recipient, amount: amount })
            });
            const data = await response.json();
            if (data.success) {
                alert("Guul! " + data.message);
                location.reload();
            } else {
                alert("Cilad: " + data.error);
            }
        } catch (err) {
            alert("Cilad ayaa dhacday.");
        }
    }

    function logoutUser() {
        firebase.auth().signOut().then(() => { localStorage.clear(); location.reload(); });
    }
</script>

</body>
</html>
