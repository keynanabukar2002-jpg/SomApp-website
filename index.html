
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سورة البقرة</title>

<style>
:root {
  --navy: #102b52;
  --gold: #c69b43;
  --paper: #f7efd9;
  --ink: #21180f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #e8e0d0;
  color: var(--ink);
  font-family: "Noto Naskh Arabic", "Amiri", serif;
}

.toolbar {
  position: sticky;
  top: 0;
  background: var(--navy);
  color: white;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: Arial;
  z-index: 5;
}

button {
  background: var(--paper);
  color: var(--navy);
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 9px 14px;
  cursor: pointer;
  font-weight: bold;
}

.book {
  max-width: 900px;
  margin: 20px auto;
  padding: 14px;
}

.page {
  position: relative;
  min-height: 1100px;
  padding: 95px 9%;
  background: var(--paper);
  border: 8px double var(--gold);
  outline: 3px solid var(--navy);
  outline-offset: -17px;
  box-shadow: 0 8px 28px #0002;
}

.page::before,
.page::after {
  content: "✿ ❖ ✿";
  display: block;
  text-align: center;
  color: var(--gold);
  font-size: 27px;
  letter-spacing: 14px;
}

h1 {
  text-align: center;
  color: var(--navy);
  font-size: 38px;
  margin: 15px 0;
}

.bism {
  font-size: 29px;
  text-align: center;
  margin-bottom: 30px;
}

.verses {
  font-size: 27px;
  line-height: 2.25;
  text-align: justify;
  text-align-last: center;
}

.ayah {
  display: inline;
}

.num {
  display: inline-flex;
  vertical-align: middle;
  justify-content: center;
  align-items: center;
  width: 34px;
  height: 34px;
  margin: 0 5px;
  border: 2px double var(--gold);
  border-radius: 50%;
  color: var(--navy);
  font-size: 16px;
  background: #fff8e7;
}

.status {
  text-align: center;
  font: 14px Arial;
  margin: 18px;
}

@media(max-width:600px) {
  .page {
    padding: 75px 7%;
    min-height: 85vh;
    border-width: 5px;
  }

  .verses {
    font-size: 22px;
    line-height: 2.15;
  }

  h1 { font-size: 31px; }
}

@media print {
  body { background: white; }
  .toolbar, .status { display: none; }
  .book { margin: 0; padding: 0; }
  .page {
    box-shadow: none;
    page-break-after: always;
  }
}
</style>
</head>

<body>

<div class="toolbar">
  <strong>القرآن الكريم</strong>
  <span>سورة البقرة</span>
  <button onclick="window.print()">PDF / Daabac</button>
</div>

<main class="book">
<section class="page">

<h1>سورة البقرة</h1>

<div class="bism">
بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
</div>

<div id="verses" class="verses"></div>

<div id="status" class="status">
Aayadaha ayaa la soo rarayaa...
</div>

</section>
</main>

<script>
const digits = n =>
  String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

async function loadSurah() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(
      "https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@1/editions/ara-quransimple.json"
    );

    if (!response.ok) throw new Error("Data lama helin");

    const data = await response.json();

    const all = data.quran || data;

    const ayat = all
      .filter(v => Number(v.chapter) === 2)
      .sort((a,b) => Number(a.verse)-Number(b.verse));

    if (ayat.length !== 286) {
      throw new Error("286 aayadood lama helin");
    }

    const target = document.getElementById("verses");
    target.innerHTML = "";

    ayat.forEach(v => {
      const text = document.createElement("span");
      text.className = "ayah";
      text.textContent = v.text + " ";

      const number = document.createElement("span");
      number.className = "num";
      number.textContent = digits(v.verse);

      target.appendChild(text);
      target.appendChild(number);
      target.appendChild(document.createTextNode(" "));
    });

    status.textContent = "286 aayadood waa la soo raray.";

  } catch(error) {
    status.textContent =
      "Internet-ka hubi kadibna dib u fur bogga. " + error.message;
  }
}

loadSurah();
</script>

</body>
</html>
