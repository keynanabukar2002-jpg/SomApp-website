<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNN MicroPay - Withdraw</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .card {
            background: #0f172a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #1e293b;
        }
        .card-title {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .balance {
            font-size: 1.8rem;
            font-weight: bold;
            color: #f8fafc;
        }
        .address-box {
            word-break: break-all;
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            color: #38bdf8;
            font-size: 0.85rem;
            margin: 8px 0;
            border: 1px dashed #475569;
        }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .btn:hover { background: #0369a1; }
        .btn-withdraw { background: #10b981; margin-top: 10px; }
        .btn-withdraw:hover { background: #059669; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            margin-top: 6px;
            box-sizing: border-box;
        }
        .input-group { margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <span style="background:#0284c7; color:white; padding:4px 8px; border-radius:6px;">K</span>
            KNN MicroPay
        </div>
        <div class="status">Connected</div>
    </div>

    <!-- Balance Display -->
    <div class="card">
        <div class="card-title">
            <span>Internal Micro-Balance</span>
            <span style="color:#10b981;">Polygon</span>
        </div>
        <div class="balance" id="balanceDisplay">Loading...</div>
    </div>

    <!-- Deposit Address Display -->
    <div class="card">
        <div class="card-title">Cinwaankaaga Deposit-ka:</div>
        <div class="address-box" id="depositAddress">Loading...</div>
        <button class="btn" onclick="copyAddress()">Copy Address</button>
    </div>

    <!-- Withdraw Section -->
    <div class="card">
        <div class="card-title" style="color:#38bdf8; font-weight:bold;">Withdraw POL (Bixi Lacag)</div>
        <div class="input-group">
            <label style="font-size:0.8rem; color:#94a3b8;">Cinwaanka Qaataha (Recipient Address):</label>
            <input type="text" id="recipientInput" placeholder="0x...">
        </div>
        <div class="input-group">
            <label style="font-size:0.8rem; color:#94a3b8;">Xadiga POL (Amount):</label>
            <input type="number" step="0.01" id="amountInput" placeholder="1.1">
        </div>
        <button class="btn btn-withdraw" onclick="sendWithdraw()">Withdraw Now</button>
    </div>
</div>

<script>
    const SERVER_URL = 'https://somapp-website-production.up.railway.app';
    const FIXED_ADDRESS = "0x44a712fdbAF5Cbdbd2960D29d576b2e808B0D5A0";

    async function loadWallet() {
        document.getElementById('depositAddress').innerText = FIXED_ADDRESS;
        try {
            const response = await fetch(`${SERVER_URL}/api/get-or-create-wallet`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            const data = await response.json();
            document.getElementById('balanceDisplay').innerText = (data.balance !== undefined ? data.balance : "0.00") + " POL";
        } catch (err) {
            console.error(err);
            document.getElementById('balanceDisplay').innerText = "0.00 POL";
        }
    }

    function copyAddress() {
        navigator.clipboard.writeText(FIXED_ADDRESS);
        alert("Cinwaanka waa la koobiyeeyay!");
    }

    async function sendWithdraw() {
        const recipient = document.getElementById('recipientInput').value.trim();
        const amount = document.getElementById('amountInput').value.trim();

        if (!recipient || !amount) {
            alert("Fadlan buuxi cinwaanka iyo xadiga lacagta!");
            return;
        }

        if(!confirm(`Ma hubtaa inaad dirayso ${amount} POL oo aad u direyso ${recipient}?`)) return;

        try {
            alert("Waa la dirayaa, fadlan sug...");
            const response = await fetch(`${SERVER_URL}/api/withdraw`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ recipientAddress: recipient, amount: amount })
            });

            const data = await response.json();
            if (data.success) {
                alert("Guul! Lacagtii waa la diray.\nTx Hash: " + data.txHash);
                loadWallet(); // Dib u soo celi balance-ka cusub
            } else {
                alert("Cilad ayaa dhacday: " + (data.error || "Waa la waayay jawaab"));
            }
        } catch (err) {
            console.error(err);
            alert("Cilad Server-ka ah ayaa dhacday.");
        }
    }

    window.onload = loadWallet;
</script>

</body>
</html>
