<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somali Wallet - Welcome Screen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 flex justify-center items-center min-h-screen font-sans text-white">

    <!-- Mobile Screen Container -->
    <div class="w-[380px] h-[812px] bg-[#070b19] rounded-[40px] border-[8px] border-slate-900 shadow-2xl flex flex-col justify-between items-center p-6 overflow-hidden relative">
        
        <!-- Top Status Bar -->
        <div class="w-full flex justify-between items-center text-xs font-semibold text-slate-300 pt-2">
            <span>8:13</span>
            <div class="flex space-x-1.5 items-center">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-xs"></i>
                <span class="text-[10px]">58</span>
            </div>
        </div>

        <!-- Upper Section / Logo & Branding -->
        <div class="flex flex-col items-center text-center mt-10">
            <!-- Correct Logo Icon matching the uploaded image -->
            <div class="w-24 h-24 relative flex items-center justify-center mb-2">
                <div class="w-20 h-20 bg-gradient-to-tr from-cyan-400 to-emerald-400 rounded-full blur-lg absolute opacity-60"></div>
                <svg class="w-20 h-20 relative z-10 drop-shadow-lg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 15C35 15 25 30 28 50C30 65 42 78 58 75C68 73 75 62 72 48C69 34 60 18 50 15Z" fill="url(#cyan_grad)"/>
                    <path d="M58 45C68 45 78 55 75 70C73 80 62 88 48 85C38 83 30 73 35 60C38 50 48 45 58 45Z" fill="url(#green_grad)"/>
                    <defs>
                        <linearGradient id="cyan_grad" x1="28" y1="15" x2="72" y2="75" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#00F2FE"/>
                            <stop offset="1" stop-color="#4FACFE"/>
                        </linearGradient>
                        <linearGradient id="green_grad" x1="30" y1="45" x2="75" y2="88" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#00C9FF"/>
                            <stop offset="1" stop-color="#00FF87"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <!-- Title -->
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">
                somali <span class="font-normal text-slate-200">Wallet</span>
            </h1>

            <!-- Subtitle -->
            <p class="text-sm text-slate-300 font-medium mb-3">
                Your Crypto, Your Control
            </p>

            <!-- Features Bullet Text -->
            <p class="text-xs text-slate-400 tracking-wider mb-1">
                Send • Receive • Trade • Grow
            </p>
            <p class="text-xs text-slate-400 tracking-wider">
                Secure. Fast. Global.
            </p>
        </div>

        <!-- Middle Action Buttons -->
        <div class="w-full space-y-3.5 mb-8">
            <button class="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-semibold rounded-full shadow-lg shadow-blue-600/30 transition duration-200 text-center text-base">
                Register
            </button>
            <button class="w-full py-4 bg-transparent border border-blue-500/60 hover:bg-blue-500/10 text-white font-semibold rounded-full transition duration-200 text-center text-base">
                Login
            </button>
        </div>

        <!-- Footer Text -->
        <div class="pb-4 text-center">
            <p class="text-xs text-slate-400 tracking-widest">
                Trusted • Safe • Global
            </p>
        </div>

    </div>

</body>
</html>
