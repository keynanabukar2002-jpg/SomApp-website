<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Deposit - Polygon USDC</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Ethers.js v5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-[#0F1117] text-white font-sans flex justify-center items-center min-h-screen p-4">

    <div class="w-full max-w-[400px] bg-[#1B1E2B] rounded-3xl p-6 border border-[#2A2E3F] shadow-2xl space-y-5">
        
        <!-- Header -->
        <div class="flex justify-between items-center">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
                <i data-lucide="wallet" class="w-5 h-5 text-[#2F66F6]"></i> Ku Shubashada Crypto
            </h3>
            <span class="text-xs bg-[#2F66F6]/20 text-[#2F66F6] px-2.5 py-1 rounded-full font-semibold">Polygon Network</span>
        </div>

        <!-- Wallet Connect -->
        <div class="bg-[#0F1117] p-3.5 rounded-2xl border border-[#2A2E3F] flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-[#1E2230] flex items-center justify-center">
                    <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
                </div>
                <div>
                    <div class="text-xs text-[#9CA3AF]">Xaaladda Wallet-ka</div>
                    <div id="walletAddressText" class="text-xs font-bold text-white">Lama xiriirin</div>
                </div>
            </div>
            <button onclick="connectWallet()" id="connectWalletBtn" class="px-3.5 py-2 bg-[#2F66F6] hover:bg-blue-600 text-white rounded-xl text-xs font-bold transition">
                Xiriiri Wallet
            </button>
        </div>

        <!-- Receiver Input (Ku qor Wallet-kaaga dhabta ah) -->
        <div class="space-y-2">
            <label class="text-xs font-semibold text-[#9CA3AF]">Cinwaanka Lacagta loo dirayo (Deposit Address)</label>
            <input id="receiverAddress" type="text" placeholder="0x..." class="w-full h-10 bg-[#0F1117] border border-[#2A2E3F] rounded-xl px-3 text-xs font-mono text-white focus:outline-none focus:border-[#2F66F6]">
        </div>

        <!-- Amount Input -->
        <div class="space-y-2">
            <label class="text-xs font-semibold text-[#9CA3AF]">Gali Lacagta (USDC)</label>
            <div class="relative">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#9CA3AF] font-bold">$</span>
                <input id="depositAmount" type="number" step="0.1" value="1.00" class="w-full h-12 bg-[#0F1117] border border-[#2A2E3F] rounded-xl pl-8 pr-4 text-sm font-bold text-white focus:outline-none focus:border-[#2F66F6]">
            </div>
        </div>

        <!-- Action Button -->
        <button onclick="executeCryptoDeposit()" id="depositBtn" class="w-full h-12 rounded-xl bg-[#2F66F6] hover:bg-blue-600 text-white font-bold text-sm shadow-lg transition flex items-center justify-center gap-2">
            <i data-lucide="arrow-down-left" class="w-4 h-4"></i> Ku Shub Hadda
        </button>

    </div>

    <script>
        lucide.createIcons();

        const USDC_CONTRACT_ADDRESS = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359";
        const USDC_ABI = [
            "function transfer(address to, uint256 amount) returns (bool)"
        ];

        let provider, signer, userAddress;

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    userAddress = await signer.getAddress();

                    const network = await provider.getNetwork();
                    if (network.chainId !== 137) {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x89' }]
                        });
                    }

                    document.getElementById('walletAddressText').innerText = userAddress.substring(0, 6) + '...' + userAddress.substring(userAddress.length - 4);
                    document.getElementById('connectWalletBtn').innerText = 'Waa Xiran yahay';
                    document.getElementById('connectWalletBtn').classList.replace('bg-[#2F66F6]', 'bg-emerald-600');
                } catch (e) {
                    alert("Cillad ayaa ka dhacday xiriirinta wallet-ka.");
                }
            } else {
                alert("Fadlan dhex ka fur MetaMask / Trust Wallet Browser!");
            }
        }

        async function executeCryptoDeposit() {
            if (!signer) {
                await connectWallet();
                return;
            }

            const receiver = document.getElementById('receiverAddress').value.trim();
            const amountInput = document.getElementById('depositAmount').value;

            if (!receiver || !ethers.utils.isAddress(receiver)) {
                alert("Fadlan geli Wallet Address dhab ah oo sax ah!");
                return;
            }

            try {
                const depositBtn = document.getElementById('depositBtn');
                depositBtn.innerText = "Fadlan ku xaqiiji Wallet-ka...";
                depositBtn.disabled = true;

                const usdcContract = new ethers.Contract(USDC_CONTRACT_ADDRESS, USDC_ABI, signer);
                const parsedAmount = ethers.utils.parseUnits(amountInput.toString(), 6);

                const tx = await usdcContract.transfer(receiver, parsedAmount);
                depositBtn.innerText = "Xawilaaddu waa socotaa...";
                await tx.wait();

                alert(`✅ Guul! $${amountInput} USDC waa la soo diray.`);
                depositBtn.innerText = "Ku Shub Hadda";
                depositBtn.disabled = false;
            } catch (error) {
                console.error(error);
                alert("Xawilaadii waa la kansalay ama cillad ayaa dhacday.");
                document.getElementById('depositBtn').innerText = "Ku Shub Hadda";
                document.getElementById('depositBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
