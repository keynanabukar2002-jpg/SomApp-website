<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomWallet - USDT (BEP20) Transfer</title>
    <!-- Tailwind CSS oo loogu talagalay Naqshadda/Design-ka -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6">
        
        <!-- Header / Header-ka App-ka -->
        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-full flex items-center justify-center font-bold text-slate-900 text-xl">
                    SW
                </div>
                <div>
                    <h1 class="font-bold text-lg">SomWallet</h1>
                    <p class="text-xs text-emerald-400 font-medium">BNB Smart Chain (Mainnet)</p>
                </div>
            </div>
            <span class="bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 text-xs px-2.5 py-1 rounded-full font-semibold">
                USDT BEP20
            </span>
        </div>

        <!-- Form-ka Dirista -->
        <div class="space-y-4">
            <!-- Private Key Input -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">PRIVATE KEY-GAAGA SOMWALLET</label>
                <input type="password" id="privateKey" placeholder="Geli Private Key-gaaga halkan..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition">
            </div>

            <!-- Recipient Address -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">CINWAANKA QOFKA LOO DIRAYO (RECIPIENT)</label>
                <input type="text" id="recipientAddress" placeholder="0x..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition font-mono">
            </div>

            <!-- Amount Input -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">QADDARKA (USDT)</label>
                <div class="relative">
                    <input type="number" id="amount" placeholder="0.00" step="any"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition font-semibold">
                    <span class="absolute right-4 top-3 text-xs font-bold text-slate-400">USDT</span>
                </div>
            </div>

            <!-- Transaction Status Display -->
            <div id="statusBox" class="hidden rounded-xl p-4 text-xs font-mono break-all border"></div>

            <!-- Submit Button -->
            <button onclick="sendUSDT()" id="sendBtn" 
                class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.98] text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/20 flex items-center justify-center space-x-2">
                <span>Daf / Dir USDT</span>
            </button>
        </div>

        <!-- Footer Info -->
        <div class="text-center border-t border-slate-700/50 pt-4">
            <p class="text-[11px] text-slate-500">
                ⚠️ Hubi in wallet-kaaga uu ku jiro wax yar oo **BNB** ah si looga bixiyo Gas Fee (Khidmadda Shabakadda).
            </p>
        </div>
    </div>

    <!-- JavaScript-ka Fulinaya Shaqada -->
    <script>
        // Qandaraaska USDT ee BSC Mainnet
        const USDT_CONTRACT_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
        const BSC_RPC = "https://bsc-dataseed.binance.org/";

        const ERC20_ABI = [
            "function transfer(to address, value uint256) returns (bool)",
            "function balanceOf(address owner) view returns (uint256)"
        ];

        async function sendUSDT() {
            const privateKeyInput = document.getElementById('privateKey').value.trim();
            const recipient = document.getElementById('recipientAddress').value.trim();
            const amountInput = document.getElementById('amount').value.trim();
            const statusBox = document.getElementById('statusBox');
            const sendBtn = document.getElementById('sendBtn');

            // Nadiifi sanduuqa ogeysiiska
            statusBox.className = "rounded-xl p-4 text-xs font-mono break-all border block bg-slate-900 border-slate-700 text-yellow-400";
            statusBox.innerHTML = "⏳ Waxaa la hubinayaa xogta transaction-ka...";

            if (!privateKeyInput || !recipient || !amountInput) {
                showStatus("❌ Fadlan buuxi dhamaan meelaha bumann!", "error");
                return;
            }

            try {
                sendBtn.disabled = true;
                sendBtn.classList.add('opacity-50', 'cursor-not-allowed');

                // 1. Provider & Wallet setup
                const provider = new ethers.providers.JsonRpcProvider(BSC_RPC);
                const wallet = new ethers.Wallet(privateKeyInput, provider);

                // 2. Hubi BNB Balance (Gas Fee)
                const bnbBalance = await wallet.getBalance();
                if (bnbBalance.isZero()) {
                    showStatus("❌ Ma haysatid BNB ku filan bixinta Gas Fee-ga. Ku shub BNB cinwaankaaga.", "error");
                    sendBtn.disabled = false;
                    sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    return;
                }

                // 3. Contract setup
                const usdtContract = new ethers.Contract(USDT_CONTRACT_ADDRESS, ERC20_ABI, wallet);
                const parsedAmount = ethers.utils.parseUnits(amountInput, 6); // USDT BSC waxay leedahay 6 decimals

                // 4. Hubi Haraaga USDT
                const usdtBalance = await usdtContract.balanceOf(wallet.address);
                if (usdtBalance.lt(parsedAmount)) {
                    showStatus("❌ Haraagaaga USDT wuu ka yar yahay qaddarka aad rabto inaad dirto!", "error");
                    sendBtn.disabled = false;
                    sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    return;
                }

                // 5. Dir Transaction-ka
                showStatus("🚀 Transaction-ka waa la dirayaa, fadlan sug...", "warning");
                const tx = await usdtContract.transfer(recipient, parsedAmount);

                showStatus(`⏳ Transaction-ka waa la diray! TX Hash: <br><a href="https://bscscan.com/tx/${tx.hash}" target="_blank" class="underline text-emerald-400">${tx.hash}</a>`, "warning");

                // Sugidda Xaqiijinta (Confirmation)
                await tx.wait();
                showStatus(`✅ Si guul leh ayaa loo diray ${amountInput} USDT!<br>Tx Hash: <a href="https://bscscan.com/tx/${tx.hash}" target="_blank" class="underline text-emerald-400">${tx.hash}</a>`, "success");

            } catch (error) {
                console.error(error);
                showStatus(`❌ Khalad ayaa dhacay: ${error.reason || error.message || error}`, "error");
            } finally {
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function showStatus(message, type) {
            const statusBox = document.getElementById('statusBox');
            statusBox.classList.remove('hidden');
            
            if (type === "error") {
                statusBox.className = "rounded-xl p-4 text-xs font-mono break-all border bg-red-950/40 border-red-500/50 text-red-400";
            } else if (type === "success") {
                statusBox.className = "rounded-xl p-4 text-xs font-mono break-all border bg-emerald-950/40 border-emerald-500/50 text-emerald-400";
            } else if (type === "warning") {
                statusBox.className = "rounded-xl p-4 text-xs font-mono break-all border bg-yellow-950/40 border-yellow-500/50 text-yellow-400";
            }
            
            statusBox.innerHTML = message;
        }
    </script>
</body>
</html>
