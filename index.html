<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Camera UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f0f0f; color: #ffffff; user-select: none; }
        .glass-pill { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); }
        .glass-dark { background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-icon-btn { background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center overflow-hidden font-sans bg-neutral-950">

    <div class="relative w-full h-full sm:max-w-[410px] sm:h-[840px] sm:rounded-[44px] overflow-hidden bg-black shadow-2xl flex flex-col justify-between">

        <!-- CAMERA VIEW -->
        <div id="cameraViewfinder" class="absolute inset-0 z-0 bg-neutral-900">
            <video id="webcamVideo" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline muted></video>
            <div id="fallbackBg" class="absolute inset-0 w-full h-full bg-cover bg-center hidden" style="background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000&auto=format&fit=crop');"></div>
        </div>

        <!-- TOP BAR -->
        <div class="relative z-20 w-full pt-4 px-3 flex flex-col gap-2">
            <div class="flex items-center justify-between px-2">
                <button class="w-10 h-10 rounded-full flex items-center justify-center glass-icon-btn text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                <button class="flex items-center gap-2 px-4 py-2 rounded-full glass-pill text-white text-xs font-semibold">
                    <i class="fa-solid fa-music text-pink-400"></i> Add sound
                </button>
                <button class="w-10 h-10 rounded-full flex items-center justify-center bg-gradient-to-tr from-purple-600 to-amber-400 p-[1.5px]">
                    <div class="w-full h-full bg-black/40 rounded-full flex items-center justify-center"><i class="fa-solid fa-wand-magic-sparkles text-amber-300 text-sm"></i></div>
                </button>
            </div>
        </div>

        <!-- RIGHT MENU -->
        <div class="absolute right-3 top-20 z-20 flex flex-col gap-4 items-center glass-dark py-3 px-2 rounded-full shadow-2xl">
            <button id="flipCamBtn" class="flex flex-col items-center gap-1 active:scale-90 transition-transform">
                <div class="w-9 h-9 rounded-full flex items-center justify-center"><i class="fa-solid fa-rotate text-lg"></i></div>
                <span class="text-[10px] font-medium text-white">Flip</span>
            </button>
        </div>

        <!-- BOTTOM CONTROLS -->
        <div class="relative z-20 w-full pb-6 px-4 flex flex-col gap-4 bg-gradient-to-t from-black/90 via-black/40 to-transparent pt-12">
            <div class="flex items-center justify-between px-6">
                <div class="w-12 h-12 rounded-xl overflow-hidden border-2 border-white/80 p-0.5 glass-icon-btn">
                    <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover rounded-lg">
                </div>

                <div class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center">
                    <button class="w-16 h-16 rounded-full bg-red-600 active:scale-90 transition-all"></button>
                </div>

                <div class="w-12 h-12 rounded-xl flex items-center justify-center glass-icon-btn border border-white/20 text-white">
                    <i class="fa-solid fa-bolt-slash text-lg"></i>
                </div>
            </div>
        </div>

        <!-- TOAST -->
        <div id="toast" class="absolute top-16 left-1/2 -translate-x-1/2 z-50 bg-neutral-800/90 text-white text-xs px-4 py-2 rounded-full opacity-0 pointer-events-none transition-all duration-300">
            <span id="toastMsg">Message</span>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentMode = 'user'; // 'user' ama 'environment'
            let stream = null;

            const video = document.getElementById('webcamVideo');
            const fallback = document.getElementById('fallbackBg');
            const flipBtn = document.getElementById('flipCamBtn');

            function showToast(msg) {
                const toast = document.getElementById('toast');
                document.getElementById('toastMsg').textContent = msg;
                toast.classList.remove('opacity-0');
                setTimeout(() => toast.classList.add('opacity-0'), 2000);
            }

            async function startCamera(facingMode) {
                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                }

                try {
                    // Codbso amar fudud oo aan adkayn
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingMode },
                        audio: false
                    });
                    video.srcObject = stream;
                    video.classList.remove('hidden');
                    fallback.classList.add('hidden');
                } catch (err) {
                    console.log("Error:", err);
                    // Hadduu diado 'environment', tijaabi kamarad kasta
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        video.srcObject = stream;
                        video.classList.remove('hidden');
                        fallback.classList.add('hidden');
                    } catch (e) {
                        video.classList.add('hidden');
                        fallback.classList.remove('hidden');
                        showToast("Fadlan ka fur koodhka Google Chrome!");
                    }
                }
            }

            // Bilow
            startCamera(currentMode);

            // Flip Button
            flipBtn.addEventListener('click', () => {
                currentMode = (currentMode === 'user') ? 'environment' : 'user';
                startCamera(currentMode);
                showToast(currentMode === 'environment' ? "Back Camera" : "Front Camera");
            });
        });
    </script>
</body>
</html>
