<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomWallet - USDT BEP20 Transfer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v5 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl w-full max-w-md p-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-400">SomWallet App</h1>
            <p class="text-sm text-slate-400">USDT Transfer (BNB Smart Chain - Mainnet)</p>
        </div>

        <div class="space-y-4">
            <!-- Private Key -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">SomWallet Private Key</label>
                <input type="password" id="privateKey" placeholder="Geli Private Key-gaaga..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Recipient Address -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Cinwaanka Qaataha (Recipient)</label>
                <input type="text" id="recipient" placeholder="0x..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Amount -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Cadadka USDT (Amount)</label>
                <input type="number" id="amount" placeholder="10" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <!-- Submit Button -->
            <button onclick="sendUSDT()" id="sendBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg transition duration-200 text-sm shadow-lg">
                Dir USDT-ga 🚀
            </button>
        </div>

        <!-- Status / Logs Box -->
        <div class="mt-6">
            <h2 class="text-xs font-semibold text-slate-400 mb-1">Xaaladda (Status Logs):</h2>
            <div id="logBox" class="bg-slate-950 border border-slate-800 rounded-lg p-3 h-36 overflow-y-auto text-xs font-mono text-emerald-300 space-y-1">
                <span class="text-slate-500">Sugaya hawlgalka...</span>
            </div>
        </div>
    </div>

    <script>
        const USDT_CONTRACT_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
        const USDT_ABI = [
            "function balanceOf(address account) view returns (uint256)",
            "function transfer(address recipient, uint256 amount) returns (bool)",
            "function decimals() view returns (uint8)"
        ];

        function log(message, type = "normal") {
            const logBox = document.getElementById("logBox");
            let color = "text-emerald-300";
            if (type === "error") color = "text-red-400";
            if (type === "success") color = "text-cyan-400";
            if (type === "info") color = "text-amber-300";

            logBox.innerHTML += `<div class="${color}">> ${message}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function sendUSDT() {
            const privateKey = document.getElementById("privateKey").value.trim();
            const recipient = document.getElementById("recipient").value.trim();
            const amount = document.getElementById("amount").value.trim();
            const logBox = document.getElementById("logBox");

            logBox.innerHTML = ""; // Nadiifi log-yadii hore

            if (!privateKey || !recipient || !amount) {
                log("Fadlan buuxi dhammaan meelaha banaan!", "error");
                return;
            }

            try {
                log("Waxaa lagu xirmayaa BSC Mainnet RPC...", "info");
                const provider = new ethers.providers.JsonRpcProvider("https://bsc-dataseed.binance.org/");
                const wallet = new ethers.Wallet(privateKey, provider);

                log(`Cinwaankaaga: ${wallet.address.substring(0, 6)}...${wallet.address.slice(-4)}`, "normal");

                const usdtContract = new ethers.Contract(USDT_CONTRACT_ADDRESS, USDT_ABI, wallet);

                // Hubinta BNB (Gas Fee)
                const bnbBalance = await wallet.getBalance();
                if (bnbBalance.isZero()) {
                    log("Khalad: Boorsadu ma haysato BNB oo loogu talagalay Gas Fee!", "error");
                    return;
                }

                // Hubinta Decimals iyo Haraaga USDT
                const decimals = await usdtContract.decimals();
                const usdtBalance = await usdtContract.balanceOf(wallet.address);
                const parsedAmount = ethers.utils.parseUnits(amount, decimals);

                if (usdtBalance.lt(parsedAmount)) {
                    log("Khalad: Haraagaaga USDT wuu ka yar yahay inta aad direyso!", "error");
                    return;
                }

                log("Waxaa la dirayaa transaction-ka...", "info");
                const tx = await usdtContract.transfer(recipient, parsedAmount);
                log(`Hash-ka: ${tx.hash.substring(0, 10)}...`, "info");

                log("Waxaa la sugayaa xaqiijinta block-ga...", "info");
                const receipt = await tx.wait();

                log(`Guul! Si rasmi ah ayaa loo diray. Block: ${receipt.blockNumber}`, "success");

            } catch (error) {
                log(`Khalad: ${error.message || error}`, "error");
            }
        }
    </script>
</body>
</html>
