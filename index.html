<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok UI Replica</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Mobile Container Structure */
    .app-container {
      width: 100%;
      max-width: 412px;
      height: 100vh;
      max-height: 915px;
      background-color: #000;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    /* Background Video / Image Container */
    .media-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: linear-gradient(45deg, #111, #222);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-container img, .media-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Top Overlay Navigation */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      z-index: 10;
      color: #fff;
    }

    .top-tabs {
      display: flex;
      gap: 15px;
      font-weight: 600;
      font-size: 16px;
    }

    .top-tab {
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }

    .top-tab.active {
      color: #fff;
      border-bottom: 2px solid #fff;
      padding-bottom: 2px;
    }

    /* Right Side Action Buttons */
    .sidebar-actions {
      position: absolute;
      right: 12px;
      bottom: 90px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
      cursor: pointer;
    }

    .action-btn i {
      font-size: 32px;
      filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.5));
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .action-btn span {
      font-size: 12px;
      margin-top: 4px;
      font-weight: 600;
      text-shadow: 0px 1px 3px rgba(0,0,0,0.8);
    }

    /* Like Active State */
    .action-btn.liked i {
      color: #fe2c55;
      animation: pulse 0.3s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* Avatar Badge */
    .avatar-container {
      position: relative;
      margin-bottom: 10px;
    }

    .avatar-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #fff;
      object-fit: cover;
    }

    .follow-badge {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #fe2c55;
      color: #fff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
    }

    /* Disc / Audio animation */
    .sound-disc {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #222;
      border: 8px solid #111;
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Bottom Information (Username & Description) */
    .bottom-info {
      position: absolute;
      bottom: 75px;
      left: 12px;
      width: 75%;
      z-index: 10;
      color: #fff;
      text-shadow: 0px 1px 4px rgba(0,0,0,0.8);
    }

    .username {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .description {
      font-size: 14px;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .music-track {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #000;
      border-top: 0.5px solid rgba(255, 255, 255, 0.15);
      z-index: 20;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #8a8b91;
      font-size: 10px;
      cursor: pointer;
      gap: 3px;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item.active {
      color: #fff;
    }

    /* Center Plus Icon Button */
    .create-btn {
      width: 45px;
      height: 28px;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 30%, #ff0844 70%, #ffb199 100%);
      border-radius: 8px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .create-btn-inner {
      width: 39px;
      height: 100%;
      background-color: #fff;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #000;
    }

    /* Modal / Popups for Comment */
    .comment-modal {
      position: absolute;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 65%;
      background-color: #121212;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      z-index: 30;
      transition: bottom 0.3s ease-in-out;
      display: flex;
      flex-direction: column;
      color: #fff;
    }

    .comment-modal.open {
      bottom: 0;
    }

    .comment-header {
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
    }

    .comment-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      font-size: 14px;
    }

    .comment-item {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .comment-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .comment-input-area {
      padding: 10px 15px;
      border-top: 1px solid #222;
      display: flex;
      gap: 10px;
    }

    .comment-input-area input {
      flex: 1;
      background: #222;
      border: none;
      border-radius: 20px;
      padding: 8px 15px;
      color: #fff;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Bar Navigation -->
    <div class="top-bar">
      <i class="fa-solid fa-tv"></i>
      <div class="top-tabs">
        <span class="top-tab">Following</span>
        <span class="top-tab active">For You</span>
      </div>
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>

    <!-- Background Media Player (Image / Video placeholder) -->
    <div class="media-container" id="mediaContainer">
      <img src="https://picsum.photos/400/800" alt="TikTok Content Video Placeholder">
    </div>

    <!-- Action Bar (Right Side Buttons) -->
    <div class="sidebar-actions">
      <!-- Profile Avatar -->
      <div class="avatar-container">
        <img class="avatar-img" src="https://picsum.photos/100/100" alt="User Profile">
        <div class="follow-badge" id="followBtn"><i class="fa-solid fa-plus"></i></div>
      </div>

      <!-- Like Button -->
      <div class="action-btn" id="likeBtn">
        <i class="fa-solid fa-heart"></i>
        <span id="likeCount">124.5K</span>
      </div>

      <!-- Comment Button -->
      <div class="action-btn" id="commentBtn">
        <i class="fa-solid fa-comment-dots"></i>
        <span>1,420</span>
      </div>

      <!-- Bookmark Button -->
      <div class="action-btn" id="bookmarkBtn">
        <i class="fa-solid fa-bookmark"></i>
        <span>8,910</span>
      </div>

      <!-- Share Button -->
      <div class="action-btn" id="shareBtn">
        <i class="fa-solid fa-share"></i>
        <span>Share</span>
      </div>

      <!-- Sound Disc Animation -->
      <div class="sound-disc"></div>
    </div>

    <!-- Post Metadata (User & Caption) -->
    <div class="bottom-info">
      <div class="username">@somali_creator <i class="fa-solid fa-circle-check" style="color:#20d5ec; font-size: 13px;"></i></div>
      <div class="description">Ku soo dhawoow interface-ka rasmiga ah oo u shaqaynaya sida TikTok! 🚀 #viral #somalia #developer</div>
      <div class="music-track">
        <i class="fa-solid fa-music"></i>
        <marquee scrollamount="4">Original Sound - Creator Studio Music</marquee>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </div>
      <div class="nav-item">
        <i class="fa-solid fa-user-group"></i>
        <span>Friends</span>
      </div>
      <div class="create-btn">
        <div class="create-btn-inner">
          <i class="fa-solid fa-plus"></i>
        </div>
      </div>
      <div class="nav-item">
        <i class="fa-regular fa-message"></i>
        <span>Inbox</span>
      </div>
      <div class="nav-item">
        <i class="fa-regular fa-user"></i>
        <span>Profile</span>
      </div>
    </div>

    <!-- Comment Popup Modal -->
    <div class="comment-modal" id="commentModal">
      <div class="comment-header">
        <span>1,420 comments</span>
        <i class="fa-solid fa-xmark" id="closeComment" style="cursor: pointer; font-size: 16px;"></i>
      </div>
      <div class="comment-body" id="commentList">
        <div class="comment-item">
          <img src="https://picsum.photos/50/50?random=1" class="comment-avatar">
          <div>
            <div style="font-weight: 600; font-size: 12px; color: #888;">@ali_user</div>
            <div>Masha Allah koodh aad u qurux badan! 🔥</div>
          </div>
        </div>
      </div>
      <div class="comment-input-area">
        <input type="text" id="commentInput" placeholder="Add comment...">
      </div>
    </div>

  </div>

  <!-- JavaScript Functionalities -->
  <script>
    // 1. Like Button Counter & Toggle Functionality
    const likeBtn = document.getElementById('likeBtn');
    const likeCount = document.getElementById('likeCount');
    let isLiked = false;
    let count = 124500;

    likeBtn.addEventListener('click', () => {
      isLiked = !isLiked;
      if (isLiked) {
        likeBtn.classList.add('liked');
        count++;
      } else {
        likeBtn.classList.remove('liked');
        count--;
      }
      likeCount.textContent = (count / 1000).toFixed(1) + 'K';
    });

    // 2. Follow Button Action
    const followBtn = document.getElementById('followBtn');
    followBtn.addEventListener('click', () => {
      followBtn.style.display = 'none';
    });

    // 3. Comment Drawer Functionality
    const commentBtn = document.getElementById('commentBtn');
    const commentModal = document.getElementById('commentModal');
    const closeComment = document.getElementById('closeComment');

    commentBtn.addEventListener('click', () => {
      commentModal.classList.add('open');
    });

    closeComment.addEventListener('click', () => {
      commentModal.classList.remove('open');
    });

    // 4. Add Comment Dynamically
    const commentInput = document.getElementById('commentInput');
    const commentList = document.getElementById('commentList');

    commentInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && commentInput.value.trim() !== '') {
        const newComment = document.createElement('div');
        newComment.className = 'comment-item';
        newComment.innerHTML = `
          <img src="https://picsum.photos/50/50?random=2" class="comment-avatar">
          <div>
            <div style="font-weight: 600; font-size: 12px; color: #888;">@you</div>
            <div>${commentInput.value}</div>
          </div>
        `;
        commentList.prepend(newComment);
        commentInput.value = '';
      }
    });

    // 5. Native Share Option Integration
    const shareBtn = document.getElementById('shareBtn');
    shareBtn.addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: 'TikTok Video',
          url: window.location.href
        });
      } else {
        alert("Link-ga waa la koobiyey!");
      }
    });
  </script>
</body>
</html>
