<!DOCTYPE html>
<html lang="so" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNN MicroPay - Multi-Asset Wallet</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#8b5cf6', 600: '#7c3aed' },
                        darkBg: '#0b0f19',
                        darkCard: '#111827',
                        darkInput: '#1f2937'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen font-sans pb-12">
    <div class="max-w-md mx-auto p-4 space-y-5">
        
        <!-- Header -->
        <header class="flex justify-between items-center bg-darkCard p-4 rounded-2xl border border-gray-800 shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center font-bold text-lg shadow-md shadow-brand-500/20">
                    ⬡
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">KNN MicroPay</h1>
                    <p class="text-xs text-gray-400">Multi-Asset Wallet</p>
                </div>
            </div>
            <div class="text-right">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> Online
                </span>
            </div>
        </header>

        <!-- Profile / Info -->
        <div class="bg-darkCard p-3 rounded-xl border border-gray-800/80 flex justify-between items-center text-xs">
            <div>
                <span class="text-gray-400">ID:</span>
                <span class="font-mono font-bold text-brand-500 ml-1">KNN-872257</span>
            </div>
            <div class="text-gray-300 font-mono">
                abuukarcumar661@gmail.com
            </div>
        </div>

        <!-- Wallet Cards (POL & SOS) -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-darkCard p-4 rounded-2xl border border-gray-800 relative overflow-hidden">
                <div class="w-1 h-8 bg-brand-500 absolute left-0 top-4 rounded-r-full"></div>
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">POLYGON</p>
                <h2 id="polBalance" class="text-xl font-bold tracking-tight">0.0000 <span class="text-xs text-brand-500">POL</span></h2>
            </div>
            <div class="bg-darkCard p-4 rounded-2xl border border-gray-800 relative overflow-hidden">
                <div class="w-1 h-8 bg-emerald-500 absolute left-0 top-4 rounded-r-full"></div>
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">SHILIN SOOMAALI</p>
                <h2 id="sosBalance" class="text-xl font-bold tracking-tight">0.00 <span class="text-xs text-emerald-400">SOS</span></h2>
            </div>
        </div>

        <!-- Deposit Address -->
        <div class="bg-darkCard p-4 rounded-2xl border border-gray-800 space-y-2">
            <div class="flex justify-between items-center">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Deposit Address (Polygon)</label>
                <button onclick="fetchLiveBalance()" class="text-[10px] text-brand-500 hover:underline">Refresh Balance 🔄</button>
            </div>
            <div class="flex items-center space-x-2 bg-darkInput p-2.5 rounded-xl border border-gray-700">
                <input id="depositAddr" type="text" readonly value="0x0BB8317Fac7ABAAe79e213BF0eBE80d960d324a0" class="bg-transparent text-xs font-mono text-gray-300 w-full focus:outline-none">
                <button onclick="copyAddr()" class="bg-brand-600 hover:bg-brand-500 text-xs px-3 py-1.5 rounded-lg font-medium transition">Copy</button>
            </div>
        </div>

        <!-- Private Key Section -->
        <div class="bg-darkCard p-4 rounded-2xl border border-gray-800 space-y-3">
            <label class="text-xs font-semibold text-amber-500 uppercase tracking-wider">Private Key-gaaga (Sir)</label>
            <div class="relative">
                <input id="pkInput" type="password" readonly value="0x4fdf339637928ed3c0ac45aa37da66059dc717d6baa96ff3b63c6832e4f23eb7" class="w-full bg-darkInput border border-gray-700 rounded-xl p-3 text-xs font-mono text-gray-300 pr-10 focus:outline-none">
            </div>
            <button onclick="togglePK()" id="pkBtn" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-2.5 text-xs rounded-xl transition">
                Muuji Private Key-ga
            </button>
        </div>

        <!-- Internal Swap -->
        <div class="bg-darkCard p-4 rounded-2xl border border-gray-800 space-y-3">
            <h3 class="text-sm font-bold text-brand-500">Is-dhaafsiga (Internal Swap)</h3>
            <div class="space-y-2">
                <label class="text-xs text-gray-400">Nooca Sarifka:</label>
                <select id="swapType" class="w-full bg-darkInput border border-gray-700 rounded-xl p-2.5 text-xs text-gray-200 focus:outline-none">
                    <option value="SOS_POL">Shilin Soomaali (SOS) ➔ Polygon (POL)</option>
                    <option value="POL_SOS">Polygon (POL) ➔ Shilin Soomaali (SOS)</option>
                </select>
            </div>
            <div class="space-y-2">
                <label class="text-xs text-gray-400">Cadadka:</label>
                <input id="swapAmount" type="number" placeholder="Tusaale: 1000" class="w-full bg-darkInput border border-gray-700 rounded-xl p-2.5 text-xs text-gray-200 focus:outline-none">
            </div>
            <button onclick="executeSwap()" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3 text-xs rounded-xl shadow-lg shadow-brand-500/20 transition">
                Ku Samee Swap Hadda
            </button>
        </div>

    </div>

    <script>
        const targetAddress = "0x0BB8317Fac7ABAAe79e213BF0eBE80d960d324a0";

        async function fetchLiveBalance() {
            try {
                document.getElementById('polBalance').innerHTML = `Checking...`;
                
                // Isticmaalka Polygon RPC-ga rasmiga ah iyada oo la adeegsanayo Ethers.js
                const provider = new ethers.JsonRpcProvider("https://polygon-rpc.com");
                const balanceWei = await provider.getBalance(targetAddress);
                const balancePol = ethers.formatEther(balanceWei);
                
                const polNum = parseFloat(balancePol);
                document.getElementById('polBalance').innerHTML = `${polNum.toFixed(4)} <span class="text-xs text-brand-500">POL</span>`;
                
                // Xisaabinta Shilin Soomaaliga (Tusaale ahaan 1 POL = 1500 SOS)
                const sosVal = polNum * 1500;
                document.getElementById('sosBalance').innerHTML = `${sosVal.toFixed(2)} <span class="text-xs text-emerald-400">SOS</span>`;
                
            } catch (error) {
                console.error("Waa la waayay xogta:", error);
                document.getElementById('polBalance').innerHTML = `0.0000 <span class="text-xs text-brand-500">POL</span>`;
            }
        }

        function togglePK() {
            const input = document.getElementById('pkInput');
            const btn = document.getElementById('pkBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = 'Qari Private Key-ga';
            } else {
                input.type = 'password';
                btn.innerText = 'Muuji Private Key-ga';
            }
        }

        function copyAddr() {
            const input = document.getElementById('depositAddr');
            navigator.clipboard.writeText(input.value);
            alert('Cinwaanka waa la kopiyeeyay!');
        }

        function executeSwap() {
            const amount = document.getElementById('swapAmount').value;
            if(!amount || amount <= 0) {
                alert('Fadlan geli cadad sax ah!');
                return;
            }
            alert('Codkaaga swap-ka waa la diiwaangeliyay!');
        }

        // Markuu page-ku furmo isla markaaba soo jiido balance-ka
        window.onload = function() {
            fetchLiveBalance();
        };

        // Dib u cusboonaysi 20 ilbiriqsi kasta
        setInterval(fetchLiveBalance, 20000);
    </script>
</body>
</html>
