<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somali Coin - Wallet Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#070F2B',
                        cardBg: '#1B1A55',
                        accentBlue: '#2563EB',
                        neonCyan: '#00D2FF',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 flex justify-center items-center min-h-screen font-sans text-white">

    <!-- Mobile Screen Container -->
    <div class="w-[380px] h-[812px] bg-[#0b132b] rounded-[40px] border-[8px] border-slate-900 shadow-2xl flex flex-col justify-between overflow-hidden relative">
        
        <!-- Status Bar -->
        <div class="flex justify-between items-center px-6 pt-4 text-xs font-semibold text-slate-300">
            <span>9:41</span>
            <div class="flex space-x-1.5 items-center">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-xs"></i>
            </div>
        </div>

        <!-- Main Content Area (Scrollable) -->
        <div class="flex-1 overflow-y-auto px-5 pt-3 pb-20 space-y-5 scrollbar-none">
            
            <!-- Top Bar / Profile -->
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="User" class="w-10 h-10 rounded-full border border-cyan-400 object-cover">
                    <div>
                        <p class="text-xs text-slate-400">Good Morning,</p>
                        <h2 class="text-sm font-bold">Ahmed Ali</h2>
                    </div>
                </div>
                <div class="w-9 h-9 rounded-full bg-slate-800/80 flex items-center justify-center text-slate-300 border border-slate-700">
                    <i class="fa-regular fa-bell text-sm"></i>
                </div>
            </div>

            <!-- Total Balance Card -->
            <div class="bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-900 p-5 rounded-3xl shadow-lg relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-cyan-400/10 rounded-full blur-xl"></div>
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-xs text-blue-200 uppercase tracking-wider">Total Balance</p>
                        <h1 class="text-2xl font-extrabold mt-1">5,240.00 <span class="text-sm font-normal text-cyan-300">SCM</span></h1>
                        <p class="text-xs text-blue-200 mt-0.5">≈ $0.52 USD</p>
                    </div>
                    <div class="w-10 h-10 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center text-cyan-300">
                        <i class="fa-solid fa-coins text-lg"></i>
                    </div>
                </div>
                <div class="mt-3 inline-flex items-center space-x-1 bg-emerald-500/20 text-emerald-300 px-2.5 py-1 rounded-full text-xs font-semibold">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                    <span>+12.5%</span>
                </div>
            </div>

            <!-- Quick Action Buttons -->
            <div class="grid grid-cols-4 gap-3 text-center">
                <div class="flex flex-col items-center space-y-1.5 cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-600/30">
                        <i class="fa-solid fa-arrow-down"></i>
                    </div>
                    <span class="text-[11px] text-slate-300 font-medium">Receive</span>
                </div>
                <div class="flex flex-col items-center space-y-1.5 cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-cyan-400">
                        <i class="fa-solid fa-arrow-up"></i>
                    </div>
                    <span class="text-[11px] text-slate-300 font-medium">Send</span>
                </div>
                <div class="flex flex-col items-center space-y-1.5 cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-cyan-400">
                        <i class="fa-solid fa-rotate"></i>
                    </div>
                    <span class="text-[11px] text-slate-300 font-medium">Swap</span>
                </div>
                <div class="flex flex-col items-center space-y-1.5 cursor-pointer">
                    <div class="w-12 h-12 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-cyan-400">
                        <i class="fa-solid fa-ellipsis"></i>
                    </div>
                    <span class="text-[11px] text-slate-300 font-medium">More</span>
                </div>
            </div>

            <!-- Coin Price Widget -->
            <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs text-slate-400">Coin Price</span>
                    <span class="text-xs text-emerald-400 font-semibold">+12.5%</span>
                </div>
                <div class="flex justify-between items-end">
                    <span class="text-lg font-bold">$0.0001 <span class="text-xs text-slate-400 font-normal">USD</span></span>
                    <div class="w-24 h-8 flex items-center">
                        <svg viewBox="0 0 100 30" class="w-full h-full stroke-emerald-400 fill-none stroke-[2]">
                            <path d="M0 25 Q 25 5, 50 15 T 100 5"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Quick Access / Features -->
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Quick Access</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-900/80 border border-slate-800/80 p-3.5 rounded-2xl flex items-center space-x-3 cursor-pointer">
                        <div class="w-9 h-9 rounded-xl bg-blue-500/10 text-cyan-400 flex items-center justify-center">
                            <i class="fa-solid fa-gift"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold">Airdrop</h4>
                            <p class="text-[10px] text-slate-400">Get Free SCM</p>
                        </div>
                    </div>
                    <div class="bg-slate-900/80 border border-slate-800/80 p-3.5 rounded-2xl flex items-center space-x-3 cursor-pointer">
                        <div class="w-9 h-9 rounded-xl bg-blue-500/10 text-cyan-400 flex items-center justify-center">
                            <i class="fa-solid fa-layer-group"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold">Staking</h4>
                            <p class="text-[10px] text-slate-400">Earn More</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <div class="absolute bottom-0 left-0 right-0 h-16 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex justify-around items-center px-2 text-slate-400">
            <div class="flex flex-col items-center text-blue-500 cursor-pointer">
                <i class="fa-solid fa-house text-base"></i>
                <span class="text-[10px] mt-1 font-semibold">Home</span>
            </div>
            <div class="flex flex-col items-center hover:text-white cursor-pointer">
                <i class="fa-solid fa-wallet text-base"></i>
                <span class="text-[10px] mt-1">Wallet</span>
            </div>
            <div class="flex flex-col items-center hover:text-white cursor-pointer">
                <i class="fa-solid fa-gift text-base"></i>
                <span class="text-[10px] mt-1">Airdrop</span>
            </div>
            <div class="flex flex-col items-center hover:text-white cursor-pointer">
                <i class="fa-solid fa-chart-line text-base"></i>
                <span class="text-[10px] mt-1">Earn</span>
            </div>
            <div class="flex flex-col items-center hover:text-white cursor-pointer">
                <i class="fa-solid fa-user text-base"></i>
                <span class="text-[10px] mt-1">Profile</span>
            </div>
        </div>

    </div>

</body>
</html>
