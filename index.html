<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Camera UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { ytRed: '#FF0000' },
                    animation: { 'pulse-glow': 'pulseGlow 1.5s infinite ease-in-out' },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(255, 0, 0, 0.7)' },
                            '50%': { transform: 'scale(1.05)', boxShadow: '0 0 0 14px rgba(255, 0, 0, 0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f0f0f; color: #ffffff; user-select: none; -webkit-user-select: none; }
        .glass-pill { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); }
        .glass-dark { background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-icon-btn { background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center overflow-hidden font-sans bg-neutral-950">

    <div class="relative w-full h-full sm:max-w-[410px] sm:h-[840px] sm:rounded-[44px] overflow-hidden bg-black shadow-2xl border-0 sm:border-[8px] border-neutral-800 flex flex-col justify-between select-none">

        <!-- CAMERA VIEWFINDER -->
        <div id="cameraViewfinder" class="absolute inset-0 z-0 bg-neutral-900 transition-all duration-300">
            <video id="webcamVideo" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline muted></video>
            <div id="fallbackBg" class="absolute inset-0 w-full h-full bg-cover bg-center hidden" style="background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000&auto=format&fit=crop');"></div>
        </div>

        <!-- HEADER CONTROLS -->
        <div class="relative z-20 w-full pt-3 px-3 flex flex-col gap-2">
            <div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden">
                <div id="recordingProgress" class="bg-ytRed h-full w-0% transition-all duration-100 ease-linear rounded-full"></div>
            </div>
            <div class="flex items-center justify-between px-2 pt-1">
                <button id="closeBtn" class="w-10 h-10 rounded-full flex items-center justify-center glass-icon-btn text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                <button id="addSoundBtn" class="flex items-center gap-2 px-4 py-2 rounded-full glass-pill text-white text-xs font-semibold"><i class="fa-solid fa-music text-pink-400"></i> <span id="selectedSoundText">Add sound</span></button>
                <button id="quickMagicBtn" class="w-10 h-10 rounded-full flex items-center justify-center bg-gradient-to-tr from-purple-600 to-amber-400 p-[1.5px]"><div class="w-full h-full bg-black/40 rounded-full flex items-center justify-center"><i class="fa-solid fa-wand-magic-sparkles text-amber-300 text-sm"></i></div></button>
            </div>
            <div id="recordingTimerBadge" class="self-center hidden items-center gap-2 bg-red-600/80 text-white text-xs px-3 py-1 rounded-full font-bold animate-pulse">
                <span class="w-2 h-2 rounded-full bg-white"></span>
                <span id="timerText">00:00 / 00:15</span>
            </div>
        </div>

        <!-- SIDEBAR CONTROLS -->
        <div class="absolute right-3 top-20 z-20 flex flex-col gap-4 items-center glass-dark py-3 px-2 rounded-full shadow-2xl">
            <button id="flipCamBtn" class="flex flex-col items-center gap-1 group active:scale-90 transition-transform">
                <div class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-white/20"><i class="fa-solid fa-rotate text-lg"></i></div>
                <span class="text-[10px] text-white/90">Flip</span>
            </button>
            <button id="flashBtn" class="flex flex-col items-center gap-1 group active:scale-90 transition-transform">
                <div class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-white/20"><i id="flashIcon" class="fa-solid fa-bolt-slash text-base"></i></div>
                <span id="flashLabel" class="text-[10px] text-white/90">Flash</span>
            </button>
        </div>

        <!-- BOTTOM CONTROLS -->
        <div class="relative z-20 w-full pb-4 px-4 flex flex-col gap-4 bg-gradient-to-t from-black/90 via-black/40 to-transparent pt-12">
            <div class="flex items-center justify-between px-6">
                <div class="w-12 h-12 rounded-xl overflow-hidden border-2 border-white/80 p-0.5 glass-icon-btn">
                    <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover rounded-lg">
                </div>
                <div class="relative flex items-center justify-center">
                    <div id="recordRing" class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center">
                        <button id="recordBtn" class="w-16 h-16 rounded-full bg-ytRed shadow-xl flex items-center justify-center cursor-pointer">
                            <div id="recordInnerIcon" class="w-full h-full rounded-full bg-ytRed"></div>
                        </button>
                    </div>
                </div>
                <div class="w-12 h-12 rounded-xl flex items-center justify-center glass-icon-btn text-white text-xs font-bold">Tool</div>
            </div>
        </div>

        <!-- TOAST NOTIFICATION -->
        <div id="toast" class="absolute top-16 left-1/2 -translate-x-1/2 z-50 bg-neutral-800/90 text-white text-xs px-4 py-2 rounded-full border border-white/10 shadow-xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
            <i id="toastIcon" class="fa-solid fa-circle-info text-pink-400"></i>
            <span id="toastMsg">Notification message</span>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentFacingMode = 'user'; // 'user' = Hore, 'environment' = Dambe
            let mediaStream = null;
            const webcamVideo = document.getElementById('webcamVideo');
            const fallbackBg = document.getElementById('fallbackBg');
            const flipCamBtn = document.getElementById('flipCamBtn');

            function showToast(message, iconClass = 'fa-solid fa-circle-info text-pink-400') {
                const toast = document.getElementById('toast');
                document.getElementById('toastMsg').textContent = message;
                document.getElementById('toastIcon').className = iconClass;
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('opacity-100');
                setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none'); toast.classList.remove('opacity-100'); }, 2500);
            }

            async function initCamera(facingMode) {
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        throw new Error("Browser-kaagu ma taageerayo kamaradda sababtoo ah faylka waxaa laga furay xusuusta tooska ah (file://). Fadlan ku fur Local Server ama Netlify.");
                    }

                    if (mediaStream) {
                        mediaStream.getTracks().forEach(track => track.stop());
                    }

                    const constraints = { video: { facingMode: facingMode }, audio: false };
                    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                    webcamVideo.srcObject = mediaStream;
                    webcamVideo.classList.remove('hidden');
                    fallbackBg.classList.add('hidden');
                    webcamVideo.play();
                } catch (err) {
                    console.log("Camera Error: ", err);
                    webcamVideo.classList.add('hidden');
                    fallbackBg.classList.remove('hidden');
                    showToast("Fadlan app-ka ku fur Server (tusaale Netlify ama localhost)", "fa-solid fa-triangle-exclamation text-yellow-400");
                }
            }

            initCamera(currentFacingMode);

            flipCamBtn.addEventListener('click', () => {
                currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
                initCamera(currentFacingMode);
                showToast(currentFacingMode === 'environment' ? "Kamaradda Dambe" : "Kamaradda Hore", "fa-solid fa-rotate");
            });
        });
    </script>
</body>
</html>
