<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KNN Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-cream: #FEFBEA;
            --card-white: #FFFFFF;
            --border-soft: #E5E7EB;
            --text-dark: #111827;
            --text-muted: #6B7280;
            --accent-blue: #1D4ED8;
            --accent-blue-dark: #1E3A8A;
            --accent-gold: #D97706;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-shell {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: var(--bg-cream);
            padding: 16px 14px 92px 14px;
        }

        .hero-card {
            background: linear-gradient(135deg, #1E40AF 0%, #1D4ED8 55%, #2563EB 100%);
            color: #FFFFFF;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 8px 20px rgba(29, 78, 216, 0.16);
        }

        .hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 14px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.16);
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            padding: 5px 10px;
            border-radius: 999px;
        }

        .min-dep-pill {
            background: rgba(15, 23, 42, 0.28);
            color: #DBEAFE;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 999px;
        }

        .balance-main {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin: 4px 0 6px 0;
        }

        .sub-earnings {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #DBEAFE;
            margin-bottom: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #BFDBFE;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 800;
            color: #FFFFFF;
            margin-top: 3px;
            word-break: break-all;
        }

        .info-card {
            background-color: var(--card-white);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 15px;
            margin-top: 12px;
            box-shadow: 0 2px 8px rgba(17, 24, 39, 0.03);
        }

        .section-label {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .email-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            word-break: break-all;
        }

        .address-box {
            width: 100%;
            border: 1.5px solid #93C5FD;
            background-color: #F8FAFC;
            color: #1E3A8A;
            border-radius: 12px;
            padding: 11px 12px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            outline: none;
        }

        .key-box {
            width: 100%;
            border: 1.5px solid #FCA5A5;
            background-color: #FEF2F2;
            color: #991B1B;
            border-radius: 12px;
            padding: 11px 12px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            outline: none;
        }

        .btn-gray {
            width: 100%;
            margin-top: 10px;
            background-color: #E5E7EB;
            color: #111827;
            font-size: 13px;
            font-weight: 700;
            padding: 11px 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .btn-gray:active {
            opacity: 0.8;
        }

        .btn-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .toast-msg {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #1D4ED8;
            min-height: 16px;
        }

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #FFFFFF;
            border-top: 1px solid #E5E7EB;
            z-index: 50;
        }

        .bottom-nav-inner {
            max-width: 480px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            padding: 7px 4px 9px 4px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 10.5px;
            font-weight: 600;
            color: #6B7280;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 2px 0;
        }

        .nav-item.active {
            color: #1D4ED8;
            font-weight: 700;
        }

        .nav-item.quran-active {
            color: #D97706;
            font-weight: 700;
        }

        .nav-icon {
            font-size: 16px;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div id="appRoot" class="app-shell">
        <!-- Kaarka Sare Ee Balance-ka Iyo Account ID -->
        <section class="hero-card">
            <div class="hero-top">
                <span id="miningStatusBadge" class="status-pill">● MINING INACTIVE</span>
                <span class="min-dep-pill">Min Dep: 0.00001 POL</span>
            </div>

            <div id="balanceDisplay" class="balance-main">0.00000000 POL</div>

            <div class="sub-earnings">
                <span>Saamiga maalinlaha ah: <strong id="dailyRateText">0 POL</strong></span>
                <span id="perSecText">+0.000000/s</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">DAILY OUTPUT</div>
                    <div id="dailyOutputDisplay" class="stat-value">0.000009 POL</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">ACCOUNT ID</div>
                    <div id="accountIdDisplay" class="stat-value">KNN-205792</div>
                </div>
            </div>
        </section>

        <!-- Macluumaadka Xisaabta -->
        <section class="info-card">
            <div class="section-label">MACLUUMAADKA XISAABTA</div>
            <div id="userEmailDisplay" class="email-text">abuukarcumar661@gmail.com</div>
        </section>

        <!-- Cinwaanka Deposit-ka -->
        <section class="info-card">
            <div class="section-label">CINWAANKAAGA DEPOSIT-KA (POLYGON)</div>
            <input
                id="depositAddressInput"
                type="text"
                readonly
                class="address-box"
                value="0x613b603440CA724C266FC5432E2a20D000F73367"
            />
            <button type="button" onclick="copyDepositAddressSafe()" class="btn-gray">
                Copy Deposit Address
            </button>
            <div id="actionFeedback" class="toast-msg"></div>
        </section>

        <!-- Private Key-ga -->
        <section class="info-card">
            <div class="section-label">PRIVATE KEY-GAAGA (POLYGON)</div>
            <input
                id="privateKeyInput"
                type="password"
                readonly
                class="key-box"
                value="••••••••••••••••••••••••••••••••••••••••••"
                data-real-key=""
            />
            <div class="btn-row-2">
                <button type="button" onclick="togglePrivateKeySafe()" class="btn-gray">
                    Show / Hide
                </button>
                <button type="button" onclick="copyPrivateKeySafe()" class="btn-gray">
                    Copy Key
                </button>
            </div>
        </section>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="Bottom Navigation">
        <div class="bottom-nav-inner">
            <button type="button" class="nav-item" onclick="handleNavClick('Home', this)">
                <span class="nav-icon">🏠</span>
                <span>Home</span>
            </button>
            <button type="button" class="nav-item" onclick="handleNavClick('Chat', this)">
                <span class="nav-icon">💬</span>
                <span>Chat</span>
            </button>
            <button type="button" class="nav-item" onclick="handleNavClick('Upload', this)">
                <span class="nav-icon">＋</span>
                <span>Upload</span>
            </button>
            <button type="button" class="nav-item quran-active" onclick="handleNavClick('Qur’aan', this)">
                <span class="nav-icon">📖</span>
                <span>Qur'aan</span>
            </button>
            <button type="button" class="nav-item active" onclick="handleNavClick('Wallet', this)">
                <span class="nav-icon">💳</span>
                <span>Wallet</span>
            </button>
            <button type="button" class="nav-item" onclick="handleNavClick('Profile', this)">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </button>
        </div>
    </nav>

    <script>
        (function () {
            const SERVER_URL = window.KNN_SERVER_URL || 'https://somapp-website-production.up.railway.app';
            const DEFAULT_ACCOUNT_ID = 'KNN-205792';
            const DEFAULT_ADDRESS = '0x613b603440CA724C266FC5432E2a20D000F73367';
            const DEFAULT_EMAIL = 'abuukarcumar661@gmail.com';
            const MASKED_TEXT = '•'.repeat(42);

            window.addEventListener('error', (e) => {
                console.warn('Handled page error:', e.message || e.error);
            });

            window.addEventListener('unhandledrejection', (e) => {
                console.warn('Handled promise rejection:', e.reason);
            });

            function safeStr(v, fallback = '') {
                if (v === undefined || v === null) return fallback;
                const s = String(v).trim();
                return s.length > 0 ? s : fallback;
            }

            function safeNum(v, fallback = 0) {
                const n = Number(v);
                return Number.isFinite(n) ? n : fallback;
            }

            function setText(id, val) {
                try {
                    const el = document.getElementById(id);
                    if (el) el.textContent = val;
                } catch (_) {}
            }

            function setValue(id, val) {
                try {
                    const el = document.getElementById(id);
                    if (el) el.value = val;
                } catch (_) {}
            }

            function setFeedback(msg) {
                setText('actionFeedback', safeStr(msg, ''));
            }

            function renderWalletUI(rawData) {
                try {
                    const d = rawData && typeof rawData === 'object' ? rawData : {};
                    const bal = safeNum(d.balance, 0);
                    const daily = safeNum(d.dailyLimit, 0.000009);
                    const active = Boolean(d.miningActive) || bal > 0;
                    const accId = safeStr(d.userId, DEFAULT_ACCOUNT_ID);
                    const addr = safeStr(d.polygonAddress, DEFAULT_ADDRESS);
                    const email = safeStr(d.email, DEFAULT_EMAIL);
                    const pk = safeStr(d.privateKey, '');

                    setText('balanceDisplay', `${bal.toFixed(8)} POL`);
                    setText('dailyOutputDisplay', `${daily.toFixed(6)} POL`);
                    setText('accountIdDisplay', accId);
                    setText('userEmailDisplay', email);

                    if (active) {
                        setText('miningStatusBadge', '● MINING ACTIVE');
                        setText('dailyRateText', `${daily.toFixed(6)} POL`);
                        setText('perSecText', `+${(daily / 86400).toFixed(6)}/s`);
                    } else {
                        setText('miningStatusBadge', '● MINING INACTIVE');
                        setText('dailyRateText', '0 POL');
                        setText('perSecText', '+0.000000/s');
                    }

                    setValue('depositAddressInput', addr);

                    const pkEl = document.getElementById('privateKeyInput');
                    if (pkEl) {
                        if (pk) {
                            pkEl.dataset.realKey = pk;
                        }
                        const currentReal = pkEl.dataset.realKey || '';
                        if (pkEl.type === 'password') {
                            pkEl.value = currentReal ? MASKED_TEXT : 'Lama helin';
                        } else {
                            pkEl.value = currentReal || 'Lama helin';
                        }
                    }

                    try {
                        localStorage.setItem('knn_wallet_ui_state', JSON.stringify({
                            userId: accId,
                            polygonAddress: addr,
                            email: email,
                            balance: bal.toFixed(8),
                            dailyLimit: daily.toFixed(6),
                            miningActive: active
                        }));
                    } catch (_) {}
                } catch (err) {
                    console.warn('renderWalletUI error:', err.message);
                }
            }

            function restoreCachedState() {
                try {
                    const cached = localStorage.getItem('knn_wallet_ui_state');
                    if (cached) {
                        renderWalletUI(JSON.parse(cached));
                    }
                } catch (_) {}
            }

            async function syncWalletFromServer(userObj) {
                if (!userObj || !userObj.uid) return;

                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 15000);

                try {
                    const response = await fetch(`${SERVER_URL}/api/auth-user`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            uid: safeStr(userObj.uid),
                            email: safeStr(userObj.email, DEFAULT_EMAIL),
                            displayName: safeStr(userObj.displayName, 'User')
                        }),
                        signal: controller.signal
                    });

                    clearTimeout(timer);
                    if (!response.ok) return;

                    const json = await response.json();
                    if (json && json.success) {
                        renderWalletUI({
                            ...json,
                            email: safeStr(userObj.email, DEFAULT_EMAIL)
                        });
                    }
                } catch (_) {
                    clearTimeout(timer);
                }
            }

            window.copyDepositAddressSafe = async function () {
                try {
                    const addr = safeStr(document.getElementById('depositAddressInput')?.value, DEFAULT_ADDRESS);
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(addr);
                    }
                    setFeedback('Cinwaanka deposit-ka waa la koobiyeeyay.');
                } catch (_) {
                    setFeedback('Fadlan gacanta kaga koobiyeey cinwaanka.');
                }
            };

            window.togglePrivateKeySafe = function () {
                try {
                    const pkEl = document.getElementById('privateKeyInput');
                    if (!pkEl) return;
                    const realKey = safeStr(pkEl.dataset.realKey, '');
                    if (!realKey) {
                        pkEl.value = 'Lama helin';
                        setFeedback('Private key lama helin.');
                        return;
                    }
                    if (pkEl.type === 'password') {
                        pkEl.type = 'text';
                        pkEl.value = realKey;
                        setFeedback('Private key waa muuqdaa.');
                    } else {
                        pkEl.type = 'password';
                        pkEl.value = MASKED_TEXT;
                        setFeedback('Private key waa la qariyay.');
                    }
                } catch (_) {}
            };

            window.copyPrivateKeySafe = async function () {
                try {
                    const pkEl = document.getElementById('privateKeyInput');
                    const realKey = safeStr(pkEl?.dataset?.realKey, '');
                    if (!realKey) {
                        setFeedback('Private key ma jiro oo la koobiyeeyo.');
                        return;
                    }
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(realKey);
                    }
                    setFeedback('Private key-ga waa la koobiyeeyay.');
                } catch (_) {
                    setFeedback('Lama koobiyeeyn karin private key-ga.');
                }
            };

            window.handleNavClick = function (tabName, btnEl) {
                try {
                    document.querySelectorAll('.nav-item').forEach((el) => el.classList.remove('active'));
                    if (btnEl) btnEl.classList.add('active');
                    setFeedback(`Tab: ${tabName}`);
                } catch (_) {}
            };

            window.syncWalletFromServer = syncWalletFromServer;

            restoreCachedState();

            const savedUid = safeStr(localStorage.getItem('knn_uid'), '');
            const savedEmail = safeStr(localStorage.getItem('knn_email'), DEFAULT_EMAIL);
            if (savedUid) {
                syncWalletFromServer({ uid: savedUid, email: savedEmail, displayName: 'User' });
            }
        })();
    </script>
</body>
</html>
