<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNN MicroPay - Web3 Wallet</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card {
            background: #0f172a;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #1e293b;
        }
        .card-title {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .balance {
            font-size: 1.8rem;
            font-weight: bold;
            color: #f8fafc;
        }
        .address-box {
            word-break: break-all;
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            color: #38bdf8;
            font-size: 0.8rem;
            margin: 8px 0;
            border: 1px dashed #475569;
        }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .btn:hover { background: #0369a1; }
        .btn-google { background: #db4437; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-google:hover { background: #c23321; }
        .btn-withdraw { background: #10b981; }
        .btn-withdraw:hover { background: #059669; }
        .btn-logout { background: #ef4444; margin-top: 10px; }
        .btn-logout:hover { background: #dc2626; }
        .btn-warning { background: #d97706; font-size: 0.8rem; padding: 6px; }
        .btn-warning:hover { background: #b45309; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            margin-top: 6px;
            box-sizing: border-box;
        }
        .input-group { margin-bottom: 12px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <span style="background:#0284c7; color:white; padding:4px 8px; border-radius:6px;">K</span>
            KNN MicroPay
        </div>
        <div id="userStatus" style="font-size:0.8rem; color:#10b981;">Not Logged In</div>
    </div>

    <!-- Login View -->
    <div id="loginView" class="card" style="text-align: center; padding: 30px 16px;">
        <h3 style="color: #f8fafc; margin-top:0;">Ku soo dhawoow KNN MicroPay</h3>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">Fadlan ku gal Gmail-kaaga si aad u hesho Wallet-kaaga gaarka ah.</p>
        <button class="btn btn-google" onclick="loginWithGoogle()">
            <span>Google Login-ka ku gal</span>
        </button>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="hidden">
        <div class="card">
            <div class="card-title">
              <span>User ID: <strong id="userIdDisplay" style="color:#38bdf8;">--</strong></span>
              <span id="userEmailDisplay" style="color:#94a3b8; font-size:0.75rem;">--</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>Polygon Balance</span>
                <span style="color:#10b981;">Polygon Network</span>
            </div>
            <div class="balance" id="balanceDisplay">0.0000 POL</div>
        </div>

        <!-- Deposit Address -->
        <div class="card">
            <div class="card-title">Cinwaankaaga Deposit-ka (Address):</div>
            <div class="address-box" id="depositAddress">Loading...</div>
            <button class="btn" onclick="copyAddress()">Copy Address</button>
        </div>

        <!-- Private Key Section -->
        <div class="card" style="border: 1px solid #d97706;">
            <div class="card-title" style="color:#f59e0b; font-weight:bold;">Private Key-gaaga (Sir gaar ah)</div>
            <div class="address-box hidden" id="privateKeyBox" style="color: #fca5a5;">Loading...</div>
            <button class="btn btn-warning" id="toggleKeyBtn" onclick="togglePrivateKey()">Muuji Private Key-ga</button>
        </div>

        <!-- Withdraw Section -->
        <div class="card">
            <div class="card-title" style="color:#38bdf8; font-weight:bold;">Withdraw POL (Bixi Lacag)</div>
            <div class="input-group">
                <label style="font-size:0.8rem; color:#94a3b8;">Cinwaanka Qaataha:</label>
                <input type="text" id="recipientInput" placeholder="0x...">
            </div>
            <div class="input-group">
                <label style="font-size:0.8rem; color:#94a3b8;">Xadiga POL:</label>
                <input type="number" step="0.0001" id="amountInput" placeholder="0.1">
            </div>
            <button class="btn btn-withdraw" onclick="sendWithdraw()">Withdraw Now</button>
        </div>

        <button class="btn btn-logout" onclick="logoutUser()">Logout (Ka bax)</button>
    </div>
</div>

<script>
    // Xogtaada saxda ah ee Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCg_xRwZ8LVoQ6l-fUiQCN2bN2INkvHI6I",
      authDomain: "somapp-61ebd.firebaseapp.com",
      projectId: "somapp-61ebd",
      storageBucket: "somapp-61ebd.firebasestorage.app",
      messagingSenderId: "890890688001",
      appId: "1:890890688001:web:b7063dda31b860785f5200",
      measurementId: "G-XG4K89NNMM"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const SERVER_URL = 'https://somapp-website-production.up.railway.app';
    let currentUserUid = null;
    let userPolygonAddress = "";
    let userPrivateKeyStr = "";
    let isKeyVisible = false;

    // Isticmaalka signInWithRedirect si uusan taleefanku u xannibin
    async function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
            await firebase.auth().signInWithRedirect(provider);
        } catch (err) {
            console.error("Login Error:", err);
            alert("Cilad ayaa ka dhacday: " + err.message);
        }
    }

    async function authenticateWithBackend(user) {
        try {
            const response = await fetch(`${SERVER_URL}/api/auth-user`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: user.email,
                    uid: user.uid,
                    displayName: user.displayName
                })
            });

            const data = await response.json();
            if (data.success) {
                currentUserUid = user.uid;
                userPolygonAddress = data.polygonAddress;
                userPrivateKeyStr = data.privateKey;

                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                document.getElementById('userStatus').innerText = "Connected";

                document.getElementById('userIdDisplay').innerText = data.userId;
                document.getElementById('userEmailDisplay').innerText = user.email;
                document.getElementById('depositAddress').innerText = data.polygonAddress;
                document.getElementById('privateKeyBox').innerText = data.privateKey;
                document.getElementById('balanceDisplay').innerText = data.balance + " POL";
            } else {
                alert("Cilad Server: " + data.error);
            }
        } catch (err) {
            console.error(err);
            alert("Cilad ayaa ka dhacday xiriirka Server-ka.");
        }
    }

    // Hubinta natiijada marka uu user-ku ka soo laabto Google Redirect-ka
    firebase.auth().getRedirectResult().then(async (result) => {
        if (result.user) {
            await authenticateWithBackend(result.user);
        }
    }).catch((error) => {
        console.error("Redirect Error:", error);
    });

    // Hubinta xaaladda login-ka ee caadiga ah
    firebase.auth().onAuthStateChanged(async (user) => {
        if (user) {
            // Halkaane waa laga hubiyaa haddii uu hore u soo galay
            const response = await fetch(`${SERVER_URL}/api/auth-user`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: user.email,
                    uid: user.uid,
                    displayName: user.displayName
                })
            });
            const data = await response.json();
            if (data.success) {
                currentUserUid = user.uid;
                userPolygonAddress = data.polygonAddress;
                userPrivateKeyStr = data.privateKey;

                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                document.getElementById('userStatus').innerText = "Connected";

                document.getElementById('userIdDisplay').innerText = data.userId;
                document.getElementById('userEmailDisplay').innerText = user.email;
                document.getElementById('depositAddress').innerText = data.polygonAddress;
                document.getElementById('privateKeyBox').innerText = data.privateKey;
                document.getElementById('balanceDisplay').innerText = data.balance + " POL";
            }
        }
    });

    function copyAddress() {
        navigator.clipboard.writeText(userPolygonAddress);
        alert("Cinwaanka waa la koobiyeeyay!");
    }

    function togglePrivateKey() {
        const keyBox = document.getElementById('privateKeyBox');
        const btn = document.getElementById('toggleKeyBtn');

        if (!isKeyVisible) {
            if(confirm("Digniin: Qofna ha tusin Private Key-gaaga. Ma hubtaa inaad rabto inaad soo bandhigto?")) {
                keyBox.classList.remove('hidden');
                btn.innerText = "Qari Private Key-ga";
                isKeyVisible = true;
            }
        } else {
            keyBox.classList.add('hidden');
            btn.innerText = "Muuji Private Key-ga";
            isKeyVisible = false;
        }
    }

    async function sendWithdraw() {
        const recipient = document.getElementById('recipientInput').value.trim();
        const amount = document.getElementById('amountInput').value.trim();

        if (!recipient || !amount) {
            alert("Fadlan buuxi cinwaanka qaataha iyo xadiga lacagta!");
            return;
        }

        if (!confirm(`Ma hubtaa inaad dirayso ${amount} POL?`)) return;

        try {
            const response = await fetch(`${SERVER_URL}/api/withdraw`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    uid: currentUserUid,
                    recipientAddress: recipient,
                    amount: amount
                })
            });

            const data = await response.json();
            if (data.success) {
                alert("Guul! " + data.message + "\nTxHash: " + data.txHash);
                location.reload();
            } else {
                alert("Cilad: " + (data.error || "Waa la waayay jawaab"));
            }
        } catch (err) {
            console.error(err);
            alert("Cilad Server-ka ah ayaa dhacday.");
        }
    }

    function logoutUser() {
        firebase.auth().signOut().then(() => {
            location.reload();
        });
    }
</script>

</body>
</html>
