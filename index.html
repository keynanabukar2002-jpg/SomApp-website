<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SOMEDIA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      padding-top: 56px;
      padding-bottom: 60px;
      overflow-x: hidden;
    }

    /* TOP FIXED HEADER */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      z-index: 1000;
      background-color: #0f0f0f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #1f1f1f;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .brand-logo-img {
      height: 28px;
      width: 28px;
      object-fit: cover;
      border-radius: 6px;
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 18px;
      position: relative;
      cursor: pointer;
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -8px;
      background-color: #e50914;
      color: white;
      font-size: 9px;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 10px;
    }

    /* CATEGORIES BAR */
    .categories {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      background-color: #0f0f0f;
    }
    .categories::-webkit-scrollbar { display: none; }

    .chip {
      background-color: #272727;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }

    .chip.active {
      background-color: #ffffff;
      color: #0f0f0f;
      font-weight: 600;
    }

    /* SECTION TITLE */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 12px;
    }

    .shorts-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 700;
    }

    .shorts-logo {
      color: #ff0000;
      font-size: 18px;
    }

    .video-count {
      font-size: 12px;
      color: #888;
      background: #1f1f1f;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* SHORTS GRID */
    .shorts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 12px 16px;
    }

    .short-card {
      position: relative;
      aspect-ratio: 9/16;
      border-radius: 12px;
      overflow: hidden;
      background-color: #1f1f1f;
      cursor: pointer;
    }

    .short-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tag-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      z-index: 2;
    }

    .more-options {
      position: absolute;
      top: 8px;
      right: 8px;
      color: white;
      font-size: 14px;
      z-index: 2;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .short-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.85) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
      color: #ffffff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-views {
      font-size: 11px;
      color: #aaaaaa;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* BOTTOM NAV BAR */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background-color: #0f0f0f;
      border-top: 1px solid #1f1f1f;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #aaaaaa;
      font-size: 10px;
      gap: 3px;
      cursor: pointer;
      width: 20%;
    }

    .nav-item.active {
      color: #ffffff;
    }

    .nav-item i {
      font-size: 18px;
    }

    .nav-custom-img {
      height: 26px;
      width: 26px;
      object-fit: cover;
      border-radius: 6px;
      border: 1.5px solid #ffffff;
      box-shadow: 0 2px 6px rgba(255, 255, 255, 0.3);
    }

    .profile-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: #e65100;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
    }

    /* FULLSCREEN PLAYER MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #000;
      z-index: 2000;
    }

    .modal-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      color: white;
      font-size: 22px;
      background: rgba(0,0,0,0.5);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }

    /* UPLOAD INPUT (HIDDEN) */
    #videoUploadInput {
      display: none;
    }
  </style>
</head>
<body>

  <!-- FIXED HEADER -->
  <header>
    <div class="header-left">
      <button class="back-btn"><i class="fa-solid fa-chevron-left"></i></button>
      <span class="brand-title">SOMEDIA</span>
      <img src="https://i.ibb.co/dwDSVhQm/20261022-043354998.png" alt="Logo" class="brand-logo-img">
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="triggerUpload()"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="icon-btn">
        <i class="fa-regular fa-bell"></i>
        <span class="badge">9+</span>
      </button>
    </div>
  </header>

  <!-- CATEGORIES -->
  <div class="categories">
    <button class="chip"><i class="fa-regular fa-compass"></i></button>
    <button class="chip active">Dhammaan</button>
    <button class="chip">Somali Tech</button>
    <button class="chip">Musig</button>
    <button class="chip">Ciyaaro</button>
    <button class="chip">Podcasts</button>
  </div>

  <!-- SHORTS TITLE -->
  <div class="section-title">
    <div class="shorts-brand">
      <i class="fa-solid fa-bolt shorts-logo"></i>
      <span>Shorts Feed</span>
    </div>
    <span class="video-count">4 videos</span>
  </div>

  <!-- SHORTS GRID -->
  <div class="shorts-grid" id="shortsGrid">
    <!-- Card 1 -->
    <div class="short-card" onclick="openPlayer('Sirta Miraha Cad iyo Waxtarkooda...', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4')">
      <span class="tag-badge">Somali Tech</span>
      <i class="fa-solid fa-ellipsis-vertical more-options"></i>
      <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80" alt="Short 1">
      <div class="short-overlay">
        <div class="card-title">Sirta Miraha Cad iyo Waxtarkooda...</div>
        <div class="card-views"><i class="fa-regular fa-eye"></i> 1.2M views</div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="short-card" onclick="openPlayer('Gaming and Animals...', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4')">
      <span class="tag-badge">Gaming</span>
      <i class="fa-solid fa-ellipsis-vertical more-options"></i>
      <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80" alt="Short 2">
      <div class="short-overlay">
        <div class="card-title">Gatos inteligentes y Gr...</div>
        <div class="card-views"><i class="fa-regular fa-eye"></i> 850K views</div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="short-card" onclick="openPlayer('Football Match Highlights', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4')">
      <span class="tag-badge">Podcasts</span>
      <i class="fa-solid fa-ellipsis-vertical more-options"></i>
      <img src="https://images.unsplash.com/photo-1575361204480-aadea25e6e68?auto=format&fit=crop&w=500&q=80" alt="Short 3">
      <div class="short-overlay">
        <div class="card-title">Ciyaaraha iyo Kubadda...</div>
        <div class="card-views"><i class="fa-regular fa-eye"></i> 430K views</div>
      </div>
    </div>

    <!-- Card 4 -->
    <div class="short-card" onclick="openPlayer('Wild Life Doc', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoylikes.mp4')">
      <span class="tag-badge">Musig</span>
      <i class="fa-solid fa-ellipsis-vertical more-options"></i>
      <img src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=500&q=80" alt="Short 4">
      <div class="short-overlay">
        <div class="card-title">5 Wild Animals That...</div>
        <div class="card-views"><i class="fa-regular fa-eye"></i> 2.5M views</div>
      </div>
    </div>
  </div>

  <!-- HIDDEN UPLOAD FILE INPUT -->
  <input type="file" id="videoUploadInput" accept="video/*" onchange="handleFileUpload(event)">

  <!-- BOTTOM NAV BAR -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-item">
      <i class="fa-solid fa-bolt"></i>
      <span>Shorts</span>
    </button>
    <button class="nav-item" onclick="triggerUpload()">
      <img src="https://i.ibb.co/dwDSVhQm/20261022-043354998.png" alt="Soo geli" class="nav-custom-img">
      <span>Soo geli</span>
    </button>
    <button class="nav-item">
      <i class="fa-solid fa-layer-group"></i>
      <span>Subscriptions</span>
    </button>
    <button class="nav-item">
      <div class="profile-avatar">S</div>
      <span>Adiga</span>
    </button>
  </nav>

  <!-- VIDEO PLAYER MODAL -->
  <div class="modal" id="playerModal">
    <button class="close-btn" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
    <div class="modal-content">
      <video id="videoPlayer" loop autoplay controls></video>
    </div>
  </div>

  <script>
    function openPlayer(title, videoSrc) {
      const modal = document.getElementById('playerModal');
      const player = document.getElementById('videoPlayer');
      player.src = videoSrc;
      modal.style.display = 'block';
      player.play();
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const player = document.getElementById('videoPlayer');
      player.pause();
      modal.style.display = 'none';
    }

    function triggerUpload() {
      document.getElementById('videoUploadInput').click();
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const videoUrl = URL.createObjectURL(file);
        openPlayer(file.name, videoUrl);
      }
    }
  </script>
</body>
</html>
