<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNN MicroPay - Polymarket Style</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0F1117] text-white flex justify-center items-center min-h-screen font-sans antialiased">

    <!-- Mobile Viewport Container -->
    <div class="w-full max-w-[420px] h-screen sm:h-[840px] bg-[#0F1117] flex flex-col relative overflow-hidden sm:rounded-[16px] border border-[#1E2230]">

        <!-- HEADER -->
        <header class="h-[56px] px-4 border-b border-[#1E2230] flex justify-between items-center shrink-0">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-[#2F66F6] flex items-center justify-center font-bold shadow-lg shadow-blue-500/30">K</div>
                <span class="font-extrabold text-lg text-white tracking-tight">KNN MicroPay</span>
            </div>
            <div id="userStatus" class="text-[11px] font-mono text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
                Connected
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="flex-1 p-4 space-y-4 overflow-y-auto">

            <!-- WALLET DASHBOARD (Si toos ah u furan) -->
            <div id="walletDashboard" class="space-y-4">
                
                <!-- PORTFOLIO CARD -->
                <div class="bg-[#1B1E2B] p-5 rounded-2xl border border-[#1E2230] shadow-xl flex justify-between items-baseline relative overflow-hidden">
                    <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-blue-600/10 rounded-full blur-xl pointer-events-none"></div>
                    <div>
                        <div class="text-xs text-gray-400 font-medium mb-1 flex items-center gap-1.5">
                            <i data-lucide="wallet" class="w-3.5 h-3.5 text-blue-500"></i> Internal Micro-Balance
                        </div>
                        <div id="internalBalance" class="text-3xl font-extrabold text-white tracking-tight">0.00 POL</div>
                    </div>
                    <div class="text-xs text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20 font-bold">Polygon</div>
                </div>

                <!-- DEPOSIT ADDRESS CARD -->
                <div class="bg-[#1B1E2B]/60 p-4 rounded-2xl border border-[#1E2230] space-y-2.5">
                    <div class="text-xs text-gray-400 font-medium flex justify-between items-center">
                        <span>Cinwaankaaga Gaarka ah (Deposit Address):</span>
                        <span class="text-[10px] text-blue-400 bg-blue-500/10 px-1.5 py-0.5 rounded">FaucetPay Style</span>
                    </div>
                    <div id="depositAddress" class="font-mono text-blue-400 text-xs bg-[#0F1117] p-3 rounded-xl border border-[#2E344A] select-all break-all">Loading address...</div>
                    <p class="text-[11px] text-gray-500">U soo dir lacag POL ama USDT cinwaankaan si loogu shubo balance-kaaga gudaha.</p>
                </div>

            </div>

        </main>
    </div>

    <script>
        const BACKEND_URL = "https://somapp-website-production-2780.up.railway.app";

        // Auto Load Wallet marka bogga la furo
        window.onload = async function() {
            // Ka hel ama u abuur ID gaar ah browser-ka isticmaalaha
            let guestEmail = localStorage.getItem('guest_user_id');
            if (!guestEmail) {
                guestEmail = "user_" + Math.random().toString(36).substring(2, 10) + "@knn.app";
                localStorage.setItem('guest_user_id', guestEmail);
            }

            try {
                const res = await fetch(`${BACKEND_URL}/api/get-or-create-wallet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: guestEmail })
                });

                const data = await res.json();
                if(data.success) {
                    document.getElementById('depositAddress').innerText = data.depositAddress;
                    document.getElementById('internalBalance').innerText = data.balance + " POL";
                } else {
                    document.getElementById('depositAddress').innerText = "Cilad: " + data.error;
                }
            } catch(err) {
                document.getElementById('depositAddress').innerText = "Server error: " + err.message;
            }
        };

        lucide.createIcons();
    </script>
</body>
</html>
