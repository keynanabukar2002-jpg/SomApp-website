<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SOMEDIA - Shorts Camera</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pt-14 pb-16 min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="fixed top-0 left-0 right-0 h-14 bg-[#0f0f0f] border-b border-zinc-800 z-30 flex items-center justify-between px-4">
    <div class="flex items-center gap-2.5">
      <span class="text-xl font-black uppercase tracking-tight text-white">SOMEDIA</span>
      <img src="https://i.ibb.co/dwDSVhQm/20261022-043354998.png" alt="SOMEDIA Logo" class="w-7 h-7 object-cover rounded border border-white">
    </div>
    <button onclick="openCameraModal()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg font-bold flex items-center gap-1.5">
      <i class="fa-solid fa-camera"></i> Kamarada
    </button>
  </header>

  <!-- MAIN FEED -->
  <main class="p-3 max-w-md mx-auto w-full flex-1">
    <div class="flex items-center justify-between mb-3 px-1">
      <div class="flex items-center gap-2 text-base font-bold">
        <i class="fa-solid fa-bolt text-red-600"></i>
        <span>Shorts Feed</span>
      </div>
      <span id="videoCountBadge" class="text-xs bg-zinc-800 px-2.5 py-0.5 rounded-full text-zinc-400">4 videos</span>
    </div>

    <!-- SHORTS GRID -->
    <div id="shortsGrid" class="grid grid-cols-2 gap-2.5"></div>
  </main>

  <!-- INPUTS HIDDEN (CAMERA DUUBIS DIRECT AH & GALLERY FILE) -->
  <input type="file" id="directCameraInput" accept="video/*" capture="environment" onchange="handleFileSelected(event)" class="hidden">
  <input type="file" id="galleryFileInput" accept="video/*" onchange="handleFileSelected(event)" class="hidden">

  <!-- BOTTOM NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 h-13 bg-[#0f0f0f] border-t border-zinc-800 flex justify-around items-center z-30 max-w-md mx-auto">
    <button class="flex flex-col items-center text-white w-1/5 py-1">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[10px]">Home</span>
    </button>
    <button onclick="openCameraModal()" class="flex flex-col items-center justify-center w-1/5 py-1">
      <div class="w-8 h-8 rounded-lg border-2 border-white flex items-center justify-center bg-red-600 text-white shadow-lg">
        <i class="fa-solid fa-plus"></i>
      </div>
      <span class="text-[10px] text-white font-medium mt-0.5">Soo geli</span>
    </button>
    <button class="flex flex-col items-center text-zinc-400 w-1/5 py-1">
      <i class="fa-solid fa-layer-group text-base"></i>
      <span class="text-[10px]">Subscriptions</span>
    </button>
  </nav>

  <!-- CAMERA MODAL OVERLAY -->
  <div id="cameraModal" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between p-4">
    <!-- TOP CONTROLS -->
    <div class="flex items-center justify-between z-20">
      <button onclick="closeCameraModal()" class="w-10 h-10 rounded-full bg-black/60 text-white flex items-center justify-center text-xl">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="bg-zinc-900/90 text-white px-4 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 border border-zinc-700">
        <i class="fa-solid fa-music"></i>
        <span>Add sound</span>
      </div>

      <button class="w-10 h-10 rounded-full bg-pink-600 text-white flex items-center justify-center">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </button>
    </div>

    <!-- LIVE CAMERA / PREVIEW AREA -->
    <div class="absolute inset-0 z-0 flex items-center justify-center bg-zinc-950">
      <video id="liveVideo" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
      
      <!-- STATUS MESSAGE IF PERMISSION PENDING OR BLOCKED -->
      <div id="cameraStatus" class="flex flex-col items-center justify-center p-6 text-center gap-3">
        <div class="w-16 h-16 rounded-full bg-zinc-900 border border-zinc-700 flex items-center justify-center text-red-500 text-2xl">
          <i class="fa-solid fa-video-slash"></i>
        </div>
        <p id="statusText" class="text-xs text-zinc-300">Bilaabaya kamarada live-ka ah...</p>
        <button onclick="startNativeCameraRecord()" class="mt-2 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2">
          <i class="fa-solid fa-camera"></i> Fur Kamarada Taleefanka
        </button>
      </div>
    </div>

    <!-- RIGHT SIDEBAR -->
    <div class="absolute right-4 top-20 z-20 flex flex-col items-center gap-5 text-white bg-black/40 p-2.5 rounded-2xl backdrop-blur-md border border-white/10">
      <button onclick="switchFacingMode()"><i class="fa-solid fa-rotate text-lg"></i></button>
      <button><i class="fa-regular fa-clock text-lg"></i></button>
      <span class="text-[10px] font-bold">3m</span>
      <button><i class="fa-solid fa-wand-magic text-lg"></i></button>
      <span class="text-[10px] font-bold">1x</span>
    </div>

    <!-- BOTTOM BUTTONS -->
    <div class="z-20 flex flex-col gap-4 mb-2">
      <div class="flex items-center justify-around">
        <!-- ADD FROM GALLERY -->
        <button onclick="triggerGallerySelect()" class="flex flex-col items-center gap-1">
          <div class="w-11 h-11 rounded-xl bg-zinc-800 border-2 border-white overflow-hidden flex items-center justify-center">
            <i class="fa-solid fa-image text-white text-lg"></i>
          </div>
          <span class="text-[11px] font-bold text-white">Gallery</span>
        </button>

        <!-- RECORD BUTTON -->
        <button onclick="startNativeCameraRecord()" class="w-16 h-16 rounded-full border-4 border-white flex items-center justify-center bg-transparent active:scale-95 transition-transform">
          <div class="w-12 h-12 rounded-full bg-red-600"></div>
        </button>

        <!-- DRAFTS -->
        <button onclick="showToast('Drafts waa eber')" class="flex flex-col items-center gap-1">
          <div class="w-11 h-11 rounded-xl bg-zinc-900 border border-zinc-700 flex items-center justify-center text-white text-lg">
            <i class="fa-regular fa-file-lines"></i>
          </div>
          <span class="text-[11px] font-bold text-white">Drafts</span>
        </button>
      </div>
    </div>
  </div>

  <!-- PLAYER MODAL -->
  <div id="playerModal" class="fixed inset-0 z-50 bg-black hidden flex-col justify-between">
    <button onclick="closePlayer()" class="absolute top-4 left-4 z-20 w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <video id="mainVideoPlayer" class="w-full h-full object-contain" loop autoplay controls></video>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastNotification" class="fixed top-16 left-1/2 -translate-x-1/2 bg-zinc-800 text-white px-4 py-1.5 rounded-full text-xs z-50 opacity-0 pointer-events-none transition-opacity duration-300 shadow-xl">
    <span id="toastMessage">Message</span>
  </div>

  <script>
    const DEFAULT_VIDEOS = [
      { id: 'v1', title: 'Sirta Miraha Cad iyo Waxtarkooda...', views: '1.2M views', category: 'Somali Tech', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', thumbnail: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80' },
      { id: 'v2', title: 'Gatos inteligentes y Graciosos', views: '850K views', category: 'Ciyaaro', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', thumbnail: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80' }
    ];

    let videoList = [...DEFAULT_VIDEOS];
    let mediaStream = null;
    let currentFacingMode = 'user';

    window.addEventListener('DOMContentLoaded', () => { renderGrid(); });

    function renderGrid() {
      const grid = document.getElementById('shortsGrid');
      grid.innerHTML = '';
      videoList.forEach((vid, idx) => {
        const card = document.createElement('div');
        card.className = "relative aspect-[9/16] rounded-xl overflow-hidden bg-zinc-900 border border-zinc-800 cursor-pointer shadow-md";
        card.onclick = () => openPlayer(idx);
        card.innerHTML = `
          <span class="absolute top-2 left-2 z-10 bg-black/60 text-white text-[10px] font-semibold px-2 py-0.5 rounded-md">${vid.category}</span>
          <img src="${vid.thumbnail}" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent p-2.5 flex flex-col justify-end">
            <h3 class="text-xs font-semibold text-white line-clamp-2 leading-snug mb-1">${vid.title}</h3>
            <span class="text-[10px] text-zinc-300">${vid.views}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // CAMERA FUNCTIONS
    async function openCameraModal() {
      const modal = document.getElementById('cameraModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      startLiveStream();
    }

    async function startLiveStream() {
      const liveVideo = document.getElementById('liveVideo');
      const statusBox = document.getElementById('cameraStatus');
      const statusText = document.getElementById('statusText');

      try {
        if (mediaStream) {
          mediaStream.getTracks().forEach(t => t.stop());
        }

        // CODSIGA LIVE CAMERA PERMISSION
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });

        liveVideo.srcObject = mediaStream;
        liveVideo.classList.remove('hidden');
        statusBox.classList.add('hidden');
      } catch (err) {
        console.warn("Live Camera feed blocked or unsupported locally:", err);
        liveVideo.classList.add('hidden');
        statusBox.classList.remove('hidden');
        statusText.innerHTML = "Browser-ku ma ogolaan kamarada tooska ah.<br>Fadlan taabo badhanka hoose si aad kamarada taleefanka si toos ah ugu duubto.";
      }
    }

    function switchFacingMode() {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      startLiveStream();
    }

    function closeCameraModal() {
      const modal = document.getElementById('cameraModal');
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // DIRECT NATIVE CAMERA RECORDING FALLBACK
    function startNativeCameraRecord() {
      document.getElementById('directCameraInput').click();
    }

    function triggerGallerySelect() {
      document.getElementById('galleryFileInput').click();
    }

    function handleFileSelected(e) {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      const newVideo = {
        id: 'user_' + Date.now(),
        title: file.name || 'Muuqaal Cusub',
        views: '1 view • Right now',
        category: 'Soo gelintaada',
        url: url,
        thumbnail: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=500&q=80'
      };

      videoList.unshift(newVideo);
      renderGrid();
      closeCameraModal();
      showToast('Muuqaalka waa la soo geliyay! 🚀');
      openPlayer(0);
    }

    function openPlayer(idx) {
      const modal = document.getElementById('playerModal');
      const player = document.getElementById('mainVideoPlayer');
      player.src = videoList[idx].url;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      player.play();
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const player = document.getElementById('mainVideoPlayer');
      player.pause();
      modal.classList.add('hidden');
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastMessage').innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none'); }, 2000);
    }
  </script>
</body>
</html>
