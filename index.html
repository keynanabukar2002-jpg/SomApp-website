
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأرقام العربية 1 - 286</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #fff;
    font-family: "Traditional Arabic", "Amiri", serif;
}

h2 {
    text-align: center;
    color: #4D0707;
    margin-bottom: 25px;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
    gap: 15px;
    max-width: 1100px;
    margin: auto;
}

.number-box {
    position: relative;
    width: 95px;
    height: 95px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
}

.octagon {
    position: absolute;
    inset: 3px;
    background: #120403;
    clip-path: polygon(
        30% 0%, 70% 0%,
        100% 30%, 100% 70%,
        70% 100%, 30% 100%,
        0% 70%, 0% 30%
    );
}

.octagon::before {
    content: "";
    position: absolute;
    inset: 4px;
    background: #D5AE65;
    clip-path: polygon(
        30% 0%, 70% 0%,
        100% 30%, 100% 70%,
        70% 100%, 30% 100%,
        0% 70%, 0% 30%
    );
}

.octagon::after {
    content: "";
    position: absolute;
    inset: 7px;
    background: #4D0707;
    clip-path: polygon(
        30% 0%, 70% 0%,
        100% 30%, 100% 70%,
        70% 100%, 30% 100%,
        0% 70%, 0% 30%
    );
}

.inner {
    position: absolute;
    inset: 13px;
    background: #F8E8C5;
    clip-path: polygon(
        30% 0%, 70% 0%,
        100% 30%, 100% 70%,
        70% 100%, 30% 100%,
        0% 70%, 0% 30%
    );
    border: none;
    z-index: 2;
}

.number {
    position: relative;
    z-index: 3;
    color: #4D0707;
    font-size: 29px;
    font-weight: bold;
    direction: rtl;
}

.number-box::before,
.number-box::after {
    content: "✦";
    position: absolute;
    z-index: 4;
    color: #D5AE65;
    font-size: 12px;
}

.number-box::before {
    top: 7px;
    left: 40px;
}

.number-box::after {
    bottom: 7px;
    left: 40px;
}

@media(max-width: 400px) {
    .container {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .number-box {
        width: 85px;
        height: 85px;
    }

    .number {
        font-size: 26px;
    }
}

@media print {
    body {
        padding: 5px;
    }

    .container {
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
    }

    .number-box {
        break-inside: avoid;
    }
}
</style>
</head>

<body>

<h2>الأرقام العربية</h2>

<div class="container" id="numbers"></div>

<script>
const container = document.getElementById("numbers");

for (let i = 1; i <= 286; i++) {

    const arabicNumber = new Intl.NumberFormat(
        "ar-u-nu-arab",
        { useGrouping: false }
    ).format(i);

    const box = document.createElement("div");
    box.className = "number-box";

    box.innerHTML = `
        <div class="octagon"></div>
        <div class="inner"></div>
        <div class="number">${arabicNumber}</div>
    `;

    container.appendChild(box);
}
</script>

</body>
</html>
