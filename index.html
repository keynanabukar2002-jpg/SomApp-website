
<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English 10,000 Words</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;
 background:#F4ECE1;
 color:#493A2D;
 font-family:Arial,sans-serif
}
.container{max-width:650px;margin:auto}
header{text-align:center;padding:20px 5px}
header h1{font-size:24px;margin:0}
header p{color:#806448}
.card{
 background:white;padding:16px;
 border-radius:14px;margin-bottom:15px
}
.sections{
 display:grid;grid-template-columns:repeat(5,1fr);gap:8px
}
button{
 border:0;border-radius:8px;padding:12px;
 cursor:pointer;font-weight:bold
}
.sections button{background:#F4ECE1;color:#493A2D}
.sections button.active{background:#806448;color:white}
input{
 width:100%;padding:13px;
 border:1px solid #D7C5B1;border-radius:9px;
 margin-bottom:15px;font-size:15px
}
.info{display:flex;justify-content:space-between;
 color:#806448;font-size:14px;margin-bottom:12px}
.word{padding:13px 0;border-bottom:1px solid #EEE5DA}
.wordtop{display:flex;justify-content:space-between;gap:8px}
.english{font-weight:bold}
.somali{color:#806448;text-align:right}
.small{font-size:13px;color:#988675;margin-top:5px}
.example{font-size:13px;margin-top:6px;color:#65513E}
.navigation{display:flex;justify-content:space-between;margin-top:18px}
.navigation button{background:#806448;color:white}
.navigation button:disabled{opacity:.35}
</style>
</head>
<body>
<div class="container">

<header>
<h1>ENGLISH 10,000 WORDS</h1>
<p>Learn English • Somali Translation</p>
</header>

<div class="card">
<h3>Choose Section</h3>
<div class="sections" id="sections"></div>
</div>

<div class="card">
<input id="search" placeholder="Search English or Somali..."
oninput="searchWords()">

<div class="info">
<span id="sectionTitle">Section 1</span>
<span id="pageInfo">Page 1 / 20</span>
</div>

<div id="wordList"></div>

<div class="navigation">
<button id="prev" onclick="move(-1)">← Previous</button>
<button id="next" onclick="move(1)">Next →</button>
</div>
</div>
</div>

<script>
// 10 eray oo tusaale ah.
// Ku dar erayada kale array-gan si aad u buuxiso 10,000.

const words = [
["Business","Ganacsi","Biznis","Business is important.","Ganacsigu waa muhiim."],
["Management","Maamul","Manijmant","Good management helps a company.","Maamul wanaagsan wuxuu caawiyaa shirkad."],
["Profit","Faa'iido","Profit","The company makes a profit.","Shirkaddu faa'iido ayay samaysaa."],
["Loss","Khasaare","Loos","The business made a loss.","Ganacsigu khasaare ayuu galay."],
["Revenue","Dakhli","Revinyuu","Revenue increased this year.","Dakhliga ayaa kordhay sanadkan."],
["Market","Suuq","Maarkit","The market is growing.","Suuqu wuu korayaa."],
["Customer","Macmiil","Kastamar","The customer bought a product.","Macmiilku badeeco ayuu iibsaday."],
["Product","Badeeco","Prodakt","This product is useful.","Badeecadani waa faa'iido."],
["Company","Shirkad","Kampani","The company employs workers.","Shirkaddu shaqaale ayay qortaa."],
["Investment","Maalgelin","Investmant","Investment supports business growth.","Maalgelintu waxay taageertaa kobaca ganacsiga."]
];

let section=1;
let page=1;
let filtered=null;

const sectionBox=document.getElementById("sections");

for(let i=1;i<=50;i++){
 const b=document.createElement("button");
 b.textContent=i;
 b.onclick=()=>{
  section=i;page=1;filtered=null;
  document.getElementById("search").value="";
  render();
 };
 b.id="s"+i;
 sectionBox.appendChild(b);
}

function move(n){
 if(filtered!==null)return;
 page=Math.max(1,Math.min(20,page+n));
 render();
}

function render(){
 document.querySelectorAll(".sections button")
 .forEach(b=>b.classList.remove("active"));
 document.getElementById("s"+section).classList.add("active");

 document.getElementById("sectionTitle").textContent=
 "Section "+section;
 document.getElementById("pageInfo").textContent=
 "Page "+page+" / 20";

 let data=filtered!==null?filtered:
 words.slice((page-1)*10,page*10);

 let html="";
 if(data.length===0){
  html="<p>No words found.</p>";
 }

 data.forEach((w,i)=>{
 html+=`
 <div class="word">
  <div class="wordtop">
   <span class="english">${i+1}. ${w[0]}</span>
   <span class="somali">${w[1]}</span>
  </div>
  <div class="small">Pronunciation: ${w[2]}</div>
  <div class="example">${w[3]}<br>${w[4]}</div>
 </div>`;
 });

 document.getElementById("wordList").innerHTML=html;
 document.getElementById("prev").disabled=page===1||filtered!==null;
 document.getElementById("next").disabled=page===20||filtered!==null;
}

function searchWords(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 if(!q){filtered=null;render();return;}
 filtered=words.filter(w=>w.some(x=>x.toLowerCase().includes(q)));
 render();
 document.getElementById("pageInfo").textContent=
 filtered.length+" results";
}

render();
</script>
</body>
</html>
