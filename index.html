<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomWallet - Multi-Chain (USDT & Litecoin)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js (USDT/BSC) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <!-- BIP39 & BitcoinJS Standalone Libraries (Fixed CDNs) -->
    <script src="https://unpkg.com/bip39@3.1.0/dist/index.js"></script>
    <script src="https://unpkg.com/bitcoinjs-lib@6.1.0/src/index.js"></script>
    <script src="https://unpkg.com/tiny-secp256k1@2.2.3/lib/index.js"></script>
    <script src="https://unpkg.com/bip32@4.0.0/dist/index.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center font-bold text-slate-900 text-xl">
                    SW
                </div>
                <div>
                    <h1 class="font-bold text-lg">SomWallet App</h1>
                    <p class="text-xs text-blue-400 font-medium">Mainnet Real Portal</p>
                </div>
            </div>
            <!-- Network Selector -->
            <select id="networkSelect" onchange="switchNetwork()" class="bg-slate-900 border border-slate-700 text-xs px-2.5 py-1.5 rounded-lg text-yellow-400 font-semibold focus:outline-none">
                <option value="bsc">USDT (BEP20)</option>
                <option value="ltc" selected>Litecoin (LTC)</option>
            </select>
        </div>

        <!-- 12-Words Secret Phrase -->
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">12-KA ERAY EE SIRTA AH (SECRET PHRASE)</label>
            <textarea id="secretPhrase" rows="2" placeholder="Geli 12-ka eray halkan..." 
                class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 transition">dress mandate claw tone now edge example ugly same cycle vanish</textarea>
        </div>

        <!-- BSC Section (USDT) -->
        <div id="bscSection" class="space-y-4 hidden">
            <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 text-xs text-slate-400">
                Network: <span class="text-emerald-400 font-bold">BNB Smart Chain Mainnet</span>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">CINWAANKA QAATAHA (RECIPIENT)</label>
                <input type="text" id="bscRecipient" placeholder="0x..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition font-mono">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">CADADKA (USDT)</label>
                <input type="number" id="bscAmount" placeholder="10" step="any"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 transition font-semibold">
            </div>
            <button onclick="sendUSDT()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg">
                Dir USDT (BEP20) 🚀
            </button>
        </div>

        <!-- LTC Section (Litecoin) -->
        <div id="ltcSection" class="space-y-4">
            <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 text-xs text-slate-400">
                Network: <span class="text-blue-400 font-bold">Litecoin Mainnet (LTC)</span><br>
                Xadka ugu yar: <span class="text-yellow-400 font-bold">0.00001 LTC</span>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">CINWAANKA LTC LOO DIRAYO (RECIPIENT)</label>
                <input type="text" id="ltcRecipient" value="ltc1qcwltfsw8y790zhgr9uaenp5as6xla3c6vpysaw" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition font-mono">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">CADADKA (LTC) - Min: 0.00001</label>
                <input type="number" id="ltcAmount" value="0.00001" step="0.00001" min="0.00001"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition font-semibold">
            </div>
            <button onclick="sendLTC()" class="w-full bg-blue-500 hover:bg-blue-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg">
                Dir Litecoin (LTC) 🚀
            </button>
        </div>

        <!-- Status Box -->
        <div id="statusBox" class="hidden rounded-xl p-4 text-xs font-mono break-all border"></div>

        <!-- Footer Info -->
        <div class="text-center border-t border-slate-700/50 pt-4">
            <p class="text-[11px] text-slate-500">
                SomWallet App v3.1 - Mainnet Real Transactions
            </p>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        window.onload = function() {
            document.getElementById('networkSelect').value = 'ltc';
            switchNetwork();
        };

        function switchNetwork() {
            const net = document.getElementById('networkSelect').value;
            const bscSec = document.getElementById('bscSection');
            const ltcSec = document.getElementById('ltcSection');
            
            if(net === 'bsc') {
                bscSec.classList.remove('hidden');
                ltcSec.classList.add('hidden');
            } else {
                bscSec.classList.add('hidden');
                ltcSec.classList.remove('hidden');
            }
        }

        function showStatus(message, type) {
            const statusBox = document.getElementById('statusBox');
            statusBox.classList.remove('hidden');
            if (type === "error") {
                statusBox.className = "rounded-xl p-4 text-xs font-mono break-all border bg-red-950/40 border-red-500/50 text-red-400";
            } else if (type === "success") {
                statusBox.className = "rounded-xl p-4 text-xs font-mono break-all border bg-emerald-950/40 border-emerald-500/50 text-emerald-400";
            } else {
                statusBox.className = "rounded-xl p-4 text-xs font-mono break-all border bg-yellow-950/40 border-yellow-500/50 text-yellow-400";
            }
            statusBox.innerHTML = message;
        }

        // BSC USDT Transfer
        async function sendUSDT() {
            const phrase = document.getElementById('secretPhrase').value.trim();
            const recipient = document.getElementById('bscRecipient').value.trim();
            const amount = document.getElementById('bscAmount').value.trim();

            if (!phrase || !recipient || !amount) {
                showStatus("❌ Fadlan buuxi dhammaan meelaha bannaanka ah!", "error");
                return;
            }

            try {
                showStatus("⏳ Waxaa la xiriirayaa BSC Mainnet...", "warning");
                const provider = new ethers.providers.JsonRpcProvider("https://bsc-dataseed.binance.org/");
                const walletNode = ethers.Wallet.fromMnemonic(phrase);
                const wallet = walletNode.connect(provider);

                const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
                const abi = ["function transfer(to address, value uint256) returns (bool)"];
                const contract = new ethers.Contract(USDT_CONTRACT, abi, wallet);

                const parsedAmount = ethers.utils.parseUnits(amount, 6);
                const tx = await contract.transfer(recipient, parsedAmount);
                
                showStatus(`⏳ Tx la diray, waxaa la sugayaa xaqiijinta: <a href="https://bscscan.com/tx/${tx.hash}" target="_blank" class="underline">${tx.hash}</a>`, "warning");
                await tx.wait();
                showStatus(`✅ Si guul leh ayaa loo diray ${amount} USDT!`, "success");
            } catch (err) {
                showStatus(`❌ Khalad: ${err.message}`, "error");
            }
        }

        // Litecoin Transfer
        async function sendLTC() {
            const phrase = document.getElementById('secretPhrase').value.trim();
            const recipient = document.getElementById('ltcRecipient').value.trim();
            const amount = parseFloat(document.getElementById('ltcAmount').value);

            if (!phrase || !recipient || isNaN(amount)) {
                showStatus("❌ Fadlan buuxi xogta LTC-ga!", "error");
                return;
            }

            if (amount < 0.00001) {
                showStatus("❌ Qaddarka ugu yar ee la diri karo waa 0.00001 LTC!", "error");
                return;
            }

            try {
                showStatus("⏳ Litecoin transaction waa la diyaarinayaa...", "warning");

                // Hubinta bip39
                if (typeof window.bip39 === 'undefined') {
                    throw new Error("Maktabadda bip39 weli lama soo dejin browser-ka!");
                }

                if (!window.bip39.validateMnemonic(phrase)) {
                    showStatus("❌ 12-ka eray ee sirta ah (Seed Phrase) ma saxna!", "error");
                    return;
                }

                showStatus(`✅ 12-ka eray waa la aqoonsaday. Waxaa la diyaarinayaa dirista ${amount} LTC...`, "success");

            } catch (err) {
                console.error(err);
                showStatus(`❌ Khalad LTC: ${err.message}`, "error");
            }
        }
    </script>
</body>
</html>
