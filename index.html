<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Deposit - App-kaaga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0F1117] text-white font-sans flex justify-center items-center min-h-screen p-4">

    <!-- Deposit Card Container -->
    <div class="w-full max-w-[400px] bg-[#1B1E2B] rounded-3xl p-6 border border-[#2A2E3F] shadow-2xl space-y-5">
        
        <!-- Header -->
        <div class="flex justify-between items-center">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
                <i data-lucide="wallet" class="w-5 h-5 text-[#2F66F6]"></i> Ku Shubashada Crypto
            </h3>
            <span class="text-xs bg-[#2F66F6]/20 text-[#2F66F6] px-2.5 py-1 rounded-full font-semibold">Polygon Network</span>
        </div>

        <!-- Wallet Connect Status -->
        <div id="walletStatusSection" class="bg-[#0F1117] p-3.5 rounded-2xl border border-[#2A2E3F] flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-[#1E2230] flex items-center justify-center text-primaryBlue">
                    <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>
                </div>
                <div>
                    <div class="text-xs text-[#9CA3AF]">Xaaladda Wallet-ka</div>
                    <div id="walletAddressText" class="text-xs font-bold text-white">Lama xiriirin</div>
                </div>
            </div>
            <button onclick="connectWallet()" id="connectWalletBtn" class="px-3.5 py-2 bg-[#2F66F6] hover:bg-blue-600 text-white rounded-xl text-xs font-bold transition">
                Xiriiri Wallet
            </button>
        </div>

        <!-- Amount Input -->
        <div class="space-y-2">
            <label class="text-xs font-semibold text-[#9CA3AF]">Gali Lacagta (USDC)</label>
            <div class="relative">
                <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#9CA3AF] font-bold">$</span>
                <input id="depositAmount" type="number" value="1.00" class="w-full h-12 bg-[#0F1117] border border-[#2A2E3F] rounded-xl pl-8 pr-4 text-sm font-bold text-white focus:outline-none focus:border-[#2F66F6]">
            </div>
        </div>

        <!-- Quick Amount Selectors -->
        <div class="grid grid-cols-3 gap-2 text-xs font-bold">
            <button onclick="setAmount(1)" class="py-2.5 rounded-xl bg-[#1E2230] border border-[#2A2E3F] text-white hover:border-[#2F66F6] transition">$1</button>
            <button onclick="setAmount(10)" class="py-2.5 rounded-xl bg-[#1E2230] border border-[#2A2E3F] text-white hover:border-[#2F66F6] transition">$10</button>
            <button onclick="setAmount(50)" class="py-2.5 rounded-xl bg-[#1E2230] border border-[#2A2E3F] text-white hover:border-[#2F66F6] transition">$50</button>
        </div>

        <!-- Action Button -->
        <button onclick="executeCryptoDeposit()" class="w-full h-12 rounded-xl bg-[#2F66F6] hover:bg-blue-600 text-white font-bold text-sm shadow-lg transition flex items-center justify-center gap-2">
            <i data-lucide="arrow-down-left" class="w-4 h-4"></i> Ku Shub Hadda
        </button>

    </div>

    <!-- JavaScript for Web3 Wallet Connection & Deposit Logic -->
    <script>
        lucide.createIcons();

        let userAccount = null;

        // Function to set quick amounts
        function setAmount(val) {
            document.getElementById('depositAmount').value = val.toFixed(2);
        }

        // Function to Connect Crypto Wallet (MetaMask / TrustWallet)
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAccount = accounts[0];
                    const shortAddr = userAccount.substring(0, 6) + '...' + userAccount.substring(userAccount.length - 4);
                    
                    document.getElementById('walletAddressText').innerText = shortAddr;
                    document.getElementById('connectWalletBtn').innerText = 'Waa Xiran yahay';
                    document.getElementById('connectWalletBtn').classList.replace('bg-[#2F66F6]', 'bg-emerald-600');
                } catch (error) {
                    alert('Wuu guuldarraystay xiriirinta wallet-ka.');
                }
            } else {
                alert('Fadlan ku rakib MetaMask ama isticmaal browser taageera Web3!');
            }
        }

        // Function to Execute Crypto Transaction / Deposit
        async function executeCryptoDeposit() {
            if (!userAccount) {
                alert('Fadlan marka hore xiriiri wallet-kaaga crypto!');
                return;
            }

            const amount = document.getElementById('depositAmount').value;
            alert(`Waa la bilaabayaa dirista $${amount} USDC ee Polygon Network...`);
            
            // Halkan waxaad ku dari kartaa Ethers.js ama Web3.js code si aad Smart Contract-ka u abuurto transfer call ah.
        }
    </script>
</body>
</html>
