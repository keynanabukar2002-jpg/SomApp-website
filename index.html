<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adeega Macaash</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#FEFBEA] min-h-screen flex flex-col justify-between font-sans text-gray-800">

    <!-- Top Header -->
    <div class="p-4 flex justify-between items-center">
        <div>
            <p class="text-xs text-gray-500">Good Morning</p>
            <h1 class="text-base font-bold text-gray-900">abukar</h1>
        </div>
        <div class="text-lg">
            <i class="fa-brands fa-tiktok"></i>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="px-4 flex-1">
        <!-- Green Card -->
        <div class="bg-emerald-700 text-white p-5 rounded-2xl shadow-md mb-5 relative overflow-hidden">
            <h2 class="text-2xl font-bold tracking-wide">Adeega Macaash</h2>
            <p class="text-xs mt-1 opacity-90">Macmiil iibso oo dhibco aruurso</p>
        </div>

        <!-- Services Grid -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <!-- Hormuud -->
            <div class="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center text-center h-24">
                <div class="text-emerald-600 font-bold text-2xl mb-1">H</div>
                <span class="text-xs font-bold text-gray-900">Hormuud</span>
            </div>
            <!-- Somnet -->
            <div class="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center text-center h-24">
                <div class="text-blue-600 font-bold text-sm">SOMNET</div>
                <span class="text-xs font-bold text-gray-900 mt-1">Somnet</span>
            </div>
            <!-- Somtel Yellow -->
            <div class="bg-yellow-300 p-3 rounded-xl shadow-sm flex flex-col items-center justify-center text-center h-24">
                <div class="text-black font-bold text-sm">somtel</div>
                <span class="text-xs font-bold text-gray-900 mt-1">Somtel</span>
            </div>
            <!-- SomLink -->
            <div class="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center text-center h-24">
                <div class="text-purple-700 font-bold text-xs">SomLink</div>
                <span class="text-xs font-bold text-gray-900 mt-1">SomLink</span>
            </div>
            <!-- Amtel Red -->
            <div class="bg-red-700 text-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center text-center h-24">
                <div class="font-bold text-sm">Amtel</div>
                <span class="text-[10px] opacity-90">Friendly calling partner</span>
            </div>
            <!-- Rukumo -->
            <div class="bg-red-50 p-3 rounded-xl shadow-sm flex flex-col items-center justify-center text-center h-24 border border-red-100">
                <div class="text-red-500 text-lg mb-1"><i class="fa-solid fa-ban"></i></div>
                <span class="text-xs font-bold text-gray-900">Rukumo</span>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bg-white border-t border-gray-200 py-3 px-6 flex justify-between items-center text-xs text-gray-500">
        <div class="flex flex-col items-center text-indigo-950 font-semibold">
            <i class="fa-solid fa-house text-lg mb-1"></i>
            <span>Home</span>
        </div>
        <div class="flex flex-col items-center hover:text-indigo-950">
            <i class="fa-solid fa-gift text-lg mb-1"></i>
            <span>Macaash</span>
        </div>
        <div class="flex flex-col items-center hover:text-indigo-950">
            <i class="fa-solid fa-clock-rotate-left text-lg mb-1"></i>
            <span>Orders</span>
        </div>
        <div class="flex flex-col items-center hover:text-indigo-950">
            <i class="fa-solid fa-user text-lg mb-1"></i>
            <span>My Profile</span>
        </div>
    </div>

</body>
</html>
