<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomWallet - Native Litecoin (LTC) Transfer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- BitcoinJS & ECPair for Litecoin Transactions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bitcoinjs-lib/6.1.0/bitcoinjs-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ecpair/2.1.0/ecpair.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tiny-secp256k1/2.2.3/secp256k1.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl w-full max-w-md p-6">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-amber-400">SomWallet App</h1>
            <p class="text-sm text-slate-400">Native Litecoin (LTC Mainnet Transfer)</p>
        </div>

        <div class="space-y-4">
            <!-- Private Key (WIF Format ama Hex) -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Litecoin Private Key (WIF)</label>
                <input type="password" id="privateKey" placeholder="Geli LTC Private Key (WIF)..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <!-- Recipient Address -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Cinwaanka Qaataha (LTC Address)</label>
                <input type="text" id="recipient" placeholder="LTC Address (ltc1... ama L...)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <!-- Amount -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Cadadka LTC (Amount)</label>
                <input type="number" step="0.00001" id="amount" placeholder="0.1" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <!-- Submit Button -->
            <button onclick="sendNativeLTC()" id="sendBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-lg transition duration-200 text-sm shadow-lg">
                Dir Litecoin (LTC) 🚀
            </button>
        </div>

        <!-- Status / Logs Box -->
        <div class="mt-6">
            <h2 class="text-xs font-semibold text-slate-400 mb-1">Xaaladda (Status Logs):</h2>
            <div id="logBox" class="bg-slate-950 border border-slate-800 rounded-lg p-3 h-36 overflow-y-auto text-xs font-mono text-amber-300 space-y-1">
                <span class="text-slate-500">Sugaya hawlgalka Litecoin...</span>
            </div>
        </div>
    </div>

    <script>
        // Shabakadda Litecoin (Network parameters)
        const LITECOIN_NETWORK = {
            messagePrefix: '\x19Litecoin Signed Message:\n',
            bech32: 'ltc',
            bip32: {
                public: 0x019da462,
                private: 0x019d9cfe,
            },
            pubKeyHash: 0x30, // 48 (Starts with L)
            scriptHash: 0x32, // 50 (Starts with M)
            wif: 0xb0,        // 176
        };

        function log(message, type = "normal") {
            const logBox = document.getElementById("logBox");
            let color = "text-amber-300";
            if (type === "error") color = "text-red-400";
            if (type === "success") color = "text-cyan-400";
            if (type === "info") color = "text-amber-200";

            logBox.innerHTML += `<div class="${color}">> ${message}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function sendNativeLTC() {
            const privKeyWIF = document.getElementById("privateKey").value.trim();
            const recipient = document.getElementById("recipient").value.trim();
            const amountLTC = parseFloat(document.getElementById("amount").value.trim());
            const logBox = document.getElementById("logBox");

            logBox.innerHTML = "";

            if (!privKeyWIF || !recipient || isNaN(amountLTC)) {
                log("Fadlan buuxi dhammaan meelaha banaan si sax ah!", "error");
                return;
            }

            try {
                log("Waxaa la dhisayaa xiriirka Native Litecoin...", "info");
                
                // Halkan waxaa lagu diyaarin karaa abuurista Key-ga iyo soo akhrinta UTXO-yada (Unspent Transaction Outputs) 
                // oo laga soo qaadayo shabakadda Litecoin Public API (tusaale blockcypher ama sochain).
                
                log("Waxaa la hubinayaa haraaga iyo UTXO-yada...", "info");
                
                // Tusaale ahaan hannaanka API-ga ee bixiya xogta Litecoin:
                // Cilmiga UTXO iyo Broadcast-ka transactions-ka ee Native Crypto wuxuu u baahan yahay API key ama Endpoint shaqeeya.
                log("Fiiro gaar ah: Native LTC waxay u baahan tahay UTXO management iyo Broadcast API (sida Blockcypher).", "info");

            } catch (error) {
                log(`Khalad: ${error.message || error}`, "error");
            }
        }
    </script>
</body>
</html>
