<!DOCTYPE html>
<html lang="so" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bayan Mobile App - SOMEDIA AI</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta id="themeColorMeta" name="theme-color" content="#FEFBEA">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar, ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black md:bg-slate-900 text-slate-800 h-full w-full flex justify-center items-center p-0 md:p-4 overflow-hidden">

    <div id="appContainerFrame" class="w-full h-full md:max-w-[410px] md:h-[844px] bg-[#FEFBEA] md:rounded-[44px] md:shadow-2xl overflow-hidden flex flex-col relative border-0 md:border-[8px] md:border-slate-900 transition-colors duration-200">

        <!-- DASHBOARD CONTAINER -->
        <div id="mainDashboard" class="w-full h-full flex flex-col justify-between bg-transparent relative">
            
            <div id="mainDashboardHeader" class="p-4 pt-6 bg-white/60 backdrop-blur-md border-b border-amber-200/40 flex justify-between items-center shrink-0 z-10">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-700 text-white font-bold flex items-center justify-center text-sm">B</div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Welcome</p>
                        <h2 class="text-sm font-extrabold text-slate-900">Bayan User</h2>
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-5 relative">
                <div id="tabHome" class="tab-content space-y-5">
                    <div class="p-6 bg-white rounded-3xl shadow-sm text-center">
                        <h3 class="text-lg font-bold text-slate-800 mb-2">Bayan & SOMEDIA AI</h3>
                        <p class="text-xs text-slate-500 mb-4">Aad kaga faa'iideysan kartid AI Video Camera iyo Adeegyada Shabakadaha.</p>
                        <button onclick="switchTab('tabSomedia')" class="bg-red-600 text-white px-5 py-2.5 rounded-full font-bold text-xs shadow-lg active:scale-95 transition">
                            Fura SOMEDIA AI
                        </button>
                    </div>
                </div>
            </div>

            <!-- SOMEDIA OVERLAY -->
            <div id="tabSomedia" class="hidden absolute inset-0 bg-[#0f0f0f] text-white flex flex-col justify-between z-40 overflow-y-auto no-scrollbar">
                
                <div>
                    <div class="sticky top-0 bg-[#0f0f0f] border-b border-zinc-800 z-20 flex items-center justify-between p-3.5">
                        <div class="flex items-center gap-2">
                            <button onclick="switchTab('tabHome')" class="text-white text-base">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <span class="text-lg font-black uppercase tracking-tight">SOMEDIA AI</span>
                        </div>
                        <button onclick="openSomediaCameraModal()" class="text-xs bg-red-600 text-white px-3 py-1.5 rounded-lg font-bold flex items-center gap-1">
                            <i class="fa-solid fa-camera"></i> AI Camera
                        </button>
                    </div>

                    <main class="w-full p-3 pb-24">
                        <div id="shortsGrid" class="flex flex-col gap-4"></div>
                    </main>
                </div>

                <div class="sticky bottom-0 left-0 right-0 bg-[#0f0f0f] border-t border-zinc-800 flex justify-around items-center py-2 px-1 z-30">
                    <button onclick="switchTab('tabHome')" class="flex flex-col items-center text-zinc-400">
                        <i class="fa-solid fa-house text-sm"></i>
                        <span class="text-[9px]">Home</span>
                    </button>
                    <button onclick="openSomediaCameraModal()" class="flex flex-col items-center text-red-500">
                        <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                        <span class="text-[9px] font-bold">AI Camera</span>
                    </button>
                </div>
            </div>

            <div id="bayanMainFooter" class="bg-white border-t border-slate-200 px-2 py-2 flex justify-around items-center text-[10px] font-bold text-slate-400 shrink-0 z-10">
                <button onclick="switchTab('tabHome')" class="nav-btn flex flex-col items-center text-indigo-950">
                    <i class="fa-solid fa-house text-base"></i>
                    <span>Home</span>
                </button>
                <button onclick="switchTab('tabSomedia')" class="nav-btn flex flex-col items-center text-slate-400">
                    <i class="fa-solid fa-video text-base"></i>
                    <span>SOMEDIA</span>
                </button>
            </div>
        </div>

        <!-- 1. SOMEDIA AI CAMERA MODAL -->
        <div id="somediaCameraModal" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between p-4">
            <div class="flex items-center justify-between z-20">
                <button onclick="closeSomediaCameraModal()" class="w-10 h-10 rounded-full bg-black/40 text-white flex items-center justify-center text-xl backdrop-blur-md">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <div id="aiStatusBadge" class="bg-emerald-600/80 text-white px-3 py-1 rounded-full text-[10px] font-extrabold flex items-center gap-1.5 backdrop-blur-md border border-emerald-400/30">
                    <i class="fa-solid fa-robot"></i>
                    <span>AI LIVE ACTIVE</span>
                </div>

                <button onclick="toggleSomediaTorch()" class="w-10 h-10 rounded-full bg-black/40 text-white flex items-center justify-center text-lg backdrop-blur-md">
                    <i id="somediaFlashIcon" class="fa-solid fa-bolt"></i>
                </button>
            </div>

            <!-- LIVE CAMERA & CANVAS STREAM WITH REAL-TIME AI EFFECT -->
            <div class="absolute inset-0 z-0 flex items-center justify-center bg-zinc-950 overflow-hidden">
                <video id="liveSomediaCameraStream" autoplay playsinline muted class="hidden"></video>
                <canvas id="aiCanvasOverlay" class="w-full h-full object-cover"></canvas>
            </div>

            <!-- AI CONTROLS TOOLBAR -->
            <div class="absolute right-4 top-20 z-20 flex flex-col items-center gap-4 text-white bg-black/40 p-2.5 rounded-2xl backdrop-blur-md border border-white/10">
                <button onclick="toggleAIFilter()" class="flex flex-col items-center text-amber-400 active:scale-90 transition">
                    <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
                    <span class="text-[9px] font-bold mt-0.5">AI Filter</span>
                </button>
                <button onclick="toggleAIAutoBeauty()" class="flex flex-col items-center text-pink-400 active:scale-90 transition">
                    <i class="fa-solid fa-face-smile text-xl"></i>
                    <span class="text-[9px] font-bold mt-0.5">Beauty</span>
                </button>
                <button onclick="switchSomediaCameraFacing()" class="flex flex-col items-center active:scale-90 transition">
                    <i class="fa-solid fa-rotate text-xl"></i>
                    <span class="text-[9px] font-bold mt-0.5">Flip</span>
                </button>
            </div>

            <!-- BOTTOM RECORDING CONTROLS -->
            <div class="z-20 flex flex-col gap-5 mb-2">
                <div class="flex items-center justify-around">
                    <div class="w-11"></div>

                    <button id="somediaRecordBtn" onclick="toggleSomediaRecording()" class="w-16 h-16 rounded-full border-4 border-white flex items-center justify-center bg-transparent active:scale-95 transition-transform">
                        <div id="somediaRecordInnerCircle" class="w-12 h-12 rounded-full bg-red-600 transition-all duration-200"></div>
                    </button>

                    <div class="w-11"></div>
                </div>
            </div>
        </div>

        <div id="toastNotification" class="fixed top-16 left-1/2 -translate-x-1/2 bg-zinc-800 text-white px-4 py-1.5 rounded-full text-xs z-50 opacity-0 pointer-events-none transition-opacity duration-300 shadow-xl">
            <span id="toastMessage">Done</span>
        </div>

    </div>

    <script>
        let mediaStream = null;
        let isSomediaRecording = false;
        let somediaCameraFacing = 'user';
        let somediaTorchOn = false;
        let aiEffectActive = true;
        let aiBeautyActive = false;
        let animationFrameId = null;

        function switchTab(tabId) {
            const somediaOverlay = document.getElementById('tabSomedia');
            const appContainer = document.getElementById('appContainerFrame');
            const themeMeta = document.getElementById('themeColorMeta');

            if (tabId === 'tabSomedia') {
                somediaOverlay.classList.remove('hidden');
                somediaOverlay.classList.add('flex');
                if(appContainer) appContainer.classList.add('bg-[#0f0f0f]');
                if(themeMeta) themeMeta.setAttribute('content', '#0f0f0f');
            } else {
                somediaOverlay.classList.add('hidden');
                somediaOverlay.classList.remove('flex');
                if(appContainer) appContainer.classList.remove('bg-[#0f0f0f]');
                if(themeMeta) themeMeta.setAttribute('content', '#FEFBEA');
            }
        }

        async function openSomediaCameraModal() {
            const modal = document.getElementById('somediaCameraModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            await startSomediaCameraStream();
        }

        async function startSomediaCameraStream() {
            try {
                if(mediaStream) mediaStream.getTracks().forEach(t => t.stop());

                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: somediaCameraFacing }, 
                    audio: true 
                });

                const videoElem = document.getElementById('liveSomediaCameraStream');
                videoElem.srcObject = mediaStream;
                videoElem.onloadedmetadata = () => {
                    videoElem.play();
                    startAIRenderLoop();
                };
            } catch (err) {
                showToast('Kamarada lama furi karo');
            }
        }

        // REAL-TIME AI RENDER LOOP (WEBGL / CANVAS AI EFFECT)
        function startAIRenderLoop() {
            const video = document.getElementById('liveSomediaCameraStream');
            const canvas = document.getElementById('aiCanvasOverlay');
            const ctx = canvas.getContext('2d');

            function renderFrame() {
                if (video.paused || video.ended) return;

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;

                // Draw video frame to canvas
                ctx.save();
                if(somediaCameraFacing === 'user') {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                // Apply AI Real-Time Visual Enhancement/Filters
                if (aiEffectActive) {
                    ctx.save();
                    ctx.fillStyle = "rgba(255, 215, 0, 0.05)"; // Gold AI Glow
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Simulated AI Detection Tracking Box / Face Overlay
                    if(aiBeautyActive) {
                        ctx.strokeStyle = "#00ffcc";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(canvas.width/4, canvas.height/4, canvas.width/2, canvas.height/2);
                        ctx.fillStyle = "#00ffcc";
                        ctx.font = "12px Inter";
                        ctx.fillText("AI FACE TRACKING: OK", canvas.width/4, canvas.height/4 - 10);
                    }
                    ctx.restore();
                }

                animationFrameId = requestAnimationFrame(renderFrame);
            }

            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            renderFrame();
        }

        function toggleAIFilter() {
            aiEffectActive = !aiEffectActive;
            showToast(aiEffectActive ? 'AI Filter: ON ✨' : 'AI Filter: OFF');
        }

        function toggleAIAutoBeauty() {
            aiBeautyActive = !aiBeautyActive;
            showToast(aiBeautyActive ? 'AI Face Beauty: ON 💄' : 'AI Face Beauty: OFF');
        }

        async function toggleSomediaTorch() {
            if (!mediaStream) return;
            const track = mediaStream.getVideoTracks()[0];
            try {
                const capabilities = track.getCapabilities ? track.getCapabilities() : {};
                if ('torch' in capabilities || capabilities.torch) {
                    somediaTorchOn = !somediaTorchOn;
                    await track.applyConstraints({ advanced: [{ torch: somediaTorchOn }] });
                    document.getElementById('somediaFlashIcon').className = somediaTorchOn ? "fa-solid fa-bolt text-yellow-400 animate-pulse" : "fa-solid fa-bolt text-white";
                    showToast(somediaTorchOn ? 'Flash-ka waa la shiday 💡' : 'Flash-ka waa la damiyay');
                } else {
                    showToast('Device-kaagu ma taageerayo Flash');
                }
            } catch (e) {
                showToast('Flash-ka lama shidi karo');
            }
        }

        function switchSomediaCameraFacing() {
            somediaCameraFacing = somediaCameraFacing === 'user' ? 'environment' : 'user';
            startSomediaCameraStream();
        }

        function closeSomediaCameraModal() {
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            document.getElementById('somediaCameraModal').classList.add('hidden');
            document.getElementById('somediaCameraModal').classList.remove('flex');
        }

        function toggleSomediaRecording() {
            const circle = document.getElementById('somediaRecordInnerCircle');
            isSomediaRecording = !isSomediaRecording;
            if (isSomediaRecording) {
                circle.className = "w-6 h-6 rounded-sm bg-red-600 animate-pulse";
                showToast('Duubista AI waa bilaabatay...');
            } else {
                circle.className = "w-12 h-12 rounded-full bg-red-600";
                showToast('Duubistii si guul leh ayaa loo kaydiyay! 🚀');
                closeSomediaCameraModal();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none'); }, 2200);
        }
    </script>
</body>
</html>
