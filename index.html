
<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Ayah Number</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f8f8f8;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    text-align: center;
    padding: 20px;
}

/* Ayah Marker */
.ayah-marker {
    width: 300px;
    height: 300px;
    max-width: 85vw;
    max-height: 85vw;
    position: relative;
    margin: 0 auto 35px;
}

.ayah-marker img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Qari lambarka PNG-ga ku dhex jira */
.number-cover {
    position: absolute;
    width: 27%;
    height: 27%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    border-radius: 50%;
    z-index: 1;
}

/* Lambarka cusub */
.ayah-number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;

    color: #b47b12;
    font-family: "Times New Roman", serif;
    font-size: 75px;
    font-weight: bold;
    line-height: 1;
}

/* Controls */
.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

button {
    width: 82px;
    height: 75px;
    border: 1px solid #bd943e;
    border-radius: 14px;
    background: linear-gradient(
        135deg,
        #ffe28b,
        #d5a438,
        #b98720
    );
    color: #17100a;
    font-size: 35px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.94);
}

input {
    width: 125px;
    height: 75px;
    text-align: center;
    font-size: 30px;
    border: 1px solid #c5a04c;
    border-radius: 14px;
    background: white;
    outline: none;
}

input:focus {
    border: 2px solid #c3942d;
}

/* Mobile */
@media (max-width: 480px) {
    .ayah-marker {
        width: 260px;
        height: 260px;
    }

    .ayah-number {
        font-size: 65px;
    }

    button {
        width: 75px;
        height: 70px;
    }

    input {
        width: 115px;
        height: 70px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Quran Ayah Design -->
    <div class="ayah-marker">

        <img
            src="https://i.ibb.co/Z1xLpXCb/file-00000000464c8208a75ea713338fbdb7.png"
            alt="Quran Ayah Ornament"
        >

        <!-- Cover old number -->
        <div class="number-cover"></div>

        <!-- New number -->
        <div class="ayah-number" id="ayahNumber">1</div>

    </div>

    <!-- Number Controls -->
    <div class="controls">

        <button onclick="changeNumber(-1)">−</button>

        <input
            type="number"
            id="ayahInput"
            value="1"
            min="1"
            max="286"
            onchange="updateNumber()"
        >

        <button onclick="changeNumber(1)">+</button>

    </div>

</div>

<script>

// Update number
function updateNumber() {

    const input = document.getElementById("ayahInput");

    let number = parseInt(input.value);

    if (isNaN(number)) {
        number = 1;
    }

    // Limit 1 - 286
    number = Math.max(1, Math.min(286, number));

    input.value = number;

    // Change center number
    document.getElementById("ayahNumber").textContent = number;

}

// Plus and Minus
function changeNumber(value) {

    const input = document.getElementById("ayahInput");

    let current = parseInt(input.value) || 1;

    input.value = current + value;

    updateNumber();

}

// Initial number
updateNumber();

</script>

</body>
</html>
