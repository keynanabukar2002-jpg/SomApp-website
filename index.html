<!DOCTYPE html>
<html lang="so" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bayan Mobile App</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta id="themeColorMeta" name="theme-color" content="#FEFBEA">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .filter-normal { filter: none; }
        .filter-bright { filter: brightness(1.25) contrast(1.1) saturate(1.2); }
        .filter-vintage { filter: sepia(0.5) contrast(1.2) brightness(0.9); }
        .filter-bw { filter: grayscale(1); }
        .filter-warm { filter: sepia(0.3) saturate(1.4) hue-rotate(-10deg); }

        .no-scrollbar::-webkit-scrollbar, ::-webkit-scrollbar {
            width: 0px;
            display: none;
            background: transparent;
        }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .brand-logo-img {
            height: 28px;
            width: 28px;
            object-fit: cover;
            border-radius: 6px;
            border: 1.5px solid #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
        }

        .upload-nav-img {
            height: 24px;
            width: 24px;
            object-fit: cover;
            border-radius: 6px;
            border: 1.5px solid #ffffff;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.3);
            transition: transform 0.2s ease;
        }
        .upload-nav-img:active { transform: scale(0.9); }
    </style>
</head>
<body class="bg-black md:bg-slate-900 text-slate-800 h-full w-full flex justify-center items-center p-0 md:p-4 overflow-hidden">

    <div id="appContainerFrame" class="w-full h-full md:max-w-[410px] md:h-[844px] bg-[#FEFBEA] md:rounded-[44px] md:shadow-2xl overflow-hidden flex flex-col relative border-0 md:border-[8px] md:border-slate-900 transition-colors duration-200">

        <!-- SCREEN 1: LANDING SCREEN -->
        <div id="landingScreen" class="w-full h-full flex flex-col justify-between p-6 bg-gradient-to-b from-[#FEFBEA] via-[#FFF9E6] to-[#F7F2D5]">
            <div class="flex justify-between items-center pt-2">
                <div class="text-3xl font-black tracking-wider text-slate-900">
                    BAY<span class="text-amber-600">AN</span>
                </div>
                <button onclick="toggleTheme()" class="w-10 h-10 bg-amber-100/80 rounded-2xl flex items-center justify-center text-amber-800 shadow-sm active:scale-95 transition">
                    <i class="fa-solid fa-moon text-lg"></i>
                </button>
            </div>

            <div class="my-auto text-center px-2">               
                <span class="bg-emerald-100 text-emerald-800 text-[11px] font-extrabold px-3 py-1 rounded-full border border-emerald-200 uppercase tracking-widest">
                    Welcome to Bayan App
                </span>
                <h1 class="text-3xl font-black text-slate-900 mt-4 mb-3 leading-snug">
                    Kusoo Dhawoow Bayan-app
                </h1>
                <p class="text-xs text-slate-600 leading-relaxed max-w-xs mx-auto font-medium">
                    App-ku wuxuu hal meel ku mideynayaa Qur'aanka, mobile data, camera, calculator, PDF iyo SOMEDIA.
                </p>
            </div>

            <div class="pb-4 space-y-3">
                <button onclick="switchScreen('mainDashboard')" class="w-full bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-bold py-4 rounded-2xl shadow-xl transition flex items-center justify-center gap-2 text-sm">
                    <span>Get Started</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </div>

        <!-- SCREEN 2: MAIN DASHBOARD FRAME -->
        <div id="mainDashboard" class="hidden w-full h-full flex-col justify-between bg-transparent relative">
            
            <div id="mainDashboardHeader" class="p-4 pt-6 bg-white/60 backdrop-blur-md border-b border-amber-200/40 flex justify-between items-center shrink-0 z-10">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-700 text-white font-bold flex items-center justify-center shadow-md text-sm">
                        B
                    </div>
                    <div>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Good Morning</p>
                        <h2 class="text-sm font-extrabold text-slate-900 leading-tight">Bayan User</h2>
                    </div>
                </div>
                <button onclick="switchScreen('landingScreen')" title="Ka bax" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-500 flex items-center justify-center transition active:scale-95">
                    <i class="fa-solid fa-right-from-bracket text-xs"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-5 relative" id="mainContentContainer">
                <div id="tabHome" class="tab-content space-y-5">
                    <div class="rounded-3xl overflow-hidden shadow-2xl border-2 border-white/80 aspect-[3.05/1] h-[110px] w-full bg-emerald-900/10 flex items-center justify-center relative mx-auto transform transition duration-300">
                        <img id="mainBayanGif" src="https://i.ibb.co/xSRbk5PT/GIF-20261019-220935-911.gif" alt="Bayan Featured Clip" class="w-full h-full object-cover rounded-3xl">
                    </div>

                    <div>
                        <h3 class="text-xs font-black text-slate-400 uppercase tracking-wider mb-3 px-1">Uadeeg shabakadaha & Apps</h3>
                        <div class="grid grid-cols-3 gap-3">
                            <button onclick="selectService('Hormuud', 'Shabakada Hormuud Telecom')" class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center text-center h-28 hover:shadow-md active:scale-95 transition">
                                <div class="w-11 h-11 rounded-2xl border-2 border-emerald-600 flex items-center justify-center text-emerald-600 font-black text-xl mb-1 bg-emerald-50">H</div>
                                <span class="text-xs font-bold text-slate-800">Hormuud</span>
                            </button>

                            <button onclick="selectService('Somnet', 'Shabakada Somnet Telecom')" class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center text-center h-28 hover:shadow-md active:scale-95 transition">
                                <div class="text-sky-600 mb-1"><i class="fa-solid fa-wifi text-xl"></i></div>
                                <span class="text-[9px] font-bold text-sky-800 uppercase leading-none mt-1">SOMNET</span>
                                <span class="text-xs font-bold text-slate-800">Somnet</span>
                            </button>

                            <button onclick="selectService('Somtel', 'Shabakada Somtel')" class="bg-[#FFDC00] p-3 rounded-2xl shadow-sm flex flex-col items-center justify-center text-center h-28 hover:shadow-md active:scale-95 transition">
                                <div class="text-slate-900 font-black text-sm mb-1 tracking-wider">somtel</div>
                                <span class="text-xs font-bold text-slate-900">Somtel</span>
                            </button>

                            <!-- Camera Button -->
                            <button onclick="openFullCamera()" class="bg-emerald-600 text-white p-3 rounded-2xl shadow-sm flex flex-col items-center justify-center text-center h-28 hover:shadow-md active:scale-95 transition">
                                <div class="w-10 h-10 rounded-xl bg-emerald-500/80 flex items-center justify-center text-white text-lg mb-1 shadow-inner">
                                    <i class="fa-solid fa-camera"></i>
                                </div>
                                <span class="text-xs font-bold text-white">Camera</span>
                            </button>

                            <button onclick="openTikTokApp()" class="bg-black text-white p-3 rounded-2xl shadow-sm flex flex-col items-center justify-center text-center h-28 hover:shadow-md active:scale-95 transition">
                                <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-white text-lg mb-1 shadow-inner">
                                    <i class="fa-brands fa-tiktok"></i>
                                </div>
                                <span class="text-xs font-bold text-white">TikTok</span>
                            </button>

                            <button onclick="openFacebookApp()" class="bg-[#1877F2] text-white p-3 rounded-2xl shadow-sm flex flex-col items-center justify-center text-center h-28 hover:shadow-md active:scale-95 transition">
                                <div class="w-10 h-10 rounded-xl bg-blue-500/80 flex items-center justify-center text-white text-lg mb-1 shadow-inner">
                                    <i class="fa-brands fa-facebook-f"></i>
                                </div>
                                <span class="text-xs font-bold text-white">Facebook</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Mobile Navigation Bar -->
            <div id="bayanMainFooter" class="bg-white border-t border-slate-200/80 px-2 py-2 flex justify-around items-center text-[10px] font-bold text-slate-400 shrink-0 z-10">
                <button onclick="switchTab('tabHome', this)" class="nav-btn flex flex-col items-center text-indigo-950 font-bold">
                    <i class="fa-solid fa-house text-base mb-0.5"></i>
                    <span>Home</span>
                </button>
            </div>
        </div>

        <!-- CAMERA SCREEN WITH FLASH BUTTON -->
        <div id="cameraScreen" class="fixed inset-0 bg-black z-50 hidden flex-col justify-between overflow-hidden">
            <div id="flashOverlay" class="absolute inset-0 bg-white pointer-events-none opacity-0 transition-opacity duration-150 z-40"></div>

            <div class="p-4 flex justify-between items-center text-white z-30 bg-gradient-to-b from-black/80 to-transparent">
                <button onclick="closeFullCamera()" class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center active:scale-90">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

                <div id="videoTimer" class="hidden text-xs font-mono bg-red-600 text-white px-3 py-1 rounded-full animate-pulse flex items-center gap-1">
                    <div class="w-2 h-2 rounded-full bg-white"></div>
                    <span id="timerText">00:00</span>
                </div>

                <div class="flex items-center space-x-2">
                    <!-- BATOONKA FLASH-KA -->
                    <button onclick="toggleFlash()" id="flashBtn" class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center transition-all">
                        <i class="fa-solid fa-bolt text-base"></i>
                    </button>
                    <button onclick="switchCameraFacing()" class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-rotate text-base"></i>
                    </button>
                </div>
            </div>

            <div class="relative flex-1 flex items-center justify-center overflow-hidden bg-black">
                <video id="cameraVideo" autoplay playsinline class="w-full h-full object-cover filter-normal"></video>
                <canvas id="cameraCanvas" class="hidden"></canvas>
            </div>

            <div class="p-6 bg-black flex flex-col items-center z-30 space-y-4">
                <div class="flex space-x-6 text-xs font-bold text-white/50">
                    <button id="photoModeBtn" onclick="setMode('photo')" class="text-emerald-400 border-b-2 border-emerald-400 pb-1">PHOTO</button>
                    <button id="videoModeBtn" onclick="setMode('video')" class="hover:text-white pb-1">VIDEO</button>
                </div>

                <div class="w-full flex justify-between items-center px-4">
                    <div class="w-12"></div>
                    <button id="shutterBtn" onclick="handleShutterClick()" class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center p-1 active:scale-90 transition">
                        <div id="shutterInner" class="w-full h-full bg-white rounded-full"></div>
                    </button>
                    <div class="w-12"></div>
                </div>
            </div>
        </div>

        <div id="toastNotification" class="fixed top-16 left-1/2 -translate-x-1/2 bg-zinc-800 text-white px-4 py-1.5 rounded-full text-xs z-50 opacity-0 pointer-events-none transition-opacity duration-300 shadow-xl">
            <span id="toastMessage">Done</span>
        </div>

    </div>

    <script>
        let currentStream = null;
        let facingMode = "environment";
        let flashOn = false;
        let currentMode = "photo";

        async function openFullCamera() {
            document.getElementById('cameraScreen').classList.remove('hidden');
            document.getElementById('cameraScreen').classList.add('flex');
            await startRealCamera();
        }

        function closeFullCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('cameraScreen').classList.add('hidden');
            document.getElementById('cameraScreen').classList.remove('flex');
        }

        async function startRealCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: { 
                        facingMode: facingMode,
                        advanced: flashOn ? [{ torch: true }] : []
                    },
                    audio: currentMode === 'video'
                };
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('cameraVideo').srcObject = currentStream;
            } catch (err) {
                alert("Fadlan oggolaanshada kamarada sii App-ka.");
            }
        }

        async function toggleFlash() {
            flashOn = !flashOn;
            const flashBtn = document.getElementById('flashBtn');

            if (currentStream) {
                const track = currentStream.getVideoTracks()[0];
                const capabilities = track.getCapabilities ? track.getCapabilities() : {};

                if (capabilities.torch) {
                    try {
                        await track.applyConstraints({
                            advanced: [{ torch: flashOn }]
                        });
                        showToast(flashOn ? "Nalkii waa la shiday 💡" : "Nalkii waa la damay 🌙");
                    } catch (err) {
                        console.log("Torch Error:", err);
                    }
                } else {
                    showToast(flashOn ? "Flash Active ⚡" : "Flash Off");
                }
            }

            if (flashOn) {
                flashBtn.classList.add('bg-yellow-400', 'text-black');
                flashBtn.classList.remove('bg-white/20', 'text-white');
            } else {
                flashBtn.classList.remove('bg-yellow-400', 'text-black');
                flashBtn.classList.add('bg-white/20', 'text-white');
            }
        }

        function switchCameraFacing() {
            facingMode = facingMode === "user" ? "environment" : "user";
            startRealCamera();
        }

        function switchScreen(screenId) {
            if(screenId === 'mainDashboard') {
                document.getElementById('landingScreen').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                document.getElementById('mainDashboard').classList.add('flex');
            } else {
                document.getElementById('mainDashboard').classList.add('hidden');
                document.getElementById('landingScreen').classList.remove('hidden');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => { toast.classList.add('opacity-0', 'pointer-events-none'); }, 2000);
        }
    </script>
</body>
</html>
