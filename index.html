<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bayan App - Landing Page</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FEFBEA] text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between transition-colors duration-300">

  <!-- 1. Header (Leh Batoonka Iftiinka) -->
  <header class="w-full max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
    <!-- Logo (BAYAN) -->
    <div class="text-2xl font-extrabold tracking-wider text-slate-900" id="appLogo">
      BAY<span class="text-amber-600">AN</span>
    </div>

    <!-- Batoonka Iftiinka (Light/Dark Switcher) -->
    <button id="themeToggle" onclick="toggleTheme()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300/60 p-2.5 rounded-xl transition flex items-center gap-2 text-sm font-medium shadow-sm">
      <!-- Sun Icon -->
      <svg id="sunIcon" class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <!-- Moon Icon -->
      <svg id="moonIcon" class="w-5 h-5 text-slate-700 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      <span id="themeText" class="text-xs font-semibold">Iftiin</span>
    </button>
  </header>

  <!-- 2. Hero Section -->
  <main class="w-full max-w-xl mx-auto px-6 py-12 text-center flex-1 flex flex-col items-center justify-center">
    <span class="bg-amber-100 text-amber-800 text-xs font-semibold px-4 py-1.5 rounded-full mb-6 border border-amber-200/60 shadow-sm">
      Welcome to Bayan App
    </span>
    
    <h1 class="text-3xl md:text-5xl font-extrabold leading-tight mb-6" id="mainTitle">
      Kusoo Dhawoow<br />Bayan App
    </h1>
    
    <p class="text-base md:text-lg text-slate-600 leading-relaxed mb-8" id="mainDesc">
      App-ku wuxuu hal meel ku mideynayaa Qur'aanka, mobile data, camera, calculator, PDF iyo shopping, si dadka ay adeegyo badan hal app uga wada isticmaalaan.
    </p>

    <div class="flex flex-col gap-3.5 w-full max-w-xs">
      <a href="#" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-xl shadow-md transition text-center text-sm">
        Get Started
      </a>
      <a href="#" class="bg-white hover:bg-slate-50 text-slate-800 border border-slate-200 font-semibold py-3.5 rounded-xl shadow-sm transition text-center text-sm">
        Sii Akhri
      </a>
    </div>
  </main>

  <!-- 3. Footer -->
  <footer class="w-full py-6 text-center text-xs text-slate-400">
    <p>© 2026 Bayan App. Dhammaan xuquuqda waa la dhowray.</p>
  </footer>

  <!-- JavaScript oo beddelaaya Iftiinka iyo Madowga -->
  <script>
    function toggleTheme() {
      const body = document.body;
      const sunIcon = document.getElementById('sunIcon');
      const moonIcon = document.getElementById('moonIcon');
      const themeText = document.getElementById('themeText');
      const appLogo = document.getElementById('appLogo');
      const mainDesc = document.getElementById('mainDesc');

      if (body.classList.contains('bg-[#FEFBEA]')) {
        // Mode-ka Gaawiska / Madow
        body.classList.remove('bg-[#FEFBEA]', 'text-slate-800');
        body.classList.add('bg-slate-900', 'text-slate-100');
        
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
        themeText.innerText = "Gaawis";
        
        appLogo.classList.remove('text-slate-900');
        appLogo.classList.add('text-white');

        mainDesc.classList.remove('text-slate-600');
        mainDesc.classList.add('text-slate-300');
      } else {
        // Mode-ka Iftiinka / Soft Cream (#FEFBEA)
        body.classList.remove('bg-slate-900', 'text-slate-100');
        body.classList.add('bg-[#FEFBEA]', 'text-slate-800');
        
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
        themeText.innerText = "Iftiin";
        
        appLogo.classList.remove('text-white');
        appLogo.classList.add('text-slate-900');

        mainDesc.classList.remove('text-slate-300');
        mainDesc.classList.add('text-slate-600');
      }
    }
  </script>

</body>
</html>
