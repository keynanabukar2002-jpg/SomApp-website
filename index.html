    <meta charset="UTF-8">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        ytRed: '#FF0000',
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 1.5s infinite ease-in-out',
                        'ambient-bg': 'ambientBg 8s ease infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(255, 0, 0, 0.7)' },
                            '50%': { transform: 'scale(1.05)', boxShadow: '0 0 0 14px rgba(255, 0, 0, 0)' },
                        },
                        ambientBg: {
                            '0%, 100%': { filter: 'contrast(1.1) brightness(0.9) hue-rotate(0deg)' },
                            '50%': { filter: 'contrast(1.3) brightness(1.1) hue-rotate(15deg)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom styles for camera effects and overlays */
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Glassmorphism effects */
        .glass-pill {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glass-dark {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-icon-btn {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Video feed simulation styles */
        .cam-feed {
            background-size: cover;
            background-position: center;
            transition: all 0.5s ease;
        }

        .cam-sepia { filter: sepia(0.6) contrast(1.1); }
        .cam-bw { filter: grayscale(1) contrast(1.2); }
        .cam-vintage { filter: sepia(0.3) hue-rotate(-30deg) saturate(1.4); }
        .cam-cyber { filter: hue-rotate(140deg) saturate(2); }
        .cam-flipped { transform: scaleX(-1); }

        /* Custom Scrollbar for Drawer */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }
    </style>
</head>

    <!-- JAVASCRIPT CONTROLLER LOGIC -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // State Variables
            let isRecording = false;
            let recordingTimer = null;
            let currentDuration = 15; // default 15s
            let maxDuration = 15;
            let recordedSeconds = 0;
            let isFlipped = false;
            let isFlashOn = false;
            let currentSpeed = '1x';
            let currentFilter = 'none';
            let currentStream = null;
            let currentFacingMode = 'user'; // 'user' (front) or 'environment' (back)

            // Element References

            // Sidebar & Buttons

            const durationBadge = document.getElementById('durationBadge');
            const speedRateBtn = document.getElementById('speedRateBtn');

            const gridToggleBtn = document.getElementById('gridToggleBtn');
            const cameraGrid = document.getElementById('cameraGrid');
            const flashBtn = document.getElementById('flashBtn');

            const flashLabel = document.getElementById('flashLabel');

            // Modals & Panels
            const addSoundBtn = document.getElementById('addSoundBtn');
            const soundModal = document.getElementById('soundModal');
            const closeSoundModal = document.getElementById('closeSoundModal');
            const selectedSoundText = document.getElementById('selectedSoundText');
            
            const effectsBtn = document.getElementById('effectsBtn');
            const quickMagicBtn = document.getElementById('quickMagicBtn');
            const filtersModal = document.getElementById('filtersModal');
            const closeFiltersBtn = document.getElementById('closeFiltersBtn');

            const galleryBtn = document.getElementById('galleryBtn');
            const galleryModal = document.getElementById('galleryModal');
            const closeGalleryModal = document.getElementById('closeGalleryModal');
            const galleryThumb = document.getElementById('galleryThumb');

            // Mode Tabs
            const modeTabs = document.querySelectorAll('.mode-tab');
            const modeShort = document.getElementById('modeShort');

            // Toast Helper
            function showToast(message, iconClass = 'fa-solid fa-circle-info text-pink-400') {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toastMsg');
                const toastIcon = document.getElementById('toastIcon');
                
                toastMsg.textContent = message;
                toastIcon.className = iconClass;
                
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('opacity-100');

                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none');
                    toast.classList.remove('opacity-100');
                }, 2200);
            }

            // Web Camera Access - Supports real Front & Back (Environment) Cameras
            async function initCamera(facingMode = 'user') {
                // Stop any existing active track before switching camera stream
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                try {
                    const constraints = {
                        video: {
                            facingMode: { exact: facingMode }
                        },
                        audio: false
                    };
                    
                    // Fallback to simple facingMode if exact constraint fails on some mobile devices
                    try {
                        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                    } catch (e) {
                        currentStream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: facingMode },
                            audio: false
                        });
                    }

                    webcamVideo.srcObject = currentStream;
                    webcamVideo.classList.remove('hidden');
                    fallbackBg.classList.add('hidden');
                } catch (err) {
                    console.log("Real camera stream unavailable, using fallback view.", err);
                    webcamVideo.classList.add('hidden');
                    fallbackBg.classList.remove('hidden');
                }
            }
            initCamera('user');

            // Toggle Recording Logic
            function toggleRecording() {
                isRecording = !isRecording;

                if (isRecording) {
                    // Start Recording UI
                    recordRing.classList.add('animate-pulse-glow', 'border-red-500');
                    recordInnerIcon.className = 'w-6 h-6 bg-ytRed rounded-sm transition-all duration-300';
                    recordingTimerBadge.classList.remove('hidden');
                    recordingTimerBadge.classList.add('flex');
                    showToast("Recording started", "fa-solid fa-circle-dot text-red-500");

                    recordedSeconds = 0;
                    updateRecordingProgress();

                    recordingTimer = setInterval(() => {
                        recordedSeconds += 0.1;
                        updateRecordingProgress();

                        if (recordedSeconds >= maxDuration) {
                            stopRecording();
                            showToast("Maximum time limit reached", "fa-solid fa-check text-green-400");
                        }
                    }, 100);

                } else {
                    stopRecording();
                    showToast("Recording stopped", "fa-solid fa-stop text-yellow-400");
                }
            }

            function stopRecording() {
                isRecording = false;
                clearInterval(recordingTimer);
                recordRing.classList.remove('animate-pulse-glow', 'border-red-500');
                recordInnerIcon.className = 'w-full h-full rounded-full bg-ytRed transition-all duration-300';
                recordingTimerBadge.classList.add('hidden');
                recordingTimerBadge.classList.remove('flex');
            }

            function updateRecordingProgress() {
                const percentage = Math.min((recordedSeconds / maxDuration) * 100, 100);
                recordingProgress.style.width = `${percentage}%`;

                const formattedCurrent = recordedSeconds.toFixed(1);
                timerText.textContent = `00:${formattedCurrent < 10 ? '0' : ''}${formattedCurrent} / 00:${maxDuration}`;
            }

            recordBtn.addEventListener('click', toggleRecording);

            // Real Camera Switch (Front 'user' vs Back 'environment')
            flipCamBtn.addEventListener('click', async () => {
                isFlipped = !isFlipped;
                currentFacingMode = isFlipped ? 'environment' : 'user';

                // CSS Mirror effect when using front camera
                if (currentFacingMode === 'user') {
                    cameraViewfinder.classList.add('cam-flipped');
                } else {
                    cameraViewfinder.classList.remove('cam-flipped');
                }

                await initCamera(currentFacingMode);
                showToast(isFlipped ? "Switched to Back Camera" : "Switched to Front Camera", "fa-solid fa-camera-rotate");
            });

            // Duration Switcher (15s / 60s)
            durationToggleBtn.addEventListener('click', () => {
                if (maxDuration === 15) {
                    maxDuration = 60;
                    durationBadge.textContent = '60s';
                } else {
                    maxDuration = 15;
                    durationBadge.textContent = '15s';
                }
                showToast(`Duration set to ${maxDuration} seconds`, "fa-solid fa-clock");
            });

            // Speed Selector Toggle (0.5x, 1x, 2x, 3x)
            const speeds = ['0.5x', '1x', '2x', '3x'];
            speedRateBtn.addEventListener('click', () => {
                let currIdx = speeds.indexOf(currentSpeed);
                currentSpeed = speeds[(currIdx + 1) % speeds.length];
                speedRateLabel.textContent = currentSpeed;
                showToast(`Speed rate: ${currentSpeed}`, "fa-solid fa-gauge-high");
            });

            // Grid Line Toggle
            gridToggleBtn.addEventListener('click', () => {
                cameraGrid.classList.toggle('hidden');
                showToast("Grid toggle changed", "fa-solid fa-border-all");
            });

            // Flash Toggle
            flashBtn.addEventListener('click', () => {
                isFlashOn = !isFlashOn;
                if (isFlashOn) {
                    flashIcon.className = 'fa-solid fa-bolt text-amber-400 text-lg';
                    flashLabel.textContent = 'On';
                    showToast('Flash light turned ON', 'fa-solid fa-bolt text-amber-400');
                } else {
                    flashIcon.className = 'fa-solid fa-bolt-slash text-lg';
                    flashLabel.textContent = 'Flash';
                    showToast('Flash light turned OFF');
                }
            });

            // Add Sound Drawer Open/Close
            addSoundBtn.addEventListener('click', () => {
                soundModal.classList.remove('translate-y-full');
            });
            closeSoundModal.addEventListener('click', () => {
                soundModal.classList.add('translate-y-full');
            });

            // Select Sound Logic
            document.querySelectorAll('.sound-item').forEach(item => {
                item.addEventListener('click', () => {
                    const title = item.getAttribute('data-title');
                    selectedSoundText.textContent = title;
                    soundModal.classList.add('translate-y-full');
                    showToast(`Sound added: ${title}`, "fa-solid fa-music text-pink-400");
                });
            });

            // Filters Drawer Open/Close
            effectsBtn.addEventListener('click', () => {
                filtersModal.classList.remove('translate-y-full');
            });
            quickMagicBtn.addEventListener('click', () => {
                filtersModal.classList.remove('translate-y-full');
            });
            closeFiltersBtn.addEventListener('click', () => {
                filtersModal.classList.add('translate-y-full');
            });

            // Apply Filters Logic
            document.querySelectorAll('.filter-opt').forEach(opt => {
                opt.addEventListener('click', () => {
                    const filterClass = opt.getAttribute('data-filter');
                    
                    // Remove all filter classes
                    cameraViewfinder.classList.remove('cam-vintage', 'cam-bw', 'cam-cyber', 'cam-sepia');
                    
                    if (filterClass !== 'none') {
                        cameraViewfinder.classList.add(filterClass);
                    }

                    // Reset borders
                    document.querySelectorAll('.filter-opt div').forEach(d => d.classList.remove('border-red-500'));
                    opt.querySelector('div').classList.add('border-red-500');

                    showToast(`Filter applied`, "fa-solid fa-wand-magic-sparkles");
                    filtersModal.classList.add('translate-y-full');
                });
            });

            // Gallery Modal
            galleryBtn.addEventListener('click', () => {
                galleryModal.classList.remove('translate-y-full');
            });
            closeGalleryModal.addEventListener('click', () => {
                galleryModal.classList.add('translate-y-full');
            });

            document.querySelectorAll('.gallery-select-item').forEach(img => {
                img.addEventListener('click', (e) => {
                    galleryThumb.src = e.target.src;
                    fallbackBg.style.backgroundImage = `url('${e.target.src}')`;
                    galleryModal.classList.add('translate-y-full');
                    showToast("Background video/image updated", "fa-solid fa-image");
                });
            });

            // Mode Selector Tabs (Video, Short, Live)
            modeTabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    modeTabs.forEach(t => {
                        t.className = 'mode-tab px-5 py-1.5 rounded-full text-xs font-semibold text-white/70 hover:text-white transition-all';
                    });

                    e.target.className = 'mode-tab px-5 py-1.5 rounded-full text-xs font-bold text-white bg-neutral-800 shadow-md transition-all';

                    const modeName = e.target.textContent.trim();
                    showToast(`Switched to ${modeName} mode`, "fa-solid fa-video");
                });
            });

            // Close Top Button Alert/Message
            document.getElementById('closeBtn').addEventListener('click', () => {
                showToast("Camera session closed", "fa-solid fa-xmark");
            });

        });
    </script>
</body>
</html>
