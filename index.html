<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayan App</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 800px;
            background-color: var(--bg-color);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--border-color);
            position: relative;
        }

        /* Header */
        .app-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .app-header h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        /* Main Content Area */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .section h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        /* Weather Widget */
        .weather-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .weather-temp {
            font-size: 1.8rem;
            font-weight: bold;
        }

        /* Calculator Styles */
        .calc-display {
            width: 100%;
            height: 45px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1.2rem;
            text-align: right;
            padding: 0 10px;
            margin-bottom: 10px;
        }

        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .calc-btn {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .calc-btn.op {
            background-color: #0284c7;
        }

        /* Navigation Bar */
        .nav-bar {
            height: 70px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: color 0.2s;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--accent-color);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <h1>Bayan App</h1>
            <span style="font-size: 0.85rem; color: var(--text-muted);">Mogadishu</span>
        </div>

        <!-- Content -->
        <div class="app-content">
            <!-- Weather Section -->
            <div class="section">
                <h3>Cimilada Maanta</h3>
                <div class="weather-info">
                    <div>
                        <p style="font-weight: 500;">Mogadishu, Somalia</p>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">Garan-waa / Qorrax leh</p>
                    </div>
                    <div class="weather-temp">30°C</div>
                </div>
            </div>

            <!-- Calculator Section -->
            <div class="section">
                <h3>Xisaabiyaha (Calculator)</h3>
                <input type="text" class="calc-display" id="calcDisplay" readonly value="0">
                <div class="calc-buttons">
                    <button class="calc-btn" onclick="clearCalc()">C</button>
                    <button class="calc-btn" onclick="appendCalc('/')">/</button>
                    <button class="calc-btn" onclick="appendCalc('*')">×</button>
                    <button class="calc-btn op" onclick="backspace()">⌫</button>
                    
                    <button class="calc-btn" onclick="appendCalc('7')">7</button>
                    <button class="calc-btn" onclick="appendCalc('8')">8</button>
                    <button class="calc-btn" onclick="appendCalc('9')">9</button>
                    <button class="calc-btn op" onclick="appendCalc('-')">-</button>
                    
                    <button class="calc-btn" onclick="appendCalc('4')">4</button>
                    <button class="calc-btn" onclick="appendCalc('5')">5</button>
                    <button class="calc-btn" onclick="appendCalc('6')">6</button>
                    <button class="calc-btn op" onclick="appendCalc('+')">+</button>
                    
                    <button class="calc-btn" onclick="appendCalc('1')">1</button>
                    <button class="calc-btn" onclick="appendCalc('2')">2</button>
                    <button class="calc-btn" onclick="appendCalc('3')">3</button>
                    <button class="calc-btn op" onclick="calculate()" style="grid-row: span 2; height: 100%;">=</button>
                    
                    <button class="calc-btn" onclick="appendCalc('0')" style="grid-column: span 2;">0</button>
                    <button class="calc-btn" onclick="appendCalc('.')">.</button>
                </div>
            </div>

            <!-- Quick Store / Service Peek -->
            <div class="section">
                <h3>Adeegyada Degdegga ah</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted);">Halkan waxaad ka heli kartaa alaabahaaga iyo dukumiintiyadaada adigoo isticmaalaya navigation-ka hoose.</p>
            </div>
        </div>

        <!-- Navigation Bar -->
        <nav class="nav-bar">
            <button class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Guriga</span>
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                <span>Dukumiinti</span>
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span>Bakhaar</span>
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                <span>Warbixin</span>
            </button>
        </nav>
    </div>

    <script>
        const display = document.getElementById('calcDisplay');
        let currentInput = '0';

        function appendCalc(val) {
            if (currentInput === '0' && val !== '.') {
                currentInput = val;
            } else {
                currentInput += val;
            }
            display.value = currentInput;
        }

        function clearCalc() {
            currentInput = '0';
            display.value = currentInput;
        }

        function backspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            display.value = currentInput;
        }

        function calculate() {
            try {
                currentInput = eval(currentInput).toString();
                display.value = currentInput;
            } catch (error) {
                display.value = 'Khalad';
                currentInput = '0';
            }
        }
    </script>
</body>
</html>
