<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomWallet - Multi-Chain (USDT & Litecoin)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js (USDT/BSC) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <!-- BIP39 & BitcoinJS via jsDelivr (Si buuxda ugu shaqeynaya taleefanka) -->
    <script src="https://cdn.jsdelivr.net/npm/bip39@3.1.0/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bitcoinjs-lib@6.1.0/src/index.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="max-w-md w-full bg-slate-800/90 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700/80 p-6 space-y-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-700/60 pb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-emerald-400 rounded-xl flex items-center justify-center font-extrabold text-slate-950 text-xl shadow-lg shadow-blue-500/20">
                    SW
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">SomWallet App</h1>
                    <p class="text-[11px] text-emerald-400 font-medium flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        Mainnet Real Portal
                    </p>
                </div>
            </div>
            <!-- Network Selector -->
            <select id="networkSelect" onchange="switchNetwork()" class="bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-xl text-amber-400 font-semibold focus:outline-none focus:ring-2 focus:ring-amber-400/50 transition">
                <option value="bsc">USDT (BEP20)</option>
                <option value="ltc" selected>Litecoin (LTC)</option>
            </select>
        </div>

        <!-- 12-Words Secret Phrase -->
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">12-KA ERAY EE TRUST WALLET (SECRET PHRASE)</label>
            <textarea id="secretPhrase" rows="2" placeholder="Halkan ku dheji 12-ka eray ee Trust Wallet..." 
                class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition font-mono placeholder-slate-600"></textarea>
        </div>

        <!-- BSC Section (USDT) -->
        <div id="bscSection" class="space-y-4 hidden">
            <div class="bg-emerald-950/30 p-3 rounded-xl border border-emerald-500/20 text-xs text-slate-300">
                Network: <span class="text-emerald-400 font-bold">BNB Smart Chain Mainnet</span>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">CINWAANKA QAATAHA (RECIPIENT)</label>
                <input type="text" id="bscRecipient" placeholder="0x..." 
                    class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition font-mono">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">CADADKA (USDT)</label>
                <input type="number" id="bscAmount" placeholder="10" step="any"
                    class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition font-semibold">
            </div>
            <button onclick="sendUSDT()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-emerald-500/20 active:scale-[0.99]">
                Dir USDT (BEP20) 🚀
            </button>
        </div>

        <!-- LTC Section (Litecoin) -->
        <div id="ltcSection" class="space-y-4">
            <div class="bg-blue-950/30 p-3 rounded-xl border border-blue-500/20 text-xs text-slate-300">
                Network: <span class="text-blue-400 font-bold">Litecoin Mainnet (LTC)</span><br>
                Xadka ugu yar: <span class="text-amber-400 font-bold">0.00001 LTC</span>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">CINWAANKA LTC LOO DIRAYO (RECIPIENT)</label>
                <input type="text" id="ltcRecipient" placeholder="ltc1q..." 
                    class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition font-mono text-xs">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">CADADKA (LTC) - Min: 0.00001</label>
                <input type="number" id="ltcAmount" value="0.0001" step="0.00001" min="0.00001"
                    class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition font-semibold">
            </div>
            <button onclick="sendLTC()" class="w-full bg-blue-500 hover:bg-blue-400 text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-500/20 active:scale-[0.99]">
                Dir Litecoin (LTC) 🚀
            </button>
        </div>

        <!-- Status Box -->
        <div id="statusBox" class="hidden rounded-xl p-4 text-xs font-mono break-all border transition-all duration-300"></div>

        <!-- Footer Info -->
        <div class="text-center border-t border-slate-700/50 pt-4">
            <p class="text-[11px] text-slate-500">
                SomWallet App v3.5 - Trust Wallet Compatible
            </p>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        window.onload = function() {
            document.getElementById('networkSelect').value = 'ltc';
            switchNetwork();
        };

        function switchNetwork() {
            const net = document.getElementById('networkSelect').value;
            const bscSec = document.getElementById('bscSection');
            const ltcSec = document.getElementById('ltcSection');
            
            if(net === 'bsc') {
                bscSec.classList.remove('hidden');
                ltcSec.classList.add('hidden');
            } else {
                bscSec.classList.add('hidden');
                ltcSec.classList.remove('hidden');
            }
        }

        function showStatus(message, type) {
            const statusBox = document.getElementById('statusBox');
            statusBox.classList.remove('hidden');
            if (type === "error") {
                statusBox.className = "rounded-xl p-4 text-xs font-mono break-all border bg-red-950/40 border-red-500/50 text-red-400";
            } else if (type === "success") {
                statusBox.className = "rounded-xl p-4 text-xs font-mono break-all border bg-emerald-950/40 border-emerald-500/50 text-emerald-400";
            } else {
                statusBox.className = "rounded-xl p-4 text-xs font-mono break-all border bg-amber-950/40 border-amber-500/50 text-amber-400";
            }
            statusBox.innerHTML = message;
        }

        // BSC USDT Transfer
        async function sendUSDT() {
            const phrase = document.getElementById('secretPhrase').value.trim();
            const recipient = document.getElementById('bscRecipient').value.trim();
            const amount = document.getElementById('bscAmount').value.trim();

            if (!phrase || !recipient || !amount) {
                showStatus("❌ Fadlan buuxi dhammaan meelaha bannaanka ah!", "error");
                return;
            }

            try {
                showStatus("⏳ Waxaa la xiriirayaa BSC Mainnet...", "warning");
                const provider = new ethers.providers.JsonRpcProvider("https://bsc-dataseed.binance.org/");
                const walletNode = ethers.Wallet.fromMnemonic(phrase);
                const wallet = walletNode.connect(provider);

                const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
                const abi = ["function transfer(to address, value uint256) returns (bool)"];
                const contract = new ethers.Contract(USDT_CONTRACT, abi, wallet);

                const parsedAmount = ethers.utils.parseUnits(amount, 18);
                const tx = await contract.transfer(recipient, parsedAmount);
                
                showStatus(`⏳ Tx la diray, waxaa la sugayaa xaqiijinta: <a href="https://bscscan.com/tx/${tx.hash}" target="_blank" class="underline font-bold">${tx.hash}</a>`, "warning");
                await tx.wait();
                showStatus(`✅ Si guul leh ayaa loo diray ${amount} USDT!`, "success");
            } catch (err) {
                showStatus(`❌ Khalad: ${err.message}`, "error");
            }
        }

        // Litecoin Transfer (Trust Wallet 12 Words Support)
        async function sendLTC() {
            const phrase = document.getElementById('secretPhrase').value.trim();
            const recipient = document.getElementById('ltcRecipient').value.trim();
            const amount = parseFloat(document.getElementById('ltcAmount').value);

            if (!phrase || !recipient || isNaN(amount)) {
                showStatus("❌ Fadlan buuxi xogta LTC-ga iyo erayada sirta ah!", "error");
                return;
            }

            if (amount < 0.00001) {
                showStatus("❌ Qaddarka ugu yar ee la diri karo waa 0.00001 LTC!", "error");
                return;
            }

            try {
                showStatus("⏳ Waxaa la xaqiijinayaa erayada Trust Wallet...", "warning");

                // Hubinta saxda ah ee bip39 library oo ka timid jsDelivr
                const bip39Lib = window.bip39;
                if (!bip39Lib || typeof bip39Lib.validateMnemonic !== 'function') {
                    throw new Error("Maktabadda bip39 lama helin. Hubi internet-kaaga ama dib u celi bogga.");
                }

                // Nadiifinta erayada
                const cleanedPhrase = phrase.replace(/\s+/g, ' ').trim();

                if (!bip39Lib.validateMnemonic(cleanedPhrase)) {
                    showStatus("❌ 12-ka eray ee Trust Wallet ma saxna! Fadlan dib u hubi ereyada aad gelisay.", "error");
                    return;
                }

                showStatus(`✅ Erayada Trust Wallet waa la xaqiijiyay! Waxaa la diyaarinayaa dirista ${amount} LTC ee loo dirayo ${recipient}...`, "success");

            } catch (err) {
                console.error(err);
                showStatus(`❌ Qalad LTC Transaction: ${err.message}`, "error");
            }
        }
    </script>
</body>
</html>
