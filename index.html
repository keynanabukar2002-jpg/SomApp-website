<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Mobile Portfolio Dashboard</title>
    <!-- Use Tailwind CSS CDN for easier integration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'background': '#0F1117', // Dark Navy
                        'card': '#1B1E2B',       // Slate/Charcoal for cards
                        'primary': '#2F66F6',    // Bright Blue
                        'secondary': '#1E2230',  // Muted/Secondary accent
                        'mutedText': '#9CA3AF'   // Gray text
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar to match dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0F1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #1B1E2B;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2A2A2A;
        }
    </style>
</head>
<body class="bg-background text-white font-sans antialiased">
    <!-- Main Mobile Container (Approximating mobile dimensions in viewport) -->
    <div class="max-w-[420px] mx-auto min-h-screen bg-background border-x border-secondary relative pb-[70px]">

        <!-- 1. Header Navigation -->
        <header class="flex items-center justify-between p-4 sticky top-0 bg-background z-10 border-b border-secondary">
            <!-- Logo Section -->
            <div class="flex items-center gap-2">
                <button class="text-white hover:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center gap-1.5">
                    <span class="text-primary font-bold text-xl">Poly</span>
                    <span class="text-white font-bold text-xl">market</span>
                </div>
            </div>
            
            <!-- Icon/Profile Section -->
            <div class="flex items-center gap-3">
                <button class="text-white hover:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </button>
                <button class="text-white hover:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </button>
                <!-- Profile Avatar Gradient Circle -->
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-[#FFA500] via-[#A020F0] to-[#00FF00]"></div>
            </div>
        </header>

        <!-- 2. Category Sub-menu (Scrolling) -->
        <nav class="flex items-center gap-2 overflow-x-auto p-4 py-3 border-b border-secondary no-scrollbar">
            <a href="#" class="px-4 py-1.5 bg-secondary text-white rounded-full text-sm font-medium whitespace-nowrap hover:bg-[#2A2E3E]">All</a>
            <a href="#" class="px-4 py-1.5 bg-primary text-white rounded-full text-sm font-medium whitespace-nowrap">Crypto</a>
            <a href="#" class="px-4 py-1.5 bg-secondary text-white rounded-full text-sm font-medium whitespace-nowrap hover:bg-[#2A2E3E]">Politics</a>
            <a href="#" class="px-4 py-1.5 bg-secondary text-white rounded-full text-sm font-medium whitespace-nowrap hover:bg-[#2A2E3E]">Econ</a>
            <a href="#" class="px-4 py-1.5 bg-secondary text-white rounded-full text-sm font-medium whitespace-nowrap hover:bg-[#2A2E3E]">Culture</a>
            <a href="#" class="px-4 py-1.5 bg-secondary text-white rounded-full text-sm font-medium whitespace-nowrap hover:bg-[#2A2E3E]">AI</a>
        </nav>

        <!-- Main Content Area -->
        <main class="p-4 space-y-6">
            <!-- 3. Portfolio Balance Card -->
            <section class="p-5 bg-card rounded-2xl border border-secondary">
                <div class="flex items-center justify-between mb-2">
                    <div class="text-mutedText text-sm">Portfolio</div>
                    <div class="text-mutedText text-sm">Available to trade</div>
                </div>
                <div class="flex items-end justify-between">
                    <div class="text-4xl font-extrabold text-white leading-none">$0.04</div>
                    <div class="text-xl font-bold text-white">$0.04</div>
                </div>
            </section>

            <!-- 4. Action Buttons -->
            <section class="grid grid-cols-2 gap-3">
                <button class="flex items-center justify-center gap-2 p-4 bg-primary text-white rounded-xl font-semibold hover:bg-[#407BFF] transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                    Deposit
                </button>
                <button class="flex items-center justify-center gap-2 p-4 bg-secondary text-mutedText rounded-xl font-semibold hover:bg-[#2A2E3E] transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                    Withdraw
                </button>
            </section>

            <!-- 5. Profit/Loss Chart Card -->
            <section class="p-4 bg-card rounded-2xl border border-secondary relative min-h-[160px]">
                <div class="flex items-center justify-between mb-1">
                    <div class="text-mutedText text-xs uppercase font-semibold">P/L</div>
                    <div class="text-mutedText text-xs">Nov 2, 2026</div>
                </div>
                <div class="text-xl font-bold text-white mb-4">$0.00</div>
                
                <!-- Approximated chart shape/gradient -->
                <div class="w-full h-[60px] absolute bottom-4 left-0 px-4">
                    <div class="w-full h-full rounded-md" style="background: linear-gradient(180deg, rgba(47, 102, 246, 0.2) 0%, rgba(47, 102, 246, 0) 100%);">
                        <svg class="w-full h-full" viewBox="0 0 100 20" preserveAspectRatio="none">
                            <path d="M0,10 C10,12 20,8 30,11 C40,14 50,5 60,8 C70,11 80,6 90,9 C100,12 110,10 120,10" stroke="#2F66F6" stroke-width="1.5" fill="none"></path>
                        </svg>
                    </div>
                </div>

                <!-- Timeframe Filters -->
                <div class="absolute bottom-4 left-4 right-4 flex items-center justify-between gap-1 text-xs text-mutedText z-[1]">
                    <span class="px-2 py-0.5 bg-secondary rounded hover:text-white cursor-pointer">1D</span>
                    <span class="px-2 py-0.5 bg-secondary rounded hover:text-white cursor-pointer">1W</span>
                    <span class="px-2 py-0.5 bg-secondary rounded hover:text-white cursor-pointer">1M</span>
                    <span class="px-2 py-0.5 bg-secondary rounded hover:text-white cursor-pointer">1Y</span>
                    <span class="px-2 py-0.5 bg-secondary rounded hover:text-white cursor-pointer">ALL</span>
                </div>
            </section>

            <!-- 6. Positions Table Area -->
            <section class="space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-white">Your Positions</h2>
                    <button class="text-primary text-sm font-medium hover:text-[#407BFF]">View All</button>
                </div>
                
                <div class="p-6 bg-card rounded-2xl border border-secondary text-center space-y-4">
                    <svg class="w-16 h-16 mx-auto text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <div class="space-y-1">
                        <div class="text-white font-semibold">No positions found</div>
                        <div class="text-mutedText text-sm px-5">Your active trade positions will be displayed here. Start trading to populate this table.</div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 7. Bottom Navigation Bar -->
        <footer class="fixed bottom-0 left-0 w-full bg-background border-t border-secondary z-10 flex justify-center">
            <div class="max-w-[420px] w-full flex items-center justify-around p-3 px-5 text-mutedText">
                <button class="flex flex-col items-center gap-1 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span class="text-[10px]">Home</span>
                </button>
                <button class="flex flex-col items-center gap-1 text-primary">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    <span class="text-[10px]">Portfolio</span>
                </button>
                <button class="flex flex-col items-center gap-1 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M12 16v1m-6-6h.01M6 16h.01M18 16h.01M18 11h.01"></path></svg>
                    <span class="text-[10px]">Leaderboard</span>
                </button>
                <button class="flex flex-col items-center gap-1 hover:text-white relative">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-[#FFA500] via-[#A020F0] to-[#00FF00]"></div>
                    <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
            </div>
        </footer>

    </div>

    <!-- Hidden class for no-scrollbar support in various browsers -->
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body>
</html>
