
<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Qur'aan Kariim - 114 Suuradood</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #e9e2d3;
  font-family: Arial, sans-serif;
  color: #172d50;
}

header {
  background: #142b4d;
  color: #f4d58a;
  text-align: center;
  padding: 18px 10px;
}

header h2 { margin: 0 0 12px; }

select, button {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #c6a45c;
  font-size: 16px;
}

select {
  width: min(90%, 420px);
  background: #fffaf0;
  color: #142b4d;
}

button {
  background: #c6a45c;
  color: #142b4d;
  cursor: pointer;
  font-weight: bold;
  margin: 5px;
}

#pages {
  padding: 18px 10px;
}

.page {
  max-width: 850px;
  min-height: 900px;
  margin: 15px auto;
  padding: 35px 25px;
  background: #fffaf0;
  border: 9px double #b18b42;
  outline: 3px solid #142b4d;
  outline-offset: -16px;
  box-shadow: 0 4px 15px #0002;
  text-align: center;
}

.ornament {
  color: #b18b42;
  font-size: 25px;
  margin: 8px;
}

.surah-title {
  color: #142b4d;
  font-size: 30px;
  margin: 25px 0;
  padding: 15px;
  border-top: 2px solid #b18b42;
  border-bottom: 2px solid #b18b42;
}

.bismillah {
  font-size: 29px;
  line-height: 2;
  margin: 25px 0;
  color: #172d50;
}

.verses {
  direction: rtl;
  text-align: justify;
  text-align-last: center;
  font-family: "Traditional Arabic", "Noto Naskh Arabic",
               "Amiri", serif;
  font-size: 30px;
  line-height: 2.2;
  color: #172d50;
}

.ayah {
  display: inline;
}

.marker {
  display: inline-flex;
  width: 34px;
  height: 34px;
  border: 2px solid #b18b42;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  margin: 0 5px;
  color: #142b4d;
  vertical-align: middle;
}

.status {
  text-align: center;
  padding: 15px;
  color: #142b4d;
}

@media print {
  body { background: white; }
  header, .controls, .status { display: none; }
  #pages { padding: 0; }
  .page {
    box-shadow: none;
    margin: 0 auto;
    page-break-after: always;
    min-height: 95vh;
  }
}
</style>
</head>

<body>

<header>
  <h2>القرآن الكريم</h2>
  <div>114 Suuradood</div>
  <br>

  <div class="controls">
    <select id="surahSelect">
      <option value="">Dooro Suurada</option>
    </select>
    <br>
    <button onclick="loadSurah()">Fur Suurada</button>
    <button onclick="window.print()">Daabac / PDF</button>
  </div>
</header>

<div class="status" id="status">
  Fadlan sug, Qur'aanka ayaa la soo rarayaa...
</div>

<main id="pages"></main>

<script>
const select = document.getElementById("surahSelect");
const pages = document.getElementById("pages");
const statusBox = document.getElementById("status");

let quranData = [];

async function initialize() {
  try {
    const response = await fetch(
      "https://api.alquran.cloud/v1/quran/quran-simple"
    );

    if (!response.ok) throw new Error("Xogta lama helin");

    const result = await response.json();
    quranData = result.data.surahs;

    quranData.forEach(surah => {
      const option = document.createElement("option");
      option.value = surah.number;
      option.textContent =
        surah.number + ". " + surah.name;
      select.appendChild(option);
    });

    statusBox.textContent =
      "114-ka suuradood waa diyaar. Dooro suurada aad rabto.";

  } catch (error) {
    statusBox.textContent =
      "Xogta lama soo dejin. Hubi internet-kaaga kadib dib u fur bogga.";
  }
}

function loadSurah() {
  const number = Number(select.value);

  if (!number) {
    statusBox.textContent = "Fadlan dooro suurad.";
    return;
  }

  const surah = quranData.find(s => s.number === number);

  if (!surah) return;

  pages.innerHTML = "";

  const page = document.createElement("section");
  page.className = "page";

  const ornament = document.createElement("div");
  ornament.className = "ornament";
  ornament.textContent = "❖ ✿ ❖";

  const title = document.createElement("h2");
  title.className = "surah-title";
  title.textContent = surah.name;

  page.appendChild(ornament);
  page.appendChild(title);

  if (number !== 1 && number !== 9) {
    const bismillah = document.createElement("div");
    bismillah.className = "bismillah";
    bismillah.textContent =
      "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
    page.appendChild(bismillah);
  }

  const verses = document.createElement("div");
  verses.className = "verses";

  surah.ayahs.forEach(ayah => {
    const text = document.createElement("span");
    text.className = "ayah";
    text.textContent = ayah.text + " ";

    const marker = document.createElement("span");
    marker.className = "marker";
    marker.textContent = ayah.numberInSurah;

    verses.appendChild(text);
    verses.appendChild(marker);
    verses.appendChild(document.createTextNode(" "));
  });

  page.appendChild(verses);

  const bottom = document.createElement("div");
  bottom.className = "ornament";
  bottom.textContent = "❖ ✿ ❖";
  page.appendChild(bottom);

  pages.appendChild(page);
  statusBox.textContent =
    surah.name + " — " + surah.ayahs.length + " aayadood";
}

initialize();
</script>

</body>
</html>
