<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KNN MicroPay & Wallet</title>
    <style>
        :root {
            --bg-cream: #FEFBEA;
            --card-bg: #FFFFFF;
            --text-dark: #111827;
            --text-muted: #6B7280;
            --border-soft: #E5E7EB;
            --blue-grad-1: #0B5ED7;
            --blue-grad-2: #1D4ED8;
            --accent-blue: #2563EB;
            --danger-border: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            padding-bottom: 84px;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 14px 28px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            gap: 8px;
        }

        .app-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }

        .status-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 999px;
            background: #EEF2FF;
            color: var(--accent-blue);
            border: 1px solid #C7D2FE;
        }

        .mining-card {
            background: linear-gradient(135deg, var(--blue-grad-1), var(--blue-grad-2));
            color: #FFFFFF;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 10px 24px rgba(29, 78, 216, 0.22);
            margin-bottom: 14px;
        }

        .mining-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 12px;
            font-weight: 700;
        }

        .mining-badge {
            background: rgba(255, 255, 255, 0.16);
            padding: 5px 10px;
            border-radius: 999px;
        }

        .min-dep-badge {
            background: rgba(255, 255, 255, 0.14);
            padding: 5px 10px;
            border-radius: 999px;
        }

        .balance-main {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }

        .mining-rate-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            opacity: 0.92;
            margin-bottom: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .stat-label {
            font-size: 10px;
            font-weight: 700;
            opacity: 0.85;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 14px;
            font-weight: 800;
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .info-card.key-card {
            border-color: var(--danger-border);
        }

        .card-heading {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.4px;
        }

        .email-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            word-break: break-all;
        }

        .addr-box {
            width: 100%;
            border: 1.5px solid var(--accent-blue);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
            background: #F8FAFC;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .pk-box {
            width: 100%;
            border: 1.5px solid var(--danger-border);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
            background: #FFFDFD;
            margin-bottom: 10px;
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 11px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .btn:active {
            opacity: 0.85;
        }

        .btn-soft {
            background: #E5E7EB;
            color: var(--text-dark);
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #FFFFFF;
            width: 100%;
        }

        .input-field {
            width: 100%;
            border: 1px solid #D1D5DB;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 10px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-blue);
        }

        .feedback-msg {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #1F2937;
            min-height: 18px;
            word-break: break-word;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #FFFFFF;
            border-top: 1px solid var(--border-soft);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            padding: 8px 4px;
            z-index: 50;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px 2px;
        }

        .nav-item.active {
            color: var(--accent-blue);
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="app-container" id="appRoot">
        <div class="top-bar">
            <div class="app-title">KNN WALLET</div>
            <button type="button" class="status-pill" id="refreshSyncBtn" onclick="window.syncUserWalletSafe && window.syncUserWalletSafe(window.__currentUser)">
                ↻ Sync
            </button>
        </div>

        <div class="mining-card">
            <div class="mining-top-row">
                <span class="mining-badge" id="miningStatusBadge">● MINING INACTIVE</span>
                <span class="min-dep-badge">Min Dep: 0.00001 POL</span>
            </div>

            <div class="balance-main" id="balanceDisplay">0.00000000 POL</div>

            <div class="mining-rate-row">
                <span>Saamiga maalinlaha ah: 0 POL</span>
                <span id="ratePerSecDisplay">+0.000000/s</span>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">DAILY OUTPUT</div>
                    <div class="stat-value" id="dailyOutputDisplay">0.000000 POL</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">ACCOUNT ID</div>
                    <div class="stat-value" id="accountIdDisplay">KNN-205792</div>
                </div>
            </div>
        </div>

        <div class="info-card">
            <div class="card-heading">MACLUUMAADKA XISAABTA</div>
            <div class="email-text" id="accountEmailDisplay">abuukarcumar661@gmail.com</div>
        </div>

        <div class="info-card">
            <div class="card-heading">CINWAANKAAGA DEPOSIT-KA (POLYGON)</div>
            <input
                type="text"
                id="depositAddressInput"
                class="addr-box"
                readonly
                value="0x613b603440CA724C266FC5432E2a20D000F73367"
            />
            <button type="button" class="btn btn-soft" style="width: 100%;" onclick="window.copyDepositAddressSafe && window.copyDepositAddressSafe()">
                Copy Deposit Address
            </button>
        </div>

        <div class="info-card key-card">
            <div class="card-heading">PRIVATE KEY-GAAGA (POLYGON)</div>
            <input
                type="password"
                id="privateKeyInput"
                class="pk-box"
                readonly
                value="••••••••••••••••••••••••••••••••••••••••••"
            />
            <div class="btn-row">
                <button type="button" class="btn btn-soft" onclick="window.togglePrivateKeySafe && window.togglePrivateKeySafe()">
                    Show / Hide
                </button>
                <button type="button" class="btn btn-soft" onclick="window.copyPrivateKeySafe && window.copyPrivateKeySafe()">
                    Copy Key
                </button>
            </div>
        </div>

        <div class="info-card">
            <div class="card-heading">WITHDRAW (POLYGON POL)</div>
            <input
                type="text"
                id="withdrawRecipientInput"
                class="input-field"
                placeholder="Recipient Polygon Address (0x...)"
            />
            <input
                type="number"
                step="any"
                id="withdrawAmountInput"
                class="input-field"
                placeholder="Amount in POL (tusaale 0.001)"
            />
            <button type="button" class="btn btn-primary" onclick="window.submitWithdrawSafe && window.submitWithdrawSafe()">
                Withdraw POL
            </button>
            <div class="feedback-msg" id="withdrawStatusMsg"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button type="button" class="nav-item" onclick="window.handleNavClick && window.handleNavClick('Home', this)">
            <span>⌂</span>
            <span>Home</span>
        </button>
        <button type="button" class="nav-item" onclick="window.handleNavClick && window.handleNavClick('Chat', this)">
            <span>💬</span>
            <span>Chat</span>
        </button>
        <button type="button" class="nav-item" onclick="window.handleNavClick && window.handleNavClick('Upload', this)">
            <span>+</span>
            <span>Upload</span>
        </button>
        <button type="button" class="nav-item" onclick="window.handleNavClick && window.handleNavClick('Quran', this)">
            <span>📖</span>
            <span>Qur'aan</span>
        </button>
        <button type="button" class="nav-item active" onclick="window.handleNavClick && window.handleNavClick('Wallet', this)">
            <span>💳</span>
            <span>Wallet</span>
        </button>
        <button type="button" class="nav-item" onclick="window.handleNavClick && window.handleNavClick('Profile', this)">
            <span>👤</span>
            <span>Profile</span>
        </button>
    </nav>

    <script>
        (function () {
            const SERVER_URL = window.KNN_SERVER_URL || 'https://somapp-website-production.up.railway.app';

            window.addEventListener('error', function (event) {
                console.error('Caught window error:', event.message || event.error);
                const root = document.getElementById('appRoot');
                if (root && !root.innerHTML.trim()) {
                    root.innerHTML = '<div class="info-card"><div class="card-heading">STATUS</div><div class="email-text">App-ku wuu diyaar garoobayaa... fadlan refresh dheh.</div></div>';
                }
            });

            window.addEventListener('unhandledrejection', function (event) {
                console.error('Caught unhandled rejection:', event.reason);
            });

            function safeText(val, fallback) {
                if (val === undefined || val === null) return fallback || '';
                const str = String(val).trim();
                return str.length ? str : (fallback || '');
            }

            function safeNumber(val, fallback) {
                const n = Number(val);
                return Number.isFinite(n) ? n : (fallback || 0);
            }

            function setTextById(id, txt) {
                try {
                    const el = document.getElementById(id);
                    if (el) el.textContent = txt;
                } catch (_) {}
            }

            function setValueById(id, val) {
                try {
                    const el = document.getElementById(id);
                    if (el) el.value = val;
                } catch (_) {}
            }

            function renderWalletSafe(rawData) {
                try {
                    const data = rawData && typeof rawData === 'object' ? rawData : {};
                    const bal = safeNumber(data.balance, 0);
                    const daily = safeNumber(data.dailyLimit, 0);
                    const mining = Boolean(data.miningActive) || bal > 0;

                    const accountId = safeText(data.userId, 'KNN-205792');
                    const depositAddr = safeText(data.polygonAddress, '0x613b603440CA724C266FC5432E2a20D000F73367');
                    const email = safeText(data.email, 'abuukarcumar661@gmail.com');
                    const pk = safeText(data.privateKey, '');

                    setTextById('balanceDisplay', bal.toFixed(8) + ' POL');
                    setTextById('dailyOutputDisplay', daily.toFixed(6) + ' POL');
                    setTextById('accountIdDisplay', accountId);
                    setTextById('accountEmailDisplay', email);
                    setTextById('miningStatusBadge', mining ? '● MINING ACTIVE' : '● MINING INACTIVE');
                    setTextById('ratePerSecDisplay', mining ? '+0.000000/s' : '+0.000000/s');

                    setValueById('depositAddressInput', depositAddr);

                    const pkInput = document.getElementById('privateKeyInput');
                    if (pkInput) {
                        pkInput.dataset.realKey = pk;
                        if (pkInput.type === 'password') {
                            pkInput.value = pk ? '•'.repeat(42) : 'Lama helin';
                        } else {
                            pkInput.value = pk || 'Lama helin';
                        }
                    }

                    try {
                        localStorage.setItem('knn_wallet_cache_v1', JSON.stringify({
                            userId: accountId,
                            polygonAddress: depositAddr,
                            email: email,
                            balance: bal.toFixed(8),
                            dailyLimit: daily.toFixed(6),
                            miningActive: mining,
                            updatedAt: Date.now()
                        }));
                    } catch (_) {}
                } catch (err) {
                    console.error('renderWalletSafe error:', err);
                }
            }

            function restoreCache() {
                try {
                    const cached = localStorage.getItem('knn_wallet_cache_v1');
                    if (!cached) return;
                    const parsed = JSON.parse(cached);
                    if (parsed && typeof parsed === 'object') {
                        renderWalletSafe(parsed);
                    }
                } catch (_) {}
            }

            async function syncUserWalletSafe(user) {
                restoreCache();

                const activeUser = user || window.__currentUser || null;
                if (!activeUser || !activeUser.uid) {
                    return;
                }

                window.__currentUser = activeUser;

                const controller = new AbortController();
                const timer = setTimeout(function () {
                    controller.abort();
                }, 15000);

                try {
                    const resp = await fetch(SERVER_URL + '/api/auth-user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            uid: activeUser.uid,
                            email: activeUser.email || '',
                            displayName: activeUser.displayName || 'User'
                        }),
                        signal: controller.signal
                    });

                    clearTimeout(timer);

                    if (!resp.ok) {
                        console.warn('Auth endpoint status:', resp.status);
                        return;
                    }

                    const data = await resp.json();
                    if (data && data.success) {
                        renderWalletSafe(Object.assign({}, data, {
                            email: activeUser.email || data.email || 'abuukarcumar661@gmail.com'
                        }));
                    }
                } catch (err) {
                    clearTimeout(timer);
                    console.warn('syncUserWalletSafe warning:', err.name === 'AbortError' ? 'Timeout' : err.message);
                }
            }

            window.togglePrivateKeySafe = function () {
                try {
                    const pkInput = document.getElementById('privateKeyInput');
                    if (!pkInput) return;
                    const realKey = pkInput.dataset.realKey || '';
                    if (!realKey) {
                        pkInput.value = 'Lama helin';
                        return;
                    }
                    if (pkInput.type === 'password') {
                        pkInput.type = 'text';
                        pkInput.value = realKey;
                    } else {
                        pkInput.type = 'password';
                        pkInput.value = '•'.repeat(42);
                    }
                } catch (err) {
                    console.error('togglePrivateKeySafe error:', err);
                }
            };

            window.copyPrivateKeySafe = async function () {
                try {
                    const pkInput = document.getElementById('privateKeyInput');
                    const realKey = pkInput ? (pkInput.dataset.realKey || '') : '';
                    if (!realKey) return;
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(realKey);
                    }
                } catch (err) {
                    console.warn('Copy key failed:', err.message);
                }
            };

            window.copyDepositAddressSafe = async function () {
                try {
                    const addrEl = document.getElementById('depositAddressInput');
                    const addr = addrEl ? (addrEl.value || '') : '';
                    if (!addr) return;
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(addr);
                    }
                } catch (err) {
                    console.warn('Copy address failed:', err.message);
                }
            };

            window.submitWithdrawSafe = async function () {
                const msgEl = document.getElementById('withdrawStatusMsg');
                try {
                    const currentUser = window.__currentUser;
                    if (!currentUser || !currentUser.uid) {
                        if (msgEl) msgEl.textContent = 'Fadlan marka hore ku gal akoonkaaga.';
                        return;
                    }

                    const recipientEl = document.getElementById('withdrawRecipientInput');
                    const amountEl = document.getElementById('withdrawAmountInput');
                    const recipientAddress = recipientEl ? recipientEl.value.trim() : '';
                    const amount = amountEl ? amountEl.value.trim() : '';

                    if (!recipientAddress) {
                        if (msgEl) msgEl.textContent = 'Fadlan geli cinwaanka recipient-ka.';
                        return;
                    }

                    if (msgEl) msgEl.textContent = 'Waa la dirayaa...';

                    const resp = await fetch(SERVER_URL + '/api/withdraw', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            uid: currentUser.uid,
                            recipientAddress: recipientAddress,
                            amount: amount
                        })
                    });

                    const data = await resp.json();
                    if (data && data.success) {
                        if (msgEl) msgEl.textContent = data.message || 'Withdraw waa guuleystay.';
                        await syncUserWalletSafe(currentUser);
                    } else {
                        if (msgEl) msgEl.textContent = (data && data.error) || 'Withdraw waa fashilmay.';
                    }
                } catch (err) {
                    if (msgEl) msgEl.textContent = err.message || 'Cilad ayaa dhacday.';
                }
            };

            window.handleNavClick = function (tabName, btnEl) {
                try {
                    const items = document.querySelectorAll('.bottom-nav .nav-item');
                    items.forEach(function (item) {
                        item.classList.remove('active');
                    });
                    if (btnEl) btnEl.classList.add('active');
                } catch (_) {}
            };

            window.syncUserWalletSafe = syncUserWalletSafe;
            restoreCache();
        })();
    </script>
</body>
</html>
