
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arabic Numbers 1-286</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.design {
    position: relative;
    width: min(90vw, 400px);
    margin: 20px auto;
}

.design img {
    width: 100%;
    display: block;
}

/* Lambarka dhexe */
#number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: "Amiri", "Traditional Arabic", serif;
    font-size: 65px;
    font-weight: bold;
    color: #880C0E;
    text-shadow: 1px 1px 2px #D5AE65;
    z-index: 2;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 20px auto;
}

button {
    padding: 12px 22px;
    background: #4D0707;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
}

input {
    width: 90px;
    padding: 10px;
    font-size: 20px;
    text-align: center;
}

</style>
</head>

<body>

<h3>الأرقام العربية</h3>

<div class="design">
    <img src="https://i.ibb.co/Z1xLpXCb/file-00000000464c8208a75ea713338fbdb7.png">
    <div id="number">١</div>
</div>

<div class="controls">
    <button onclick="change(-1)">السابق</button>
    <button onclick="change(1)">التالي</button>
</div>

<input type="number" id="inputNumber"
min="1" max="286" value="1"
oninput="setNumber(this.value)">

<script>
let current = 1;

function display() {
    document.getElementById("number").textContent =
        current.toLocaleString("ar-u-nu-arab", {
            useGrouping: false
        });

    document.getElementById("inputNumber").value = current;
}

function change(amount) {
    current += amount;

    if (current < 1) current = 1;
    if (current > 286) current = 286;

    display();
}

function setNumber(value) {
    if (value === "") return;

    let n = Number(value);

    if (n >= 1 && n <= 286 && Number.isInteger(n)) {
        current = n;
        document.getElementById("number").textContent =
            n.toLocaleString("ar-u-nu-arab", {
                useGrouping: false
            });
    }
}
</script>

</body>
</html>
