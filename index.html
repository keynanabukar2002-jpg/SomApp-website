<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SOMEDIA - Shorts & Video App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      padding-top: 56px;
      padding-bottom: 60px;
      overflow-x: hidden;
    }

    /* HEADER FIX */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      z-index: 1000;
      background-color: #0f0f0f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #1f1f1f;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .brand-logo-img {
      height: 30px;
      width: 30px;
      object-fit: cover;
      border-radius: 8px;
      border: 1.5px solid #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 18px;
      position: relative;
      cursor: pointer;
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -8px;
      background-color: #e50914;
      color: white;
      font-size: 9px;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 10px;
    }

    /* CATEGORIES BAR */
    .categories {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .chip {
      background-color: #272727;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }

    .chip.active {
      background-color: #ffffff;
      color: #0f0f0f;
      font-weight: 600;
    }

    /* SECTION TITLE */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 12px;
    }

    .shorts-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 700;
    }

    .shorts-logo {
      color: #ff0000;
      font-size: 18px;
    }

    /* SHORTS GRID */
    .shorts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 12px 16px;
    }

    .short-card {
      position: relative;
      aspect-ratio: 9/16;
      border-radius: 12px;
      overflow: hidden;
      background-color: #1f1f1f;
      cursor: pointer;
    }

    .short-card img, .short-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tag-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      z-index: 2;
    }

    .short-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.85) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 10px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
      color: #ffffff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* BOTTOM NAV BAR */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 52px;
      background-color: #0f0f0f;
      border-top: 1px solid #1f1f1f;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #aaaaaa;
      font-size: 10px;
      gap: 3px;
      cursor: pointer;
      width: 20%;
    }

    .nav-item.active {
      color: #ffffff;
    }

    .nav-item i {
      font-size: 18px;
    }

    .nav-custom-img {
      height: 28px;
      width: 28px;
      object-fit: cover;
      border-radius: 8px;
      border: 1.5px solid #ffffff;
      box-shadow: 0 2px 8px rgba(255, 255, 255, 0.3);
    }

    .profile-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: #e65100;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
    }

    /* SHORTS CAMERA CREATION SCREEN */
    .camera-screen {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 3000;
      flex-direction: column;
      justify-content: space-between;
    }

    .camera-screen.active {
      display: flex;
    }

    .camera-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* CAMERA TOP BAR */
    .camera-top-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
    }

    .cam-close-btn {
      background: rgba(0,0,0,0.4);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .add-sound-btn {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .magic-effect-btn {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* CAMERA SIDE TOOLBAR */
    .camera-side-tools {
      position: absolute;
      right: 16px;
      top: 90px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: rgba(0,0,0,0.3);
      padding: 12px 8px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    .tool-icon {
      background: none;
      border: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 18px;
      cursor: pointer;
    }

    .tool-icon span {
      font-size: 10px;
      font-weight: 600;
    }

    /* CAMERA BOTTOM CONTROLS */
    .camera-bottom-controls {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-bottom: 30px;
    }

    .action-row {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 20px;
    }

    .gallery-add-btn, .drafts-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }

    .gallery-add-btn img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 2px solid white;
      object-fit: cover;
    }

    .record-btn-outer {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
    }

    .record-btn-inner {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background-color: #ff0000;
      transition: all 0.2s ease;
    }

    .record-btn-outer.recording .record-btn-inner {
      width: 28px;
      height: 28px;
      border-radius: 4px;
    }

    .mode-selector {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .mode-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-btn.active {
      color: white;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 14px;
      border-radius: 16px;
    }

    /* FULLSCREEN PLAYER MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #000;
      z-index: 2000;
    }

    .modal-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      color: white;
      font-size: 22px;
      background: rgba(0,0,0,0.5);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }

    #galleryInput {
      display: none;
    }
  </style>
</head>
<body>

  <!-- FIXED HEADER -->
  <header>
    <div class="header-left">
      <span class="brand-title">SOMEDIA</span>
      <img src="https://i.ibb.co/dwDSVhQm/20261022-043354998.png" alt="Logo" class="brand-logo-img">
    </div>
    <div class="header-right">
      <button class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="icon-btn">
        <i class="fa-regular fa-bell"></i>
        <span class="badge">9+</span>
      </button>
    </div>
  </header>

  <!-- CATEGORIES -->
  <div class="categories">
    <button class="chip"><i class="fa-regular fa-compass"></i></button>
    <button class="chip active">Dhammaan</button>
    <button class="chip">Somali Tech</button>
    <button class="chip">Musig</button>
    <button class="chip">Ciyaaro</button>
    <button class="chip">Podcasts</button>
  </div>

  <!-- SHORTS TITLE -->
  <div class="section-title">
    <div class="shorts-brand">
      <i class="fa-solid fa-bolt shorts-logo"></i>
      <span>Shorts Feed</span>
    </div>
    <span style="font-size: 12px; color: #888;">4 videos</span>
  </div>

  <!-- SHORTS GRID -->
  <div class="shorts-grid" id="shortsGrid">
    <div class="short-card" onclick="openPlayer('Sirta Miraha Cad...', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4')">
      <span class="tag-badge">Somali Tech</span>
      <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80" alt="Short 1">
      <div class="short-overlay">
        <div class="card-title">Sirta Miraha Cad iyo Waxtarkooda...</div>
      </div>
    </div>

    <div class="short-card" onclick="openPlayer('Gatos inteligentes...', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4')">
      <span class="tag-badge">Gaming</span>
      <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80" alt="Short 2">
      <div class="short-overlay">
        <div class="card-title">Gatos inteligentes y Gr...</div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <i class="fa-solid fa-house"></i>
      <span>Home</span>
    </button>
    <button class="nav-item">
      <i class="fa-solid fa-bolt"></i>
      <span>Shorts</span>
    </button>
    <!-- SOO GELI BUTTON (OPEN CAMERA) -->
    <button class="nav-item" onclick="openCameraScreen()">
      <img src="https://i.ibb.co/dwDSVhQm/20261022-043354998.png" alt="Soo geli" class="nav-custom-img">
      <span>Soo geli</span>
    </button>
    <button class="nav-item">
      <i class="fa-solid fa-layer-group"></i>
      <span>Subscriptions</span>
    </button>
    <button class="nav-item">
      <div class="profile-avatar">S</div>
      <span>Adiga</span>
    </button>
  </nav>

  <!-- SHORTS CAMERA SCREEN (SI DA SAWIRKAAGA) -->
  <div class="camera-screen" id="cameraScreen">
    <video class="camera-preview" id="cameraVideo" autoplay playsinline muted></video>

    <!-- TOP CONTROL BAR -->
    <div class="camera-top-bar">
      <button class="cam-close-btn" onclick="closeCameraScreen()"><i class="fa-solid fa-xmark"></i></button>
      <button class="add-sound-btn"><i class="fa-solid fa-music"></i> Add sound</button>
      <button class="magic-effect-btn"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
    </div>

    <!-- RIGHT SIDE TOOLBAR -->
    <div class="camera-side-tools">
      <button class="tool-icon"><i class="fa-solid fa-rotate"></i><span>Flip</span></button>
      <button class="tool-icon"><i class="fa-regular fa-clock"></i><span>Timer</span></button>
      <button class="tool-icon"><span>3m</span></button>
      <button class="tool-icon"><i class="fa-solid fa-sparkles"></i><span>Effects</span></button>
      <button class="tool-icon"><span>1x</span><span>Speed</span></button>
      <button class="tool-icon"><i class="fa-solid fa-chevron-down"></i></button>
    </div>

    <!-- BOTTOM RECORD & GALLERY CONTROLS -->
    <div class="camera-bottom-controls">
      <div class="action-row">
        <!-- Add / Gallery Button -->
        <button class="gallery-add-btn" onclick="triggerGalleryPicker()">
          <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=100&q=80" alt="Add">
          <span>Add</span>
        </button>

        <!-- Red Recording Button -->
        <div class="record-btn-outer" id="recordBtn" onclick="toggleRecording()">
          <div class="record-btn-inner"></div>
        </div>

        <!-- Drafts Button -->
        <button class="drafts-btn">
          <i class="fa-regular fa-file-lines" style="font-size: 24px;"></i>
          <span>Drafts</span>
        </button>
      </div>

      <!-- Mode Selector -->
      <div class="mode-selector">
        <button class="mode-btn">Video</button>
        <button class="mode-btn active">Short</button>
        <button class="mode-btn">Live</button>
      </div>
    </div>
  </div>

  <input type="file" id="galleryInput" accept="video/*" onchange="handleGalleryVideo(event)">

  <!-- FULLSCREEN PLAYER MODAL -->
  <div class="modal" id="playerModal">
    <button class="close-btn" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
    <div class="modal-content">
      <video id="videoPlayer" loop autoplay controls></video>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let cameraStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    async function openCameraScreen() {
      const camScreen = document.getElementById('cameraScreen');
      const camVideo = document.getElementById('cameraVideo');
      camScreen.classList.add('active');

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: true
        });
        camVideo.srcObject = cameraStream;
      } catch (err) {
        console.warn("Camera access fallback:", err);
      }
    }

    function closeCameraScreen() {
      const camScreen = document.getElementById('cameraScreen');
      camScreen.classList.remove('active');
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

    function toggleRecording() {
      const recBtn = document.getElementById('recordBtn');
      if (!isRecording) {
        isRecording = true;
        recBtn.classList.add('recording');
        if (cameraStream) {
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(cameraStream);
          mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
          mediaRecorder.onstop = saveRecordedVideo;
          mediaRecorder.start();
        }
      } else {
        isRecording = false;
        recBtn.classList.remove('recording');
        if (mediaRecorder) {
          mediaRecorder.stop();
        }
      }
    }

    function saveRecordedVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/mp4' });
      const videoUrl = URL.createObjectURL(blob);
      closeCameraScreen();
      addNewShortToGrid("Muuqaal Cusub (Recorded)", videoUrl);
    }

    function triggerGalleryPicker() {
      document.getElementById('galleryInput').click();
    }

    function handleGalleryVideo(event) {
      const file = event.target.files[0];
      if (file) {
        const videoUrl = URL.createObjectURL(file);
        closeCameraScreen();
        addNewShortToGrid(file.name, videoUrl);
      }
    }

    function addNewShortToGrid(title, url) {
      const grid = document.getElementById('shortsGrid');
      const card = document.createElement('div');
      card.className = 'short-card';
      card.onclick = () => openPlayer(title, url);
      card.innerHTML = `
        <span class="tag-badge">Shorts</span>
        <video src="${url}" preload="metadata"></video>
        <div class="short-overlay">
          <div class="card-title">${title}</div>
        </div>
      `;
      grid.prepend(card);
      openPlayer(title, url);
    }

    function openPlayer(title, videoSrc) {
      const modal = document.getElementById('playerModal');
      const player = document.getElementById('videoPlayer');
      player.src = videoSrc;
      modal.style.display = 'block';
      player.play();
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const player = document.getElementById('videoPlayer');
      player.pause();
      modal.style.display = 'none';
    }
  </script>
</body>
</html>
