<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SomApp - Messenger & Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b141a;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        #profile-setup-section, #search-section, #chat-section { display: none; }
    </style>
</head>
<body class="text-[#e9edef] font-sans antialiased h-full w-full overflow-hidden select-none">

    <!-- App Container -->
    <div class="flex flex-col h-full w-full max-w-md mx-auto bg-[#0f172a] overflow-hidden">

        <!-- 1. GOOGLE LOGIN SECTION -->
        <div id="login-section" class="flex flex-col items-center justify-center h-full p-6 text-center">
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center font-black text-white text-3xl shadow-xl mb-6">
                S
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Ku soo dhowow SomApp</h2>
            <p class="text-sm text-[#94a3b8] mb-8">Ku gal Google Account-kaaga si aad ugu shaqeyso fariimaha iyo wallet-kaaga gaarka ah.</p>
            <button onclick="loginWithGoogle()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-3">
                <span>Google ku gal</span>
            </button>
        </div>

        <!-- 2. PROFILE SETUP SECTION -->
        <div id="profile-setup-section" class="flex flex-col items-center justify-center h-full p-6 text-center">
            <h2 class="text-xl font-bold text-white mb-2">Dhammeystir Profile-kaaga</h2>
            <p class="text-sm text-[#94a3b8] mb-6">Geli Username oo dooro sawir gallery-gaaga ah:</p>
            
            <div class="w-full space-y-4">
                <input type="text" id="usernameInput" placeholder="Tusaale: Ahmed123" class="w-full bg-[#1e293b] border border-[#334155] rounded-xl px-4 py-3 text-white outline-none focus:border-sky-500 text-center">
                
                <div class="flex flex-col items-center">
                    <input type="file" id="profilePicInput" accept="image/*" onchange="previewImage(event)" class="w-full bg-[#1e293b] border border-[#334155] rounded-xl px-4 py-2.5 text-white text-sm">
                    <img id="preview-img" alt="Sawirkaaga" class="w-20 h-20 rounded-full object-cover mt-4 border-2 border-sky-500 hidden shadow-md">
                </div>

                <button onclick="saveProfile()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all active:scale-95">
                    Kaydi oo Soco
                </button>
            </div>
        </div>

        <!-- 3. MAIN APP SECTION (CHATS & SEARCH) -->
        <div id="search-section" class="flex flex-col h-full w-full hidden">
            <!-- Top Header -->
            <header class="bg-[#0f172a] pt-3 px-4 pb-2 flex justify-between items-center shrink-0 border-b border-[#1e293b]">
                <div class="flex items-center gap-2">
                    <img id="my-avatar" src="" class="w-8 h-8 rounded-full object-cover border border-sky-500">
                    <h1 id="welcome-user" class="text-lg font-bold tracking-wide text-white"></h1>
                </div>
            </header>

            <!-- Search Bar -->
            <div class="px-3 py-2 bg-[#0f172a] shrink-0">
                <div class="flex items-center gap-3 bg-[#1e293b] px-4 py-2 rounded-full text-[#94a3b8]">
                    <input type="text" id="searchFriendInput" placeholder="Geli username-ka saaxiibka..." class="bg-transparent border-none outline-none text-white text-sm w-full placeholder-[#64748b]">
                    <button onclick="searchFriend()" class="text-sky-400 font-semibold text-xs bg-sky-500/20 px-3 py-1.5 rounded-full">Raadi</button>
                </div>
                <div id="search-result" class="mt-2"></div>
            </div>

            <!-- Scrollable Chats Area -->
            <main class="flex-1 overflow-y-auto divide-y divide-[#1e293b]/50 no-scrollbar relative min-h-0 p-4">
                <p class="text-xs text-[#94a3b8] text-center mt-10">Raadi saaxiibadaada adigoo adeegsanaya Username-kooda saxda ah.</p>
            </main>
        </div>

        <!-- 4. CHAT ROOM SECTION -->
        <div id="chat-section" class="flex flex-col h-full w-full hidden">
            <header class="bg-[#0f172a] p-3 border-b border-[#1e293b] flex items-center gap-3 shrink-0">
                <button onclick="goBackToSearch()" class="text-sky-400 font-semibold text-sm">⬅️ Ku noqo</button>
                <h3 id="chat-title" class="text-white font-bold"></h3>
            </header>
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[#0b141a]"></div>
            <div class="p-3 bg-[#0f172a] flex gap-2 border-t border-[#1e293b]">
                <input type="text" id="messageInput" placeholder="Qor fariin..." class="flex-1 bg-[#1e293b] border border-[#334155] rounded-xl px-4 py-2.5 text-white text-sm outline-none" onkeypress="if(event.key === 'Enter') sendMsg()">
                <button onclick="sendMsg()" class="bg-sky-500 text-white px-5 rounded-xl font-bold">Dir</button>
            </div>
        </div>

    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBCe8ZiIPsTxT1fGA0IT3nIUaQjFK67al0",
        authDomain: "somchat-1910a.firebaseapp.com",
        projectId: "somchat-1910a",
        storageBucket: "somchat-1910a.firebasestorage.app",
        messagingSenderId: "981092599681",
        appId: "1:981092599681:web:cc01745c6831ab8ea44a80",
        measurementId: "G-8B6P8RSDQG"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let currentUser = null;
      let userData = null;
      let activeChatRoomId = "";
      let unsubscribeChat = null;
      let base64Image = "";

      // Habka saxda ah ee lagu qabto redirect-ka iyo xogta user-ka
      getRedirectResult(auth).then((result) => {
          if (result && result.user) {
              currentUser = result.user;
              handleUserSession(currentUser);
          }
      }).catch((error) => {
          console.error("Redirect Error:", error);
      });

      onAuthStateChanged(auth, (user) => {
          if (user) {
              currentUser = user;
              handleUserSession(user);
          } else {
              document.getElementById("login-section").style.display = "flex";
              document.getElementById("profile-setup-section").style.display = "none";
              document.getElementById("search-section").style.display = "none";
          }
      });

      async function handleUserSession(user) {
          try {
              const userRef = doc(db, "users", user.uid);
              const userSnap = await getDoc(userRef);

              document.getElementById("login-section").style.display = "none";

              if (userSnap.exists()) {
                  userData = userSnap.data();
                  showSearchSection();
              } else {
                  document.getElementById("profile-setup-section").style.display = "flex";
              }
          } catch (e) {
              console.error("Error checking user session:", e);
          }
      }

      // Google Sign-In Trigger
      window.loginWithGoogle = async function() {
          const provider = new GoogleAuthProvider();
          try {
              await signInWithRedirect(auth, provider);
          } catch (e) {
              console.error("Khalad Google Login ah: ", e);
          }
      };

      // Gallery Image Preview to Base64
      window.previewImage = function(event) {
          const file = event.target.files[0];
          if (file) {
              const reader = new FileReader();
              reader.onload = function(e) {
                  base64Image = e.target.result;
                  const imgElement = document.getElementById("preview-img");
                  imgElement.src = base64Image;
                  imgElement.style.display = "block";
              };
              reader.readAsDataURL(file);
          }
      };

      // Profile Kaydinta
      window.saveProfile = async function() {
          const username = document.getElementById("usernameInput").value.trim();

          if (!username) {
              alert("Fadlan geli username!");
              return;
          }
          if (!base64Image) {
              alert("Fadlan dooro sawir profile gallery-gaaga ah!");
              return;
          }

          try {
              userData = {
                  uid: currentUser.uid,
                  username: username,
                  email: currentUser.email,
                  photoURL: base64Image
              };

              await setDoc(doc(db, "users", currentUser.uid), userData);
              await setDoc(doc(db, "usernames", username), { uid: currentUser.uid });

              showSearchSection();
          } catch (e) {
              console.error("Khalad kaydinta ah: ", e);
              alert("Khalad ayaa dhacay intii profile-ka la keydiyay.");
          }
      };

      function showSearchSection() {
          document.getElementById("login-section").style.display = "none";
          document.getElementById("profile-setup-section").style.display = "none";
          document.getElementById("search-section").style.display = "flex";
          document.getElementById("welcome-user").innerText = userData.username;
          document.getElementById("my-avatar").src = userData.photoURL;
      }

      // Raadinta Saaxiibka
      window.searchFriend = async function() {
          const friendUsername = document.getElementById("searchFriendInput").value.trim();
          const resultDiv = document.getElementById("search-result");
          resultDiv.innerHTML = "";

          if (!friendUsername) return;

          if (friendUsername === userData.username) {
              resultDiv.innerHTML = "<p class='text-red-400 text-xs mt-2'>Naftaada lama sheekaysan kartid!</p>";
              return;
          }

          try {
              const usernameSnap = await getDoc(doc(db, "usernames", friendUsername));
              if (usernameSnap.exists()) {
                  const friendUid = usernameSnap.data().uid;
                  const friendSnap = await getDoc(doc(db, "users", friendUid));
                  const friendData = friendSnap.data();

                  resultDiv.innerHTML = `
                      <div class="flex items-center justify-between bg-[#1e293b] p-3 rounded-xl mt-2">
                          <div class="flex items-center gap-3">
                              <img src="${friendData.photoURL}" class="w-10 h-10 rounded-full object-cover">
                              <span class="text-white font-semibold text-sm">${friendData.username}</span>
                          </div>
                          <button onclick='openChat(${JSON.stringify(friendData)})' class="bg-sky-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Sheekeyso</button>
                      </div>
                  `;
              } else {
                  resultDiv.innerHTML = "<p class='text-red-400 text-xs mt-2'>Saaxiibkan lama helin!</p>";
              }
          } catch (e) {
              console.error("Khalad raadinta ah: ", e);
          }
      };

      window.openChat = function(friend) {
          activeChatRoomId = [userData.uid, friend.uid].sort().join("_");
          document.getElementById("search-section").style.display = "none";
          document.getElementById("chat-section").style.display = "flex";
          document.getElementById("chat-title").innerText = friend.username;
          loadMessages();
      };

      window.goBackToSearch = function() {
          if (unsubscribeChat) unsubscribeChat();
          document.getElementById("chat-section").style.display = "none";
          document.getElementById("search-section").style.display = "flex";
      };

      window.sendMsg = async function() {
          const input = document.getElementById("messageInput");
          if (!input.value.trim()) return;

          try {
              await addDoc(collection(db, "chats", activeChatRoomId, "messages"), {
                  senderUid: userData.uid,
                  senderName: userData.username,
                  senderPhoto: userData.photoURL,
                  message: input.value,
                  timestamp: serverTimestamp()
              });
              input.value = "";
          } catch (e) {
              console.error("Khalad dirista ah: ", e);
          }
      };

      function loadMessages() {
          const msgRef = collection(db, "chats", activeChatRoomId, "messages");
          const q = query(msgRef, orderBy("timestamp", "asc"));

          unsubscribeChat = onSnapshot(q, (snapshot) => {
              const chatBox = document.getElementById("chat-box");
              chatBox.innerHTML = "";
              
              snapshot.forEach((doc) => {
                  const data = doc.data();
                  chatBox.innerHTML += `
                      <div class="flex items-start gap-2.5 bg-[#1e293b] p-3 rounded-xl max-w-[80%]">
                          <img src="${data.senderPhoto}" class="w-7 h-7 rounded-full object-cover">
                          <div>
                              <div class="text-[10px] text-sky-400 font-bold">${data.senderName}</div>
                              <div class="text-white text-sm mt-0.5">${data.message}</div>
                          </div>
                      </div>
                  `;
              });
              chatBox.scrollTop = chatBox.scrollHeight;
          });
      }
    </script>
</body>
</html>
