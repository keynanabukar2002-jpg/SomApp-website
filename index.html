<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SomChat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  color: #17202a;
}

header {
  background: #075e54;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
}

.container {
  max-width: 600px;
  margin: 18px auto;
  padding: 12px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px #0000000c;
}

button {
  border: none;
  border-radius: 9px;
  padding: 12px 16px;
  font-size: 15px;
  cursor: pointer;
}

.google-btn {
  width: 100%;
  background: #fff;
  border: 1px solid #ddd;
  color: #222;
  font-weight: bold;
}

.primary-btn {
  background: #128c7e;
  color: white;
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
}

.hidden {
  display: none !important;
}

.status {
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.user-item {
  padding: 13px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  border-radius: 8px;
}

.user-item:hover {
  background: #f0f7f6;
}

#messages {
  height: 320px;
  overflow-y: auto;
  background: #efeae2;
  padding: 12px;
  border-radius: 10px;
  margin: 12px 0;
}

.message {
  background: white;
  padding: 10px 12px;
  border-radius: 10px;
  margin: 8px 0;
  max-width: 85%;
  overflow-wrap: anywhere;
}

.message.mine {
  background: #d9fdd3;
  margin-left: auto;
}

.message small {
  display: block;
  color: #667;
  font-size: 10px;
  margin-top: 5px;
}

.row {
  display: flex;
  gap: 8px;
}

.row input {
  flex: 1;
  min-width: 0;
}

.row button {
  align-self: center;
}

#profile {
  font-size: 13px;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  color: #667;
  font-size: 12px;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>💬 SomChat</h1>
  <p>La xiriir dadka — si fudud oo degdeg ah</p>
</header>

<div class="container">

  <section id="loginCard" class="card">
    <h2>Ku soo dhowow SomChat</h2>
    <p>Google account-kaaga ku gal si aad ula sheekaysato dadka.</p>

    <button id="loginBtn" class="google-btn">
      🌐 Ku gal Google
    </button>

    <p id="loginStatus" class="status"></p>
  </section>

  <section id="app" class="hidden">

    <div class="card">
      <h3>👤 Akoonkaaga</h3>
      <p id="profile"></p>
      <button id="logoutBtn">Ka bax</button>
    </div>

    <div class="card">
      <h3>🔎 Raadi qof</h3>
      <input
        id="searchInput"
        type="text"
        placeholder="Qor magaca ama email-ka..."
      >
      <div id="usersList"></div>
      <p id="searchStatus" class="status"></p>
    </div>

    <div id="chatCard" class="card hidden">
      <h3 id="chatTitle">Wadahadal</h3>
      <p id="chatStatus" class="status"></p>

      <div id="messages"></div>

      <form id="messageForm" class="row">
        <input
          id="messageInput"
          type="text"
          placeholder="Qor fariin..."
          maxlength="2000"
          autocomplete="off"
          required
        >
        <button class="primary-btn" type="submit">Dir</button>
      </form>
    </div>

  </section>

</div>

<footer>SomChat © 2026</footer>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  query,
  where,
  orderBy,
  limit,
  onSnapshot,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCe8ZiIPsTxT1fGA0IT3nIUaQjFK67al0",
  authDomain: "somchat-1910a.firebaseapp.com",
  projectId: "somchat-1910a",
  storageBucket: "somchat-1910a.firebasestorage.app",
  messagingSenderId: "981092599681",
  appId: "1:981092599681:web:cc01745c6831ab8ea44a80",
  measurementId: "G-8B6P8RSDQG"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const provider = new GoogleAuthProvider();

provider.setCustomParameters({
  prompt: "select_account"
});

const $ = (id) => document.getElementById(id);

const loginCard = $("loginCard");
const loginBtn = $("loginBtn");
const loginStatus = $("loginStatus");
const appSection = $("app");
const profile = $("profile");
const logoutBtn = $("logoutBtn");
const searchInput = $("searchInput");
const usersList = $("usersList");
const searchStatus = $("searchStatus");
const chatCard = $("chatCard");
const chatTitle = $("chatTitle");
const chatStatus = $("chatStatus");
const messagesBox = $("messages");
const messageForm = $("messageForm");
const messageInput = $("messageInput");

let currentUser = null;
let selectedUser = null;
let stopMessagesListener = null;
let stopSearchListener = null;
let loginBusy = false;

function showStatus(element, message) {
  element.textContent = message || "";
}

function showLoginError(error) {
  console.error("SomChat login error:", error);

  const messages = {
    "auth/unauthorized-domain":
      "Domain-kan GitHub laguma darin Firebase Authorized domains.",
    "auth/operation-not-allowed":
      "Google Login kama shidna Firebase Authentication.",
    "auth/popup-blocked":
      "Popup-ka waa la xannibay. Isku day mar kale.",
    "auth/network-request-failed":
      "Internet-ka hubi oo mar kale isku day.",
    "auth/too-many-requests":
      "Isku dayo badan ayaa dhacay. Sug wax yar."
  };

  showStatus(
    loginStatus,
    messages[error.code] ||
    "Google Login wuu fashilmay. Hubi internet-ka, kadib isku day mar kale. Koodhka qaladka: " +
    (error.code || "lama yaqaan")
  );
}

loginBtn.addEventListener("click", async () => {
  if (loginBusy) return;

  loginBusy = true;
  loginBtn.disabled = true;
  showStatus(loginStatus, "Google Login ayaa furmaya...");

  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    if (
      error.code === "auth/popup-blocked" ||
      error.code === "auth/operation-not-supported-in-this-environment"
    ) {
      try {
        await signInWithRedirect(auth, provider);
        return;
      } catch (redirectError) {
        showLoginError(redirectError);
      }
    } else if (
      error.code === "auth/popup-closed-by-user" ||
      error.code === "auth/cancelled-popup-request"
    ) {
      showStatus(loginStatus, "Login-ka waa la xiray. Mar kale isku day.");
    } else {
      showLoginError(error);
    }
  } finally {
    loginBusy = false;
    loginBtn.disabled = false;
  }
});

getRedirectResult(auth).catch((error) => {
  showLoginError(error);
});

onAuthStateChanged(auth, async (user) => {
  currentUser = user;

  if (!user) {
    loginCard.classList.remove("hidden");
    appSection.classList.add("hidden");
    profile.textContent = "";
    return;
  }

  loginCard.classList.add("hidden");
  appSection.classList.remove("hidden");

  profile.textContent =
    (user.displayName || "Isticmaale") +
    " · " + (user.email || "");

  try {
    await setDoc(
      doc(db, "users", user.uid),
      {
        uid: user.uid,
        name: user.displayName || "Isticmaale",
        email: user.email || "",
        photoURL: user.photoURL || "",
        lastSeen: serverTimestamp()
      },
      { merge: true }
    );

    startUserSearch();
  } catch (error) {
    console.error(error);
    showStatus(
      searchStatus,
      "Akoonka waa la furay, laakiin kaydinta profile-ka way fashilantay. Hubi Firestore Rules."
    );
  }
});

logoutBtn.addEventListener("click", async () => {
  try {
    await signOut(auth);
    closeChat();
    showStatus(loginStatus, "");
  } catch (error) {
    console.error(error);
    alert("Ka bixitaanku wuu fashilmay. Mar kale isku day.");
  }
});

function startUserSearch() {
  if (stopSearchListener) stopSearchListener();

  const usersQuery = query(
    collection(db, "users"),
    limit(100)
  );

  stopSearchListener = onSnapshot(
    usersQuery,
    (snapshot) => {
      renderUsers(snapshot.docs.map((item) => item.data()));
    },
    (error) => {
      console.error(error);
      showStatus(
        searchStatus,
        "Dadka lama soo qaadi karo. Hubi Firestore Rules."
      );
    }
  );
}

function renderUsers(users) {
  usersList.replaceChildren();

  const term = searchInput.value.trim().toLowerCase();

  const matches = users.filter((user) => {
    if (!currentUser || user.uid === currentUser.uid) {
      return false;
    }

    const name = (user.name || "").toLowerCase();
    const email = (user.email || "").toLowerCase();

    return !term || name.includes(term) || email.includes(term);
  });

  if (matches.length === 0) {
    showStatus(
      searchStatus,
      term
        ? "Qofka lama helin. Hubi magaca ama email-ka."
        : "Weli isticmaalayaal kale lama helin. Qof kale ha galo SomChat."
    );
    return;
  }

  showStatus(searchStatus, "");

  matches.forEach((user) => {
    const item = document.createElement("div");
    item.className = "user-item";

    const name = document.createElement("strong");
    name.textContent = user.name || "Isticmaale";

    const email = document.createElement("div");
    email.textContent = user.email || "";
    email.style.fontSize = "12px";
    email.style.color = "#667";

    item.append(name, email);

    item.addEventListener("click", () => {
      openChat(user);
    });

    usersList.appendChild(item);
  });
}

searchInput.addEventListener("input", () => {
  if (currentUser) startUserSearch();
});

function makeChatId(uid1, uid2) {
  return [uid1, uid2].sort().join("_");
}

async function openChat(user) {
  if (!currentUser) return;

  selectedUser = user;
  chatCard.classList.remove("hidden");

  chatTitle.textContent =
    "💬 " + (user.name || "Wadahadal");

  showStatus(chatStatus, "Wadahadalka ayaa furmaya...");
  messagesBox.replaceChildren();

  if (stopMessagesListener) {
    stopMessagesListener();
    stopMessagesListener = null;
  }

  const chatId = makeChatId(currentUser.uid, user.uid);
  const messagesRef = collection(db, "chats", chatId, "messages");

  try {
    const chatRef = doc(db, "chats", chatId);

    await setDoc(
      chatRef,
      {
        members: [currentUser.uid, user.uid],
        updatedAt: serverTimestamp()
      },
      { merge: true }
    );

    const messagesQuery = query(
      messagesRef,
      orderBy("createdAt", "asc"),
      limit(200)
    );

    stopMessagesListener = onSnapshot(
      messagesQuery,
      (snapshot) => {
        messagesBox.replaceChildren();

        snapshot.forEach((messageDoc) => {
          const message = messageDoc.data();

          const bubble = document.createElement("div");
          bubble.className =
            "message" +
            (message.senderId === currentUser.uid ? " mine" : "");

          const text = document.createElement("div");
          text.textContent = message.text || "";

          const time = document.createElement("small");

          if (message.createdAt?.toDate) {
            time.textContent = message.createdAt
              .toDate()
              .toLocaleString();
          } else {
            time.textContent = "Hadda";
          }

          bubble.append(text, time);
          messagesBox.appendChild(bubble);
        });

        messagesBox.scrollTop = messagesBox.scrollHeight;
        showStatus(chatStatus, "");
      },
      (error) => {
        console.error(error);
        showStatus(
          chatStatus,
          "Fariimaha lama akhrin karo. Hubi Firestore Rules."
        );
      }
    );
  } catch (error) {
    console.error(error);
    showStatus(
      chatStatus,
      "Wadahadalka lama furi karo. Hubi Firestore Rules."
    );
  }
}

function closeChat() {
  selectedUser = null;
  chatCard.classList.add("hidden");

  if (stopMessagesListener) {
    stopMessagesListener();
    stopMessagesListener = null;
  }
}

messageForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!currentUser || !selectedUser) {
    showStatus(chatStatus, "Marka hore dooro qof aad la sheekaysato.");
    return;
  }

  const text = messageInput.value.trim();

  if (!text) return;

  const recipient = selectedUser;
  const sender = currentUser;
  const chatId = makeChatId(sender.uid, recipient.uid);

  messageInput.value = "";
  showStatus(chatStatus, "Fariinta waa la dirayaa...");

  try {
    await addDoc(
      collection(db, "chats", chatId, "messages"),
      {
        text: text,
        senderId: sender.uid,
        recipientId: recipient.uid,
        createdAt: serverTimestamp()
      }
    );

    await setDoc(
      doc(db, "chats", chatId),
      {
        members: [sender.uid, recipient.uid],
        lastMessage: text,
        updatedAt: serverTimestamp()
      },
      { merge: true }
    );

    showStatus(chatStatus, "");
  } catch (error) {
    console.error(error);
    showStatus(
      chatStatus,
      "Fariinta lama dirin. Hubi internet-ka iyo Firestore Rules."
    );
    messageInput.value = text;
  }
});
</script>

</body>
</html>
